            - text: "-valued edge assignments modulo the gauge action at the vertices. The record is: state space the quotient configuration space, observables the gauge-invariant functions generated by Wilson loops, dynamics the transfer operator, symmetries the gauge group, and composition the disjoint union of graphs."
          - paragraph [ref=e4337]:
            - text: "The tame side of this sector admits named invariants: the holonomy of each closed loop, and the character of the representation assigned to it. The wild side does not, and"
            - link "32" [ref=e4338] [cursor=pointer]:
              - /url: "#cor:wild"
            - text: records what that absence means for any candidate invariant. Algebraic quantum field theory axiomatizes a theory as a local net of operator algebras
            - link "[15]" [ref=e4339] [cursor=pointer]:
              - /url: "#bib-haagkastler"
            - text: ", and that framework is where the lattice sector of this family meets the operator-algebra family. Lattice results proved in restricted regimes do not by themselves close the continuum limit, and the invariant record of the limiting object is a separate matter, as"
            - link "18" [ref=e4340] [cursor=pointer]:
