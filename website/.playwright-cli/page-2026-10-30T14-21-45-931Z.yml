          - heading "Conclusion" [level=2] [ref=e5828]
          - paragraph [ref=e5829]:
            - text: The ten families are a working taxonomy. Each carries a classifying invariant or an explicit statement that none is on record, a set of classified islands with the scope they hold in, and an obstruction where an obstruction is proved. The invariant discipline of
            - link "3" [ref=e5830] [cursor=pointer]:
              - /url: "#sec:discipline"
            - text: "is the method by which later volumes record their own classification results: one named invariant, one named range, one named equivalence, one named scope."
          - paragraph [ref=e5831]:
            - text: The four results set the terms of use. Classification shape follows invariant shape (
            - link "8" [ref=e5832] [cursor=pointer]:
              - /url: "#thm:sharpness"
            - text: ), classification in the symplectic family is global (
            - link "10" [ref=e5833] [cursor=pointer]:
              - /url: "#prop:globality"
            - text: ), a class of irreducibles is not closed under the admissible constructions (
            - link "34" [ref=e5834] [cursor=pointer]:
              - /url: "#prop:closure"
            - text: ), and classifying invariants do not establish independence between families (
            - link "36" [ref=e5835] [cursor=pointer]:
              - /url: "#prop:independence"
            - text: ). All four are proved here in full. The fourth is also a standing warning against reading the chart as a decomposition of mathematics.
          - paragraph [ref=e5836]: What remains open is stated plainly. Which of the ten families are fundamental rather than presentations of others is not known. Whether any two families are logically independent is not known. Whether the ten families generate all admissible physical systems under the admissible constructions is a conjecture. The taxonomy is a place to record classification results, and it is not itself the classification.
          - heading "Computational evidence" [level=2] [ref=e5837]
          - paragraph [ref=e5838]: The code accompanying this paper supplies executable models of the taxonomy and small computational checks of two claims. Computational evidence is evidence and never proof. The executable models are written against the family, invariant, and construction classes of the typed taxonomy layer, and they are validated against the specifications recorded in the paper. They are not machine checked.
