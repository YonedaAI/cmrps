          - paragraph [ref=e2858]:
            - text: The global picture is where the family’s classification content lives, and the corpus does not fix a list of global invariants. Candidates in ordinary use are the de Rham class of the symplectic form, Chern classes of compatible almost complex structures, and flux data. The periodic chart records “topology of
