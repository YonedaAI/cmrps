            - link "[29]" [ref=e3439] [cursor=pointer]:
              - /url: "#bib-adyanrabin"
            - text: . An algorithm producing a decidable classifying invariant would decide homeomorphism by comparing outputs, which contradicts undecidability. So no such algorithm exists on the unrestricted class. ◻
