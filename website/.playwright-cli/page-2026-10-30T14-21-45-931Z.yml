            - text: "is a negative theorem and it is used here as a discipline rule: an equivalence record that does not name the preserved structure is incomplete."
          - 'heading "Family IX: discrete combinatorial structures" [level=2] [ref=e4222]'
          - paragraph [ref=e4223]: This family represents lattice and network models. Its state spaces are configuration spaces on a graph or lattice, its observables are local functions, and its composition rule is disjoint union or tensor product.
          - paragraph [ref=e4224]:
            - text: The proved results are regime-restricted and the impossibility results are not. Lattice gauge results hold in restricted regimes and do not by themselves close a continuum limit. The obstructions recorded against this family come from wild representation theory, and the underlying mathematics is commutative algebra and equivariant homotopy theory, which the taxonomy places in Family X. On the commutative side, rank-two isomorphism classes of maximal Cohen-Macaulay modules over the generic determinantal ring admit no parameterization by a finite-dimensional variety
