          - generic [ref=e24]:
            - heading "Abstract" [level=2] [ref=e25]
            - text: "This paper develops the family-level taxonomy that a classification of mathematical representations of physical systems requires. Ten structural families organize mathematical structures capable of representing physical systems: symplectic and Poisson structures, Hilbert spaces and operator algebras, smooth manifolds and geometric structures, principal bundles and connections, probability and measure-theoretic structures, topological and higher-categorical structures, dynamical systems and operator semigroups, tensor categories and compositional structures, discrete combinatorial structures, and derived and homotopical structures. Each family is presented with its defining invariant, its classified islands, and its recorded obstructions. Four results govern how the taxonomy may be used. A sharpness criterion shows that a family admits a classification of a prescribed shape only when its classifying invariant takes values in a set of matching cardinality or geometric structure. A globality proposition shows that no local invariant classifies inside the symplectic family. A non-closure proposition shows that a class of objects irreducible under direct sum is not itself closed under direct sum. An independence proposition shows that two families may each carry a classifying invariant and still fail to be logically independent. The ten families are candidates for an organizing taxonomy and not a completed classification, and no completeness claim is made for them."
          - heading "Introduction" [level=2] [ref=e26]
          - paragraph [ref=e27]:
            - text: "The classification of finite simple groups supplies the architectural analogy for this program: complicated structures understood through simpler constituents, gathered into families, with a short list of exceptions recorded beside them"
            - link "[1]" [ref=e28] [cursor=pointer]:
              - /url: "#bib-cfsg"
            - text: ","
            - link "[2]" [ref=e29] [cursor=pointer]:
              - /url: "#bib-solomon"
            - text: ". The analogy is instructive and it is also incomplete. The template program is complete and a uniform description analogous to the Dynkin diagrams is missing from it: the assessment attributed to Gorenstein that “no one has yet found a clean uniform description of the finite simple groups” is recorded in the survey literature"
            - link "[1]" [ref=e30] [cursor=pointer]:
              - /url: "#bib-cfsg"
            - text: ","
            - link "[2]" [ref=e31] [cursor=pointer]:
              - /url: "#bib-solomon"
            - text: . Classification and parameterization are separate achievements, and the template program has achieved the first without the second.
          - paragraph [ref=e32]: This paper works at the level where that distinction bites first. Before any volume can classify physical systems, it needs a vocabulary of the mathematical families capable of representing them, a record of what is classified inside each family, and a discipline for choosing the data that identification actually runs on. Those are the three deliverables here. The families are recorded as candidates, their classified islands and their obstructions are recorded with the status the literature supports, and the invariant discipline is stated as a set of definitions and results that later volumes can instantiate.
          - paragraph [ref=e33]:
            - text: Four results carry the argument.
            - link "8" [ref=e34] [cursor=pointer]:
              - /url: "#thm:sharpness"
            - text: "bounds the shape of any classification by the shape of the classifying invariant: a family whose invariant takes values in a finite set has finitely many classes, a family with uncountably many classes admits no invariant into a countable set, and a family whose classes are the image of a morphism of finite type is parameterized by a constructible set."
            - link "10" [ref=e35] [cursor=pointer]:
              - /url: "#prop:globality"
            - text: shows that inside the symplectic family every local invariant is constant, so classification content there is global and topological.
            - link "34" [ref=e36] [cursor=pointer]:
              - /url: "#prop:closure"
            - text: shows that a class of objects irreducible under direct sum is never closed under direct sum, so passing to a closure always adds objects.
            - link "36" [ref=e37] [cursor=pointer]:
              - /url: "#prop:independence"
            - text: shows that two families may both carry classifying invariants and still fail to be logically independent.
