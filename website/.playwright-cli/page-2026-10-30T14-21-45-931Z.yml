          - paragraph [ref=e5671]:
            - text: The research goal at this level is to discover which distinctions are fundamental and which arise from different mathematical presentations.
            - link "37" [ref=e5672] [cursor=pointer]:
              - /url: "#prop:mixed"
            - text: is a small instance of that question, and it is the reason
            - link "4" [ref=e5673] [cursor=pointer]:
              - /url: "#def:structural-family"
            - text: defines a family by the structure it singles out rather than by membership of records.
          - paragraph [ref=e5674]:
            - text: "Two further relations between families are worth naming. A family may be a special case of another: the commutative unital"
            - generic [ref=e5676]:
              - math [ref=e5678]:
                - generic [ref=e5681]:
                  - generic [ref=e5682]: C
                  - generic [ref=e5683]: ∗
              - generic [ref=e5686]:
                - text: C
                - generic [ref=e5687]: ∗
            - text: "-algebras are a full subcategory of the operator-algebra family and are equivalent to compact Hausdorff spaces, so the two presentations carry the same information"
            - link "[24]" [ref=e5692] [cursor=pointer]:
              - /url: "#bib-gelfand-duality"
            - text: . A family may be generated from another under constructions, in the sense of
            - link "4" [ref=e5693] [cursor=pointer]:
              - /url: "#def:structural-family"
            - text: . Both relations are structural statements about the families, and neither is a statement about the physical systems the families represent.
          - heading "The taxonomy as an interface" [level=2] [ref=e5694]
          - paragraph [ref=e5695]: Later volumes classify systems. The taxonomy is the place they record what they find, and the record format is fixed here so that results produced independently are comparable.
          - paragraph [ref=e5696]:
            - text: "A classification record in a later volume has six fields: the family, the sector, the classifying invariant together with its range, the equivalence the invariant is complete for, the scope in which completeness holds, and the achievement kind of"
            - link "12" [ref=e5697] [cursor=pointer]:
              - /url: "#def:kinds"
            - text: . A record with an empty invariant field is a record of an absence and not a classification.
          - paragraph [ref=e5699]:
            - strong [ref=e5700]: Proposition 38
            - text: (Comparability of records).
            - emphasis [ref=e5701]: Two classification records are comparable when they agree on family, sector, and equivalence. If they agree on those three fields and both name classifying invariants, then the two invariants are related by a bijection between their attained values on that sector.
          - paragraph [ref=e5703]:
            - emphasis [ref=e5704]: Proof.
            - text: Both invariants are complete for the same equivalence on the same set of objects, so each induces a bijection between the set of classes and its own attained values. The composite of one bijection with the inverse of the other is a bijection between the two sets of attained values. ◻
          - paragraph [ref=e5705]:
            - link "38" [ref=e5706] [cursor=pointer]:
              - /url: "#prop:comparable"
            - text: is what makes the family rows usable across volumes. Two independently obtained invariants for the same sector are not competing claims; they are coordinate descriptions of the same class set, and each can be converted into the other once both are recorded. What is not automatic is agreement on scope, since two records may cover different sub-sectors. Scope comparison is therefore a manual step, and the family tables above state the scope of every row they carry.
          - paragraph [ref=e5707]:
            - text: The interface also fixes how an obstruction is recorded. An impossibility result names the sector, names the candidate invariant range it excludes, and cites the theorem that excludes it. An absence of record names the sector and states that no classification is on record. The two are different fields and never share a row, as Table
            - link "1" [ref=e5708] [cursor=pointer]:
              - /url: "#tab:kinds"
            - text: shows.
          - heading "Scope of the family taxonomy" [level=2] [ref=e5709]
          - paragraph [ref=e5710]: Four limits bound the use of the ten-family chart.
          - paragraph [ref=e5711]:
            - text: The families are candidates and not a completed classification. They are recorded as candidate organizing families, and some may be unified or shown to be special cases of others. The word “candidate” in
            - link "4" [ref=e5712] [cursor=pointer]:
              - /url: "#def:structural-family"
            - text: is load-bearing.
          - paragraph [ref=e5713]:
            - text: No completeness claim is available. Whether every admissible physical system lies in the closure of these ten families under the admissible constructions is unproved, and the conjectural identity that states it is a registered conjecture.
            - link "34" [ref=e5714] [cursor=pointer]:
              - /url: "#prop:closure"
            - text: shows that a class of irreducibles is not closed under the constructions, so any completeness claim has to describe a closure and the objects it adds, not only a list of generators.
          - paragraph [ref=e5715]:
            - text: Status tokens are coarse. A single status per family hides the finite-dimensional, amenable, and wild sectors of the operator-algebra family at once, as
            - link "22" [ref=e5716] [cursor=pointer]:
              - /url: "#rem:mcduff"
            - text: records. Table
            - link "5" [ref=e5717] [cursor=pointer]:
              - /url: "#tab:families"
            - text: gives one row per family and states a scope limit in its last column; where the sectors of a family differ in kind, Tables
            - link "1" [ref=e5718] [cursor=pointer]:
              - /url: "#tab:kinds"
            - text: and
            - link "3" [ref=e5719] [cursor=pointer]:
              - /url: "#tab:independence"
            - text: give the finer breakdown.
          - paragraph [ref=e5720]:
            - text: Independence is unrecorded.
            - link "36" [ref=e5721] [cursor=pointer]:
              - /url: "#prop:independence"
            - text: shows the question is not settled by invariants, and no theorem settles it. Statements about the logical relations between families are therefore hypotheses in later volumes and not lemmas.
