          - paragraph [ref=e3432]:
            - strong [ref=e3433]: Proposition 23
            - text: (Recognition without classification).
            - emphasis [ref=e3434]: There exist four-manifolds for which homeomorphism is undecidable. Consequently no algorithm whose output is a classifying invariant in a decidable range can classify all four-manifolds, and any classification statement in this regime must restrict the class of manifolds under consideration.
          - paragraph [ref=e3436]:
            - emphasis [ref=e3437]: Proof.
            - text: Undecidability of the homeomorphism problem for the stated family of four-manifolds is proved in
