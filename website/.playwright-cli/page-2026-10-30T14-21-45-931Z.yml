          - paragraph [ref=e2814]:
            - text: Recognition is therefore the weakest of the three tasks when the invariant is computable, and it is the one the atlas supplies in practice
            - link "[3]" [ref=e2815] [cursor=pointer]:
              - /url: "#bib-atlas"
            - text: . Parameterization is the strongest. The three are separate achievements, and a family row that reports one of them does not report the others.
          - 'heading "Family I: symplectic and Poisson structures" [level=2] [ref=e2816]'
          - paragraph [ref=e2817]:
            - text: This family singles out classical mechanics. Its defining structural data is a symplectic or Poisson state space; systems in it carry function algebras of observables and Hamiltonian dynamics
            - link "[7]" [ref=e2818] [cursor=pointer]:
              - /url: "#bib-poisson"
            - text: . A record whose state space is symplectic belongs to this family whatever else its components carry.
          - paragraph [ref=e2819]:
            - text: The local picture is closed. Darboux’s theorem gives a normal form and
            - link "10" [ref=e2820] [cursor=pointer]:
              - /url: "#prop:globality"
            - text: "extracts its classification consequence. For Poisson manifolds the local picture is also closed and it is not empty: near a point of rank"
            - generic [ref=e2822]:
              - math [ref=e2824]:
                - generic [ref=e2826]:
                  - generic [ref=e2827]: "2"
                  - generic [ref=e2828]: k
              - generic [ref=e2830]: 2k
            - text: a Poisson manifold splits as a symplectic factor times a transverse Poisson factor
            - link "[7]" [ref=e2831] [cursor=pointer]:
              - /url: "#bib-poisson"
            - text: . The symplectic leaves foliate the manifold, and on the dual of a Lie algebra the leaves of the Kirillov-Kostant-Souriau structure are the coadjoint orbits
            - link "[7]" [ref=e2832] [cursor=pointer]:
              - /url: "#bib-poisson"
            - text: .
          - paragraph [ref=e2834]:
