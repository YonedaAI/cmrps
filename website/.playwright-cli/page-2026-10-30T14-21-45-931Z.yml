            - text: . The spectrum is a classifying invariant for the space side and the algebra is a classifying invariant for the algebra side, and each determines the other. Two families related by such a correspondence cannot be logically independent, because every statement about one transfers to the other. The existence of a classifying invariant in each family is therefore silent on the question of independence. ◻
