          - paragraph [ref=e3588]:
            - text: Anomalies in this family are classified as obstructions rather than as objects. The fermionic anomaly is the non-trivializability of the determinant or Pfaffian line of the Dirac operator, and the gauge anomaly is a cohomological obstruction; quantization exists only when the relevant obstructions vanish
            - link "[19]" [ref=e3589] [cursor=pointer]:
              - /url: "#bib-anomaly"
            - text: . A classification of obstructions is a complete classification of the cases in which the theory exists.
          - 'heading "Family V: probability and measure-theoretic structures" [level=2] [ref=e3590]'
          - paragraph [ref=e3591]: This family represents statistical physics. Its state spaces are spaces of probability measures or density operators, its observables are measurable functions or operators, and its composition rule is product measure or tensor product.
          - paragraph [ref=e3592]: The classical row carries the one uniqueness result in the ten families.
          - paragraph [ref=e3594]:
            - strong [ref=e3595]: Theorem 25
            - text: (Chentsov).
            - emphasis [ref=e3596]:
              - text: On the classical statistical state space of a finite sample space, the Fisher metric is the unique Riemannian metric, up to a positive constant factor, that is monotone under stochastic maps. The uniqueness is recorded in the survey literature as the classical anchor of the monotone-metric classification
              - link "[28]" [ref=e3597] [cursor=pointer]:
                - /url: "#bib-petz"
              - text: ", and the quantum analogue there is parametric rather than unique."
          - paragraph [ref=e3598]:
            - text: The quantum analogue fails to be unique. Monotone metrics on quantum state spaces are classified parametrically by operator monotone functions, which form a continuum and not a finite list
            - link "[28]" [ref=e3599] [cursor=pointer]:
              - /url: "#bib-petz"
            - text: . Classical uniqueness therefore does not transfer to the quantum case, and any classification statement in this family must record which side of that line it stands on.
          - paragraph [ref=e3601]:
            - emphasis [ref=e3602]: Remark 26
            - text: (Scope of the uniqueness). The uniqueness is a statement about metrics monotone under stochastic maps on the classical state space. It is not a classification of classical statistical systems, and it is not a statement about quantum state spaces. Uniqueness and classification are separate achievements, as
            - link "9" [ref=e3603] [cursor=pointer]:
              - /url: "#cor:parameterization"
            - text: records.
