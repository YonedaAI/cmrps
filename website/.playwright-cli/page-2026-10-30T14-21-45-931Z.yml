            - text: (Structure preservation is load-bearing).
            - emphasis [ref=e4218]:
              - text: There exist finite groups that are not isomorphic and whose representation categories are equivalent as plain tensor categories. Consequently an equivalence that forgets the symmetric structure cannot recover the group, and any classification in this family must state which layer of structure its equivalence preserves
