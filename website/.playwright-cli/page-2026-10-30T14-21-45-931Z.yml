          - 'heading "Family VIII: tensor categories and compositional structures" [level=2] [ref=e4179]'
          - paragraph [ref=e4180]: This family represents quantum information. Its objects are tensor categories, its morphisms are tensor functors, and its composition rule is the monoidal product.
