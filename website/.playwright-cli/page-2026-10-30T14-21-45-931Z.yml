            - text: are tested in order. If no theorem on record names a classifying invariant and no impossibility theorem is on record, the kind is no record, and no other kind applies since the others all presuppose one of the two kinds of record. If an impossibility theorem is on record, the kind is impossible, and no other kind applies. If a theorem names a classification and the classified target is the obstructions, the kind is complete as an obstruction classification. If it names a classification of objects, the attained values either form an explicitly described subset of a structured range or they do not, which is exactly the remaining pair. The tests are disjoint at each stage and cover every case at each stage, so one and only one kind applies. ◻
