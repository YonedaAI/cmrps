            - text: "state the equivalent contraction form used here, monotone under general stochastic maps. The two formulations are connected as follows: a congruent embedding and its stochastic inverse force invariance under invertible stochastic maps (permutations included), and the contraction inequality for general stochastic maps is the monotonicity of"
            - link "3" [ref=e4717] [cursor=pointer]:
