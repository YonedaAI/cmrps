          - paragraph [ref=e12906]:
            - text: What the section establishes is a gradient. Entanglement-wedge reconstruction (
            - link "38" [ref=e12907] [cursor=pointer]:
              - /url: "#thm:dhw"
            - text: ) and the entropy cone (
            - link "43" [ref=e12908] [cursor=pointer]:
              - /url: "#thm:cone"
            - text: ) are theorems. The entropy formula itself (
            - link "40" [ref=e12909] [cursor=pointer]:
              - /url: "#rem:rt"
            - text: ) is a proposal with derived special cases. The emergence of geometry from entanglement (
            - link "41" [ref=e12910] [cursor=pointer]:
              - /url: "#rem:vr"
            - text: ) is an argument. Toy models (
            - link "42" [ref=e12911] [cursor=pointer]:
              - /url: "#rem:happy"
            - text: ) demonstrate mechanisms, not nature.
          - heading "Thermodynamic geometry" [level=2] [ref=e12912]
          - paragraph [ref=e12913]:
            - text: The oldest working dictionary between information metrics and physical curvature is thermodynamic. Weinhold proposed the Hessian of internal energy as a metric on equilibrium states
            - link "[28]" [ref=e12914] [cursor=pointer]:
              - /url: "#bib-weinhold"
            - text: ; Ruppeiner proposed the negative Hessian of entropy and read its curvature as a measure of microscopic interaction
            - link "[23]" [ref=e12915] [cursor=pointer]:
              - /url: "#bib-ruppeiner"
            - text: . The Ruppeiner metric of
            - link "9" [ref=e12916] [cursor=pointer]:
              - /url: "#def:ruppeiner"
            - text: is, up to sign convention and a conformal factor, the Fisher metric of thermodynamic fluctuation theory, so the dictionary is an instance of information geometry in physical coordinates. The proposal that Einstein’s equations are an equation of state of this thermodynamic structure
            - link "[14]" [ref=e12917] [cursor=pointer]:
              - /url: "#bib-jacobson"
            - text: is the sharpest form of the gravity-thermodynamics link on record, and it is a derivation conditional on the horizon thermodynamics it assumes.
