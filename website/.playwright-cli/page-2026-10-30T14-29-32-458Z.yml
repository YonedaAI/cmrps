              - paragraph [ref=e13858]:
                - link "Theorem 34" [ref=e13859] [cursor=pointer]:
                  - /url: "#thm:gelfand"
                - link "Theorem 38" [ref=e13860] [cursor=pointer]:
                  - /url: "#thm:dhw"
                - text: "recover structure from probes. Recovery is not dynamics: no reconstruction theorem on record recovers interacting gravitational dynamics from entanglement data."
            - term [ref=e13861]: Origin of curvature
            - definition [ref=e13862]:
              - paragraph [ref=e13863]:
                - text: The curvature computed in
                - link "Proposition 24" [ref=e13864] [cursor=pointer]:
                  - /url: "#prop:qubit-sld"
                - link "Proposition 45" [ref=e13865] [cursor=pointer]:
                  - /url: "#prop:ideal-gas"
                - text: is intrinsic to a state space or to an equilibrium manifold. The proposed identification of such curvature with spacetime curvature is a further hypothesis, and the computations here neither support nor refute it.
          - paragraph [ref=e13866]:
            - text: The metric ambiguity is the sharpest of the three. In classical statistical mechanics the ruler is unique, so a correspondence of the form “statistical geometry equals physical geometry” has no normalization freedom beyond a constant. In quantum statistical mechanics the ruler is a function
            - generic [ref=e13868]:
              - math [ref=e13870]:
                - generic [ref=e13871]: f
              - generic [ref=e13875]: f
            - text: ", and two different rulers give genuinely different geometries on the same state space, as"
            - link "19" [ref=e13876] [cursor=pointer]:
              - /url: "#prop:nonunique"
            - text: "exhibits. Any claim that a quantum state space “has” a geometry must therefore answer: which monotone metric, and why."
          - paragraph [ref=e13877]: "The emergent-spacetime program states a central test with four targets: recover, from primitive categorical or informational objects, (i) gauge connections and curvature, (ii) quantum states and observables, (iii) interacting gauge-field dynamics, and (iv) spacetime geometry and gravitational dynamics, without assuming at the outset the spacetime geometry the reconstruction is meant to explain. Each target sits at a different point of the proved-to-proposed gradient."
          - generic [ref=e13878]:
            - term [ref=e13879]: Connections and curvature
            - definition [ref=e13880]:
              - paragraph [ref=e13881]: Thermodynamic geometry shows that curvature can be computed from an information object (the entropy function) in equilibrium settings, and the qubit computations show that a state space can carry constant-curvature geometry. The proposed identification of such curvature with physical or spacetime curvature is unestablished.
            - term [ref=e13882]: States and observables
            - definition [ref=e13883]:
              - paragraph [ref=e13884]:
                - text: The reconstruction pattern proves recovery of
