            - text: ). Second, a construction must map Riemannian geometry on state space to a Lorentzian metric on spacetime; the Ryu-Takayanagi formula instead relates bulk areas to subregion entropies of a fixed state, and its derivations cover only symmetric or semiclassical regimes
            - link "[3]" [ref=e13925] [cursor=pointer]:
