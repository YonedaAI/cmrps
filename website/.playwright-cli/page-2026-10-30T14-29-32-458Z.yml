            - text: are numerical checks of exactly those statements.
          - paragraph [ref=e14769]:
            - text: The van der Waals curvature values are numerical. They are computed away from the critical point and are consistent with the interaction reading of the Ruppeiner curvature; no theorem here connects thermodynamic curvature to microscopic dynamics in general systems. The parameter
            - generic [ref=e14771]:
              - math [ref=e14773]:
                - generic [ref=e14774]: f
              - generic [ref=e14778]: f
            - text: of the Petz family is not derived from physical principles in this paper beyond the partial selections of
            - link "13" [ref=e14779] [cursor=pointer]:
              - /url: "#lem:kl"
            - text: ", so the metric ambiguity of"
            - link "19" [ref=e14780] [cursor=pointer]:
              - /url: "#prop:nonunique"
            - text: is exhibited, not resolved.
          - paragraph [ref=e14781]: No statement of this paper derives Einstein’s equations, or any gravitational dynamics, from information-theoretic axioms. The entropy formula remains a proposal outside its derived special cases, and the continuum convergence of weighted-nerve constructions is unestablished and unused.
          - paragraph [ref=e14782]: "The status of the correspondence is mathematical, not empirical. Nothing here is a claim about measured physics, about the value of any physical constant, or about the correctness of any experiment. On the scale of mathematical achievement (formulation, rigorous theorem, physical validation) the results of this paper sit on the first two levels: the formulations are precise, the theorems are proved or quoted with hypotheses, and physical validation of any gravity-information correspondence is not part of this paper."
          - heading "Conclusion" [level=2] [ref=e14783]
          - paragraph [ref=e14784]: "The relationship between information geometry and gravity is a correspondence of two very different evidential statuses, and the classification viewpoint makes the boundary precise. Classical statistical geometry is rigid: the Fisher metric is the unique monotone ruler, and the simplex carries a round-sphere geometry. Quantum statistical geometry is parametric: the Petz family is infinite, the ambiguity appears already on qubits, and any dictionary that assigns geometry to quantum states must name its metric. Uniqueness survives exactly on the commutative locus, where every normalized monotone metric restricts to the Fisher metric."
          - paragraph [ref=e14785]:
            - text: The proofs contributed here fix that boundary at six points. Fisher monotonicity is proved by a Cauchy-Schwarz argument and checked against two thousand random trials. The non-proportionality of the symmetric logarithmic derivative and Wigner-Yanase metrics on qubit states is an explicit computation at one state, and it settles the uniqueness question for the quantum case in the negative. The commutative-locus statement localizes the surviving uniqueness with a diagonal computation and Chentsov’s theorem. The symmetric logarithmic derivative metric of the open qubit state space is an open hemisphere of the round three-sphere of radius one, computed in Bloch coordinates and identified by the substitution
            - generic [ref=e14787]:
              - math [ref=e14789]:
                - generic [ref=e14791]:
                  - generic [ref=e14792]: r
                  - generic [ref=e14793]: =
                  - generic [ref=e14794]: sin
                  - generic: ⁡
                  - generic [ref=e14795]: χ
              - generic [aria-hidden] [ref=e14796]:
                - generic [ref=e14797]: r =
                - generic [ref=e14798]: sin χ
            - text: ; the fidelity metric is one quarter of it. The ideal gas Ruppeiner metric is flat by an explicit coordinate change, and the van der Waals curvature is nonzero away from the critical point and grows toward it.
          - paragraph [ref=e14799]: The geometric side of the correspondence is graded the same way. Entanglement-wedge reconstruction and the entropy cone for at most five regions are theorems. The qubit computations show that constant-curvature geometry arises from state spaces by construction. The entropy formula in general settings, the emergence of spacetime from entanglement, and gravity from information geometry are proposals and arguments, and this paper has kept them at that status.
          - paragraph [ref=e14800]:
            - text: What follows for the classification program is a concrete constraint. Information-geometric invariants classify classical statistical systems without a choice problem and quantum systems only after a choice of
            - generic [ref=e14802]:
              - math [ref=e14804]:
                - generic [ref=e14805]: f
              - generic [ref=e14809]: f
            - text: . A restricted classification statement in this area must therefore fix the monotone metric as part of its data. The three dictionaries of
            - link "1" [ref=e14810] [cursor=pointer]:
              - /url: "#tab:dictionaries"
            - text: "are not interchangeable, and only the state-space dictionary is established without qualification. The central question of the emergent-spacetime program stays open: whether the structures examined here recover an interacting physical theory without assuming the spacetime geometry they aim to explain. The evidence assembled here locates that question rather than answers it."
