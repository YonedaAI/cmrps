            - text: are quoted from the literature with their hypotheses and are not reproved here. The proofs given in this paper are those of
            - link "Proposition 14" [ref=e14762] [cursor=pointer]:
              - /url: "#prop:monotone"
            - link "Proposition 19" [ref=e14763] [cursor=pointer]:
