        - generic [ref=e23]:
          - generic [ref=e24]:
            - heading "Abstract" [level=2] [ref=e25]
            - text: "This paper examines the relationship between information geometry and gravity from the viewpoint of classification: which geometric structures on state spaces are established mathematics, and which proposed correspondences remain conjectural. Six results are established in finite dimensions. The Fisher family is unique up to a positive constant among metric families on the probability simplices that are monotone under stochastic maps, and monotonicity is proved directly. On quantum state spaces uniqueness fails: monotone metrics form the Petz family of operator monotone functions, and the symmetric logarithmic derivative and Wigner-Yanase metrics are not proportional on qubit states. Every metric of the family restricts to the Fisher metric on commuting states, so uniqueness holds exactly on the commutative locus. The symmetric logarithmic derivative metric makes the open qubit state space an open hemisphere of the round three-sphere of radius one. Thermodynamic Ruppeiner geometry of the ideal gas is flat, and a van der Waals model has nonzero scalar curvature away from the critical region. Entanglement-wedge reconstruction and the holographic entropy cone for at most five regions are theorems; the entropy formula and the emergence of spacetime from entanglement are proposals, and the correspondence between gravity and information geometry is proposed, not proved."
          - heading "Introduction" [level=2] [ref=e26]
          - paragraph [ref=e27]: "Two research programs meet at the phrase “gravity from information.” One asks how statistical structure on spaces of states acquires Riemannian geometry. The other asks how spacetime geometry, and eventually gravitational dynamics, could be reconstructed from quantum information. The first program contains complete theorems. The second contains proposals, one reconstruction theorem of quantum information theory, and a central question that is open. This paper develops the first program in finite dimensions, records exactly what the second program has and has not established, and identifies the point where the two touch: the choice of metric on a space of quantum states."
          - paragraph [ref=e28]:
            - text: The information-geometric side is sharp. Chentsov’s theorem
            - link "[4]" [ref=e29] [cursor=pointer]:
              - /url: "#bib-chentsov"
            - text: ","
            - link "[22]" [ref=e30] [cursor=pointer]:
              - /url: "#bib-petz-sudar"
            - text: says that on the probability simplex there is, up to a positive constant, exactly one Riemannian metric that decreases under stochastic maps, the Fisher metric. Petz and Sudár
            - link "[22]" [ref=e31] [cursor=pointer]:
              - /url: "#bib-petz-sudar"
            - text: "extended the question to density matrices and found the opposite of uniqueness: the monotone metrics on finite-dimensional state spaces are classified by operator monotone functions, an infinite family. This uniqueness-then-failure pattern is the spine of the paper. It is also a constraint on classification: a proposed dictionary that assigns geometry to quantum states has to name which member of the Petz family it uses, and the classical uniqueness that motivates such a dictionary does not transfer."
          - paragraph [ref=e32]:
            - text: The holographic side is graded. Within quantum information theory, the entanglement-wedge reconstruction theorem of Dong, Harlow, and Wall
            - link "[5]" [ref=e33] [cursor=pointer]:
              - /url: "#bib-dhw"
            - text: is proved, and the holographic entropy cone is complete for at most five boundary regions
            - link "[1]" [ref=e34] [cursor=pointer]:
              - /url: "#bib-bao"
            - text: ","
            - link "[11]" [ref=e35] [cursor=pointer]:
              - /url: "#bib-hc5"
            - text: . The Ryu-Takayanagi formula
            - link "[24]" [ref=e36] [cursor=pointer]:
              - /url: "#bib-rt"
            - text: is argued from AdS/CFT and derived for spherical vacuum regions in any dimension
            - link "[3]" [ref=e37] [cursor=pointer]:
              - /url: "#bib-chc"
            - text: ; the static formula follows from replica methods
            - link "[18]" [ref=e38] [cursor=pointer]:
              - /url: "#bib-lm"
            - text: ", and the covariant formula with extremal surfaces was proposed in"
            - link "[12]" [ref=e39] [cursor=pointer]:
              - /url: "#bib-hrt"
            - text: and derived in
            - link "[6]" [ref=e40] [cursor=pointer]:
              - /url: "#bib-dlr"
            - text: . For general regions and states it remains a proposal. Van Raamsdonk’s suggestion that entanglement builds spacetime
            - link "[27]" [ref=e41] [cursor=pointer]:
              - /url: "#bib-vr"
            - text: is an argument from limiting cases.
          - paragraph [ref=e42]:
            - text: The thermodynamic side supplies the oldest working dictionary between information metrics and physical curvature. The Ruppeiner metric, the negative Hessian of entropy, is flat for the ideal gas and develops curvature in interacting models
            - link "[23]" [ref=e43] [cursor=pointer]:
              - /url: "#bib-ruppeiner"
            - text: . A separate thermodynamic route derives the Einstein equation of state from local horizon thermodynamics
            - link "[14]" [ref=e44] [cursor=pointer]:
              - /url: "#bib-jacobson"
            - text: ; it does not use Ruppeiner curvature, and the relation between the two thermodynamic constructions is itself a proposed correspondence.
          - paragraph [ref=e45]: "The paper proves six results. Fisher monotonicity is proved directly, and the classical uniqueness of Chentsov is recorded with its exact scope. The Petz family is recorded, and non-uniqueness is exhibited by explicit computation: on the qubit state space the symmetric logarithmic derivative metric and the Wigner-Yanase metric have different radial-to-transverse ratios. Uniqueness is then localized: every metric of the family restricts to the Fisher metric on commuting states, by a computation on diagonal tangent vectors together with Chentsov’s theorem. The symmetric logarithmic derivative metric on the open qubit state space is computed in Bloch coordinates and identified with an open hemisphere of the round three-sphere of radius one. Finally the Ruppeiner metric of the ideal gas is proved flat by an explicit coordinate change, and the van der Waals scalar curvature is computed away from the critical point."
          - paragraph [ref=e46]: This paper treats information geometry as an invariant discipline for spaces of statistical and quantum states and tests whether it can support a geometric correspondence with gravity. On the commutative locus the invariant metric is unique. Off it, the metric is parametric, and any correspondence of the form “state space geometry equals physical geometry” inherits that parameter. Reconstruction results (Gelfand, Stone, Naimark) and entanglement-wedge reconstruction recover structure from probes; they do not by themselves produce gravitational dynamics. Whether the proposed structures recover an interacting physical theory without assuming at the outset the spacetime geometry they aim to explain remains open.
          - paragraph [ref=e47]: The phrase “geometric correspondence” hides three different dictionaries, and the paper keeps them apart. The state-space dictionary assigns Riemannian geometry to spaces of statistical or quantum states, and is a theorem. The thermodynamic dictionary assigns curvature to equilibrium manifolds and reads it as an interaction diagnostic, and is a working practice with computed examples. The spacetime dictionary assigns bulk geometry to boundary entanglement, and is a proposal with derived special cases. Only the first is established without qualification, and only the first is used as a premise below.
