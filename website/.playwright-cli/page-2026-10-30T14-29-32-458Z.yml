          - paragraph [ref=e14712]:
            - text: The Haskell module
            - code [ref=e14713]: src/vol-09-gravity-information-geometry/Instances.hs
            - text: declares instances of shared taxonomy classes (structural families, invariant records, decomposition hooks) for the systems of this paper (classical statistical models, quantum state systems, entanglement-wedge data, thermodynamic systems, weighted-nerve models). The module is executable vocabulary validated against the statements above; it is not machine-checked, and no claim of formal verification is made for it. The paths in this section are relative to the manuscript source tree; no permanent archival identifier for the code is available at the time of writing, and none is invented here.
          - heading "Open questions" [level=2] [ref=e14714]
          - paragraph [ref=e14715]: Six questions follow from the results and constraints of this paper. Each is open in the sense that no theorem cited here resolves it.
          - list [ref=e14716]:
            - listitem [ref=e14717]:
              - paragraph [ref=e14718]:
                - emphasis [ref=e14719]: Which monotone metric?
                - text: "Partial selection principles exist: the expansion of the Umegaki relative entropy selects the Bogoliubov-Kubo-Mori member, quantum estimation selects the symmetric logarithmic derivative member"
                - link "[2]" [ref=e14720] [cursor=pointer]:
                  - /url: "#bib-braunstein-caves"
                - text: ","
                - link "[20]" [ref=e14721] [cursor=pointer]:
                  - /url: "#bib-petz-1996"
                - text: ", and the holographic canonical-energy analysis selects the Bogoliubov-Kubo-Mori member for that quantity"
                - link "[17]" [ref=e14722] [cursor=pointer]:
                  - /url: "#bib-lashkari-vr"
                - text: . Does a physical principle select a member
                - generic [ref=e14724]:
                  - math [ref=e14726]:
                    - generic [ref=e14727]: f
                  - generic [ref=e14731]: f
                - text: for a general gravity-information dictionary, or does the metric ambiguity of
                - link "19" [ref=e14732] [cursor=pointer]:
                  - /url: "#prop:nonunique"
                - text: persist in every such application?
            - listitem [ref=e14733]:
              - paragraph [ref=e14734]:
                - emphasis [ref=e14735]: Continuum convergence.
                - text: Do the finite-groupoid and weighted-nerve constructions of the emergent-spacetime program (combinatorial objects assembled from a finite groupoid with weights, proposed as discrete models of continuum geometry) converge to a continuum geometry, and under which conditions? Their convergence conditions are not established without complete proofs, and every result in that setting is a hypothesis until the limit is taken with estimates.
            - listitem [ref=e14736]:
              - paragraph [ref=e14737]:
                - emphasis [ref=e14738]: The entropy formula in general settings.
                - text: The Ryu-Takayanagi formula is derived for spherical vacuum regions and by replica methods in static and covariant form
                - link "[3]" [ref=e14739] [cursor=pointer]:
                  - /url: "#bib-chc"
                - text: ","
                - link "[18]" [ref=e14740] [cursor=pointer]:
                  - /url: "#bib-lm"
                - text: ","
                - link "[6]" [ref=e14741] [cursor=pointer]:
                  - /url: "#bib-dlr"
                - text: . What replaces it where extremal surfaces fail (quantum extremal surfaces being one candidate
                - link "[7]" [ref=e14742] [cursor=pointer]:
                  - /url: "#bib-ew"
                - text: ), and what is its status for general excited states? The proved quantum-information content (entanglement-wedge reconstruction, the entropy cone for at most five regions) does not settle the status of the formula itself.
            - listitem [ref=e14743]:
              - paragraph [ref=e14744]:
                - emphasis [ref=e14745]: Curvature as physics.
                - text: Under what hypotheses does the curvature of an information-geometric metric correspond to a physical interaction or to spacetime curvature? The thermodynamic reading works in the two models computed here and is a proposed correspondence beyond them. The step from equilibrium curvature to spacetime curvature is unmade.
            - listitem [ref=e14746]:
              - paragraph [ref=e14747]:
                - emphasis [ref=e14748]: Infinite dimensions.
                - text: How do the Petz family and the uniqueness locus behave on the state spaces of quantum field theory, where the finite-dimensional proofs of this paper do not apply? The monotone-metric classification in that setting is a different problem from the one solved by Petz and Sudár.
            - listitem [ref=e14749]:
              - paragraph [ref=e14750]:
                - emphasis [ref=e14751]: Reconstruction of dynamics.
                - text: Can a reconstruction theorem in the sense of
                - link "36" [ref=e14752] [cursor=pointer]:
                  - /url: "#def:probe"
                - text: recover interacting dynamics from probe data? Every reconstruction result on record recovers structure, not evolution.
          - heading "Limitations" [level=2] [ref=e14753]
          - paragraph [ref=e14754]: Everything computed here is finite-dimensional. The infinite-dimensional state spaces of quantum field theory, including type III factors with their non-type-I modular theory, are outside the proofs of this paper, and the behavior of the Petz family there is a different question.
          - paragraph [ref=e14755]:
            - link "Theorem 16" [ref=e14756] [cursor=pointer]:
              - /url: "#thm:chentsov"
            - link "Theorem 18" [ref=e14757] [cursor=pointer]:
              - /url: "#thm:petz-sudar"
