          - paragraph [ref=e11733]:
            - emphasis [ref=e11734]: Remark 33
            - text: (Classification status of statistical models). The evidence of this paper supports the following summary. Classical statistical models of fixed sample size are classified by
            - link "29" [ref=e11735] [cursor=pointer]:
              - /url: "#cor:homogeneity"
            - text: up to isometry of their full Fisher geometry, and statistical submodels carry curvature invariants without a complete classification being on record. Quantum state systems are classified as metric spaces only after the parameter
            - generic [ref=e11737]:
              - math [ref=e11739]:
                - generic [ref=e11740]: f
              - generic [ref=e11744]: f
            - text: "is fixed, and no physical principle in this paper fixes it. Statistical models are therefore a worked example of a general pattern in classification: a complete island (Chentsov, Petz-Sudár), a trivial stratum (full simplices), and open content (submodels, quantum parameter selection)."
          - heading "Reconstruction from probes" [level=2] [ref=e11745]
          - paragraph [ref=e11746]: "The second proved pattern available to a gravity-information program is reconstruction: an object recovered from data about its relationships. Three classical results fix the pattern, and one quantum-information result applies it to entanglement."
