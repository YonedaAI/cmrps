            - text: ", where the denominator also vanishes. The pattern is consistent with Ruppeiner’s proposal that flatness marks noninteracting constituents and curvature marks interactions: it holds in the two models computed here, and beyond them it remains a proposed correspondence supported by examples."
          - paragraph [ref=e13825]:
            - emphasis [ref=e13826]: Remark 46
            - text: "(Two directions of the dictionary). Thermodynamic geometry instantiates both directions of the correspondence examined in this paper. Information determines geometry: the entropy function, an information-theoretic object, determines the metric by a Hessian. Geometry diagnoses physics: the curvature of that metric is read as an interaction diagnostic. What thermodynamic geometry does not provide is gravity: the metric here is on the space of equilibrium states, not on a spacetime, and no Einstein equation relating it to matter is derived in this paper."
          - heading "The proposed gravity-information correspondence" [level=2] [ref=e13827]
          - paragraph [ref=e13828]: The Gravity-Information-Geometry research program proposes that curvature and gravitational dynamics arise from informational relationships. This section states the correspondence as precisely as the current evidence allows and separates what is proved from what is proposed.
          - paragraph [ref=e13830]:
            - emphasis [ref=e13831]: Remark 47
            - text: (Proposed correspondence). The proposed dictionary has three entries. First, entropy of boundary subregions determines bulk geometry, as in the Ryu-Takayanagi formula and its quantum corrections (
            - link "40" [ref=e13832] [cursor=pointer]:
              - /url: "#rem:rt"
            - text: ). Second, information-geometric metrics on state spaces are candidate sources of physical geometry, as in thermodynamic geometry (
            - link "9" [ref=e13833] [cursor=pointer]:
              - /url: "#sec:thermo"
            - text: ). Third, gravitational dynamics is proposed to arise from the entanglement structure of microscopic degrees of freedom (
            - link "41" [ref=e13834] [cursor=pointer]:
              - /url: "#rem:vr"
            - text: "). Entries one and two are precise formulas; entry three is a programmatic direction. None of the three is established as a derivation of Einstein’s equations from information-theoretic axioms. Conditional derivations exist and each assumes geometric input: the Einstein equation of state from local horizon thermodynamics"
            - link "[14]" [ref=e13835] [cursor=pointer]:
              - /url: "#bib-jacobson"
            - text: ", linearized dynamics around AdS from the entropy formula and the entanglement first law"
            - link "[8]" [ref=e13836] [cursor=pointer]:
              - /url: "#bib-fgkmv"
            - text: ","
            - link "[16]" [ref=e13837] [cursor=pointer]:
              - /url: "#bib-lmvr"
            - text: ", and the full equation from an entanglement-equilibrium condition"
            - link "[15]" [ref=e13838] [cursor=pointer]:
              - /url: "#bib-jac2016"
            - text: .
