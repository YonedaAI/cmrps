                - text: ) and of bulk operators from boundary subregions in the holographic code setting (
                - link "38" [ref=e13900] [cursor=pointer]:
                  - /url: "#thm:dhw"
                - text: ). Both recover structure; neither delivers dynamics.
            - term [ref=e13901]: Gauge dynamics
            - definition [ref=e13902]:
              - paragraph [ref=e13903]: No reconstruction theorem on record in the setting of this paper recovers interacting gauge dynamics from information-geometric data. The status of rigorous four-dimensional gauge dynamics is tracked separately in the series and is not used as a premise here.
            - term [ref=e13904]: Spacetime and gravity
            - definition [ref=e13905]:
              - paragraph [ref=e13906]:
                - text: The entropy formula is a proposal with derived special cases, the emergence of connectivity is an argument, and the conditional derivations of
