            - text: "make that naming precise: the invariant is the metric up to isometry, trivial on full models and rich on submodels. This is the opposite of the symplectic situation, where local classification is trivial by Darboux’s theorem and all content is global. Information geometry has local content and uses it. On the quantum side the invariant data must additionally name the member"
