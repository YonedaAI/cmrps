                - text: each assume geometric input; no unconditional derivation of Einstein’s equations from information-theoretic axioms is on record.
          - paragraph [ref=e13912]:
            - emphasis [ref=e13913]: Remark 48
            - text: "(Structure-preserving discipline). Any proposed identification of systems should state which layers of structure it preserves; equivalences that forget the monoidal or symmetric layer are provably insufficient to recover the underlying group (a constraint from tensor-category theory). The same discipline applies to the proposed correspondences of this section. A dictionary that identifies information-geometric data with physical geometry must state what the identification preserves: the state space, the algebra of observables, the metric class, the dynamics, or some combination. No proposed correspondence examined here states its preserved layers, and none of them is presented as an equivalence."
          - paragraph [ref=e13914]:
            - text: Deriving gravitational dynamics from quantum state spaces requires three steps that current theorems do not supply. First, a physical principle independent of gravity must select one metric from the Petz family, whereas channel monotonicity leaves an infinite functional parameter
            - generic [ref=e13916]:
