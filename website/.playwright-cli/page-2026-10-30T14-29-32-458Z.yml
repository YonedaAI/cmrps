            - text: ". Smoothness of the metric tensor is assumed throughout, as in Chentsov’s statement. Two scope points are essential. The constant is undetermined and shared: monotonicity pins the metric only up to scale, and the cross-dimensional maps of"
            - link "3" [ref=e4718] [cursor=pointer]:
