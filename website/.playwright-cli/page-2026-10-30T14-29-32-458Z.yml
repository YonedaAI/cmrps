            - emphasis [ref=e4714]: On the probability simplices, the Fisher family is the unique family of Riemannian metrics, up to a single positive constant shared across dimensions, that is monotone under stochastic maps.
          - paragraph [ref=e4715]:
            - text: "Chentsov proved this theorem in the formulation: smooth metric families invariant under congruent embeddings (Markov morphisms) are unique up to constant; Petz and Sudár"
