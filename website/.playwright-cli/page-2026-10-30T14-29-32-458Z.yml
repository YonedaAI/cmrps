            - text: ". The embedding is isometric onto its image, so intrinsic geometry cannot detect the sample-space size: two models with different numbers of outcomes can share a submodel geometry. The induced metric is unchanged here because the embedding is a sufficient-statistic Markov map. Among linear stochastic maps, pullback preserves the Fisher metric exactly when the map is a sufficient-statistic embedding, and general smooth embeddings can reproduce the same intrinsic metric without being Markov maps, so intrinsic geometry alone does not detect the embedding. Extrinsic data of the embedding is additional invariant content."
          - paragraph [ref=e11709]:
            - emphasis [ref=e11710]: Remark 32
            - text: (Classifying data for statistical models). For statistical models (probability and measure structures), the Fisher metric is the natural classifying invariant in the classical case.
