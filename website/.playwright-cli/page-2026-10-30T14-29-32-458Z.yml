                - generic [ref=e4723]: "n"
              - generic [ref=e4727]: "n"
            - text: . The classical uniqueness has an operational reading. Monotonicity says statistical distinguishability does not increase under processing; uniqueness says there is one ruler for that distinguishability. A classification program for statistical systems can therefore treat the Fisher metric as classifying data without a choice problem.
