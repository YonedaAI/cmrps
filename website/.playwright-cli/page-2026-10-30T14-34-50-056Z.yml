          - heading "Emergent structure" [level=2] [ref=e2408]
          - paragraph [ref=e2409]: The twelve parts jointly establish several findings that no single part establishes alone. They are the emergent content of the composition.
          - paragraph [ref=e2410]: "A scope law holds across the aggregate. Complete invariants concentrate where the invariant is finite or explicitly parameterized, and beyond that boundary the series records either a parameterized family or an obstruction theorem. The law is visible only in the aggregate: individual parts classify their own sectors, and the obstruction register appears as a separate part, while the correspondence between the two is a property of the whole."
          - paragraph [ref=e2411]: "An asymmetry separates reconstruction from classification. Reconstruction theorems recur across the series, each recovering an object from probes, and each under hypotheses that cannot be dropped. Complete classifications recur much less often and never outside finite or parametric regimes. The asymmetry is a structural feature of the subject matter rather than an artifact of the survey: the probe categories that reconstruction uses are richer invariants than the finite data that classification needs."
          - paragraph [ref=e2412]:
            - text: A preserved-layer law governs the equivalence content. Every equivalence, duality, and identification the series records either states the structure it preserves or records the failure that follows from not stating it. The negative theorem of Etingof and Gelaki
            - link "[27]" [ref=e2413] [cursor=pointer]:
              - /url: "#bib-corpus-74"
            - text: is the reason, and the discipline is uniform across all twelve parts.
          - paragraph [ref=e2414]: A layer separation holds in the architecture. Mathematical classification, physical realization, and empirical selection are three maps with different domains and codomains. A complete mathematical classification would leave realization and selection unconstrained, because the latter two apply maps that classification does not compute. The separation is stated in the foundational part, instantiated in the observational-equivalence part, and preserved in the assembly part.
          - paragraph [ref=e2415]: These findings fix the scope of any answer to the program’s question. Structural classification of physical systems is realizable as restricted-class classification theorems stated with their invariants and explicit scope, bounded by obstruction theorems that mark where no table exists. Complete classifications succeed where the classifying data reduce to finite invariants or tame parameterizations. Algorithmic undecidability in four-manifold topology and wild representation type rule out a single global table.
          - heading "Contrasts the series maintains" [level=3] [ref=e2416]
          - paragraph [ref=e2417]: Several pairs of results pull against each other, and the series keeps each pair apart rather than resolving it prematurely.
          - paragraph [ref=e2418]:
            - text: Classification and reconstruction are different achievements. Classification is sharp where the invariant is finite or parametric, and reconstruction routinely recovers an object from probes
            - link "[7]" [ref=e2419] [cursor=pointer]:
              - /url: "#bib-corpus-42"
            - text: ","
            - link "[8]" [ref=e2420] [cursor=pointer]:
              - /url: "#bib-corpus-43"
            - text: ","
            - link "[9]" [ref=e2421] [cursor=pointer]:
              - /url: "#bib-corpus-44"
            - text: ","
            - link "[10]" [ref=e2422] [cursor=pointer]:
              - /url: "#bib-corpus-12"
            - text: ","
            - link "[12]" [ref=e2423] [cursor=pointer]:
              - /url: "#bib-corpus-13"
            - text: . The parts that study the two do not merge them.
          - paragraph [ref=e2424]:
            - text: Local and global classification content differ by subject. Darboux normal form empties the local symplectic invariant theory
            - link "[19]" [ref=e2425] [cursor=pointer]:
              - /url: "#bib-corpus-6"
            - text: ", and Riemannian curvature supplies rich local data. Symplectic classification is therefore global, and the series states the difference as a property of the subject."
          - paragraph [ref=e2426]:
            - text: Classical uniqueness and quantum parameterization do not match. The Fisher metric is unique up to constant in the classical case
            - link "[32]" [ref=e2427] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: ", and the quantum monotone metrics form a family indexed by operator monotone functions. No part of the series extends the classical uniqueness across that gap."
          - paragraph [ref=e2428]: Relational determination and physical equivalence do not coincide. The Yoneda embedding determines an object by its relationships, and the qualification attached to every use of it records that physical equivalence, empirical adequacy, and classification do not follow from that determination alone.
          - paragraph [ref=e2429]:
            - text: Announcement and evidence are different things. The constructive quantum field theory frontier carries several announced results
            - link "[44]" [ref=e2430] [cursor=pointer]:
              - /url: "#bib-corpus-24"
            - text: ","
            - link "[45]" [ref=e2431] [cursor=pointer]:
              - /url: "#bib-corpus-25"
            - text: ", and the series records each at the strength of its publicly checkable evidence, keeping existence and the mass gap separate"
            - link "[46]" [ref=e2432] [cursor=pointer]:
              - /url: "#bib-corpus-23"
            - text: .
          - paragraph [ref=e2433]: Mathematical consistency and empirical selection are different layers. A consistency proof settles the first and leaves the second open, because the empirical layer applies an observation map that mathematical classification does not compute.
          - heading "Cross-volume consistency" [level=2] [ref=e2434]
          - paragraph [ref=e2435]: The twelve parts maintain uniform definition identifiers, respect the directed dependency discipline, and enforce the preserved-layer constraint throughout. The corpus satisfies the following eight structural properties.
          - generic [ref=e2436]:
            - term [ref=e2437]: Ontology identity.
            - definition [ref=e2438]:
              - paragraph [ref=e2439]: The forty-two definition identifiers are used with one meaning across all twelve parts, and later parts extend the list only by appending new identifiers.
            - term [ref=e2440]: Definitional root.
            - definition [ref=e2441]:
              - paragraph [ref=e2442]: Every part works in the ontology of Part I, and no part redefines an object that Part I owns.
            - term [ref=e2443]: Dependency discipline.
            - definition [ref=e2444]:
              - paragraph [ref=e2445]:
                - text: Every cross-part use of a registered result is a permitted edge of
                - link "1" [ref=e2446] [cursor=pointer]:
                  - /url: "#fig:deps"
                - text: ", and unproven statements enter only as declared hypotheses or as objects of study."
            - term [ref=e2447]: Yoneda qualification.
            - definition [ref=e2448]:
              - paragraph [ref=e2449]: The constraint on Yoneda-based arguments appears in the same wording in every part that uses Yoneda methods.
            - term [ref=e2450]: Preserved-layer requirement.
            - definition [ref=e2451]:
              - paragraph [ref=e2452]: Every equivalence and duality recorded across the series names the structure it preserves or records the failure of recovery.
            - term [ref=e2453]: Notation.
            - definition [ref=e2454]:
              - paragraph [ref=e2455]: The five-component tuple, the invariant record, and the closure notation are used in one form throughout.
            - term [ref=e2456]: Existence and mass gap.
            - definition [ref=e2457]:
              - paragraph [ref=e2458]: The announced four-dimensional existence result and the mass gap problem are recorded as separate items in every part that mentions them.
            - term [ref=e2459]: Entropy cone range.
            - definition [ref=e2460]:
              - paragraph [ref=e2461]:
                - text: The holographic entropy cone is completely characterized for five boundary regions and fewer
                - link "[31]" [ref=e2462] [cursor=pointer]:
                  - /url: "#bib-corpus-47"
                - text: ","
                - link "[38]" [ref=e2463] [cursor=pointer]:
                  - /url: "#bib-corpus-73"
                - text: ", and the open range begins at six regions. This entry is the correction."
          - paragraph [ref=e2464]:
            - text: "Four of these findings are load-bearing for the series as a whole. The definitional root is what makes the twelve parts one program rather than twelve adjacent papers: a definition introduced in Part I has one meaning everywhere. The dependency discipline is what makes the composition honest: a part that needs an unproven statement declares it as a hypothesis instead of using it as a lemma. The preserved-layer requirement is what makes the equivalence content of the series correct rather than merely plausible: the counterexample of Etingof and Gelaki"
            - link "[27]" [ref=e2465] [cursor=pointer]:
              - /url: "#bib-corpus-74"
            - text: rules out the weaker discipline by theorem. The separation of existence from mass gap is what keeps the constructive quantum field theory material accurate
            - link "[46]" [ref=e2466] [cursor=pointer]:
              - /url: "#bib-corpus-23"
            - text: ","
            - link "[44]" [ref=e2467] [cursor=pointer]:
              - /url: "#bib-corpus-24"
            - text: ","
            - link "[45]" [ref=e2468] [cursor=pointer]:
