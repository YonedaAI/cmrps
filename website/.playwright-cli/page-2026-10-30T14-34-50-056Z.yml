            - text: .
          - paragraph [ref=e2469]:
            - text: "The corrected entry concerns the holographic entropy cone. The cone for five boundary regions is completely characterized: the cone defined by all proven inequalities admits graph models for every extreme ray orbit, which settles the existence of further five-party inequalities in the negative"
            - link "[38]" [ref=e2470] [cursor=pointer]:
              - /url: "#bib-corpus-73"
            - text: . The cone is open from six regions onward
            - link "[31]" [ref=e2471] [cursor=pointer]:
              - /url: "#bib-corpus-47"
            - text: ", and the periodic table of"
            - link "5" [ref=e2472] [cursor=pointer]:
              - /url: "#tab:periodic"
            - text: records the corrected range.
          - heading "Conclusion" [level=2] [ref=e2473]
          - paragraph [ref=e2474]: The structural picture of the series is a classification program with a stated scope. One ontology of forty-two definitions organizes the objects, morphisms, equivalences, families, and invariants. One dependency graph composes the twelve parts. One equivalence requirement forces every identification to name the structure it preserves. Around the central conjecture, the mathematical content sorts into regimes with complete invariants, regimes with parameterized or normal-form answers, and regimes where obstruction theorems prove that no classification of the stated kind exists.
          - paragraph [ref=e2475]:
            - text: "The regime structure is the durable finding. Complete invariants appear where the invariant is finite or explicitly parameterized. Reconstruction from probes is better developed than classification and carries hypotheses that cannot be dropped. Obstruction theorems mark a sharp scope boundary: dimension three admits a finite table of geometries and dimension four contains unrecognizable manifolds, the amenable factors are classified and the general type"
            - generic [ref=e2477]:
              - math [ref=e2479]:
                - generic [ref=e2482]:
                  - generic [ref=e2483]:
                    - generic [ref=e2484]: I
                    - generic [ref=e2485]: I
                  - generic [ref=e2486]: "1"
              - generic [ref=e2489]:
                - generic [ref=e2490]: II
                - generic [ref=e2491]: "1"
            - text: factors are not, the symmetric tensor categories of subexponential growth are classified and the plain tensor categories do not determine their groups.
          - paragraph [ref=e2499]: The central conjecture states the program’s theorem target and carries the five obligations that would discharge it. Restricted forms of the decomposition obligation are established in the sectors where complete invariants exist. The remaining obligations are the research program.
