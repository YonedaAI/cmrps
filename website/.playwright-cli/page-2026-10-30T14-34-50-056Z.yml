            - text: . A classification that discards the symmetric structure is therefore false. This requirement is the discipline the series applies to every equivalence, duality, and identification it records.
          - heading "Families and invariants" [level=3] [ref=e392]
          - paragraph [ref=e393]: The series organizes mathematical structures into ten candidate families, each a full subcategory singled out by its underlying structure. Symplectic and Poisson structures represent classical mechanics. Hilbert spaces and operator algebras represent quantum mechanics. Smooth manifolds and geometric structures represent relativity. Principal bundles and connections represent gauge theories. Probability and measure-theoretic structures represent statistical physics. Topological and higher-categorical structures represent topological field theories. Dynamical systems and operator semigroups represent dissipative and open systems. Tensor categories and compositional structures represent quantum information. Discrete combinatorial structures represent lattice and network models. Derived and homotopical structures represent higher gauge and derived field theories. The families are candidates for the generating collection of the central identity, and the identity asserts that they suffice.
