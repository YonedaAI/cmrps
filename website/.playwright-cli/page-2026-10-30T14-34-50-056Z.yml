              - generic [ref=e317]: Phys
            - text: ". Duality exchanges structure between differently presented theories and is a functor between category presentations, generally invertible only after passage to an opposite or dual category. Limiting procedures arise from limits and colimits: thermodynamic limits, infinite-volume limits, semiclassical limits, and continuum limits. These last two are universal constructions rather than arrows between two objects."
          - paragraph [ref=e319]:
