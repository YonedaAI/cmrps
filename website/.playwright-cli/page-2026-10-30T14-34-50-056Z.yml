              - /url: "#bib-corpus-17"
            - text: ","
            - link "[4]" [ref=e1776] [cursor=pointer]:
              - /url: "#bib-corpus-18"
            - text: . The Yoneda embedding sends an object to its functor of relationships and is faithful as mathematics; the constraint that it does not by itself establish physical equivalence, empirical adequacy, or a classification theorem governs every use of it in the series.
          - paragraph [ref=e1777]:
            - text: "A duality is not automatically a physical equivalence. The series keeps the two apart: an identification of representations is a mathematical statement, and an identification of physical content requires its own definition and justification. The proposed gravity-information correspondence is a case in point. Ryu-Takayanagi relations are verified exactly in anti-de Sitter space in three dimensions with a two-dimensional conformal field theory dual"
            - link "[48]" [ref=e1778] [cursor=pointer]:
              - /url: "#bib-corpus-45"
            - text: ", entanglement-wedge reconstruction holds as a physical dictionary result under the semiclassical AdS/CFT assumptions"
            - link "[49]" [ref=e1779] [cursor=pointer]:
              - /url: "#bib-corpus-46"
            - text: ", and tensor-network models are toys rather than evidence for the duality itself"
            - link "[50]" [ref=e1780] [cursor=pointer]:
              - /url: "#bib-corpus-48"
            - text: . The series states each of these at the strength the source supports.
          - heading "Observation and distinguishability" [level=3] [ref=e1781]
          - paragraph [ref=e1782]: "Observation functors formalize what an empirical procedure can separate. Applied to a pair of systems they induce an equivalence relation: systems are observationally equivalent relative to the procedure when no observation in its range separates them. The induced relation is coarse when the functor forgets detail and fine when it resolves it, and it behaves well under composition of procedures."
          - paragraph [ref=e1783]:
            - text: The metric content of distinguishability diverges between the classical and quantum cases. On a classical probability simplex the Fisher information metric is the unique Riemannian metric monotone under stochastic transitions up to a positive constant
            - link "[32]" [ref=e1784] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: . On quantum state spaces the monotone metrics form a family parameterized by operator monotone functions, and no member of that family is distinguished
            - link "[32]" [ref=e1785] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: . The series treats the classical uniqueness as the anchor and the quantum parameterization as the reality, and it does not extend uniqueness across the gap between them.
          - paragraph [ref=e1786]: Mathematical isomorphism and observational indistinguishability are different relations. A mathematical classification would not by itself select a theory empirically, and several mathematically distinct theories produce identical predictions in an experimentally accessible regime. The three-layer architecture of the assembly keeps mathematical classification, physical realization, and empirical selection as separate maps, and no part of the series collapses them.
