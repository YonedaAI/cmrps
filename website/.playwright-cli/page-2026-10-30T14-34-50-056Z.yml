          - paragraph [ref=e1216]: The series prohibits unproved statements from serving as proved dependencies. Unproved results enter the dependency structure exclusively as registered conjectures, as explicit hypotheses of conditional records, or as objects of study in Part XI.
          - heading "Classification regimes" [level=2] [ref=e1217]
          - paragraph [ref=e1218]: The classification content of the series sorts by the kind of data that classifies. The regimes below are the ones the twelve parts jointly establish, and they are the ones the periodic table of mathematical physics records.
