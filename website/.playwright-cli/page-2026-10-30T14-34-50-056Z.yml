            - text: to the finite-dimensional unitary representations of a compact supergroup, unique up to isomorphism
            - link "[10]" [ref=e1731] [cursor=pointer]:
              - /url: "#bib-corpus-12"
            - text: ","
            - link "[11]" [ref=e1732] [cursor=pointer]:
              - /url: "#bib-corpus-67"
            - text: . Deligne’s theorem takes a characteristic-zero symmetric tensor category of subexponential growth to a supergroup representation category
            - link "[12]" [ref=e1733] [cursor=pointer]:
              - /url: "#bib-corpus-13"
            - text: . Both statements preserve the symmetric structure and both state their hypotheses in full. Müger’s Galois theory for braided tensor categories recovers fixed-point data together with additional information that the braided structure alone does not supply
