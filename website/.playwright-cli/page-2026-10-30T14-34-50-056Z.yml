          - heading "Equivalence" [level=3] [ref=e346]
          - paragraph [ref=e347]: Physical equivalence is a chosen relation on objects; the classification problem is the problem of classifying admissible representations up to that relation. Mathematical equivalence, isomorphism of the five-component tuples in the ambient category of each component, is strictly finer in general. Two mathematical descriptions may be physically equivalent without being mathematically isomorphic.
