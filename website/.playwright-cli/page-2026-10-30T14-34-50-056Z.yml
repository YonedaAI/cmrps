            - text: . The series records the existence claim and the mass gap separately and never merges them.
          - heading "Equivalence and preserved structure" [level=2] [ref=e1697]
          - paragraph [ref=e1698]: Every equivalence in the series names the structure it preserves, and the reason is a theorem rather than a preference.
          - heading "The preserved-layer requirement" [level=3] [ref=e1699]
          - paragraph [ref=e1700]:
            - text: Two finite groups that are not isomorphic can carry equivalent representation categories as plain tensor categories
            - link "[27]" [ref=e1701] [cursor=pointer]:
              - /url: "#bib-corpus-74"
            - text: ". The equivalence is monoidal and does not respect the commutativity constraint, so the symmetric braiding is the layer it fails to preserve. Any criterion of identification that discards the monoidal or symmetric layer therefore identifies distinct groups. The series adopts the resulting requirement: an equivalence used to identify systems must state which layer of structure it preserves, and an equivalence that forgets the symmetric layer is rejected as a criterion."
          - paragraph [ref=e1702]:
            - text: The requirement is constructive as well as negative. The Doplicher-Roberts equivalence takes a symmetric tensor
            - generic [ref=e1704]:
