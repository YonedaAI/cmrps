          - paragraph [ref=e2406]:
            - text: "The example is the one place in the series where the classification layer, the obstruction layer, and the reconstruction layer all appear in a single system. It also shows the load-bearing character of the preserved-layer requirement: the recovery of the gauge group uses the symmetric structure of the sector category, and discarding that structure admits the isocategorical counterexamples"
