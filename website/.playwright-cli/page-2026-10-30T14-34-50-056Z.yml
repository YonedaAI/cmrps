            - text: . Gelfand duality ceases to recover a topological spectrum once commutativity is dropped
            - link "[8]" [ref=e1962] [cursor=pointer]:
              - /url: "#bib-corpus-43"
            - text: . Each hypothesis is therefore a boundary of the theorem rather than a technical convenience.
