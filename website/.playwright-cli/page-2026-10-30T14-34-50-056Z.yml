          - paragraph [ref=e1502]:
            - text: Classification theorems and parameterization schemes are different achievements across the surveyed sectors. The finite simple groups admit an exhaustive classification without a uniform parameterization, so practical identification runs through companion data of the ATLAS kind
            - link "[34]" [ref=e1503] [cursor=pointer]:
              - /url: "#bib-corpus-3"
            - text: ". Classification invariants can also be purely global: Darboux normal form removes every local symplectic invariant beyond dimension"
            - link "[19]" [ref=e1504] [cursor=pointer]:
              - /url: "#bib-corpus-6"
            - text: ", which forces symplectic classification into the global topological regime, the opposite of the Riemannian situation where curvature supplies rich local data."
          - heading "Parameterized and normal-form results" [level=3] [ref=e1505]
          - paragraph [ref=e1506]:
            - text: Some sectors admit a parameterized answer rather than a finite list. Monotone metrics on quantum state spaces are classified by operator monotone functions through the Morozova-Chentsov construction
            - link "[32]" [ref=e1507] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: ": the answer is a family indexed by a function, and no member of the family is distinguished among all monotone metrics. Every fusion category is the representation category of a weak Hopf algebra"
            - link "[39]" [ref=e1508] [cursor=pointer]:
              - /url: "#bib-corpus-75"
            - text: ", and the additional structure that supplies canonical traces is the subject of a conjecture of Etingof, Nikshych, and Ostrik"
            - link "[40]" [ref=e1509] [cursor=pointer]:
              - /url: "#bib-corpus-14"
            - text: . Every finite-dimensional algebra over an algebraically closed field is derived-tame or derived-wild
            - link "[15]" [ref=e1510] [cursor=pointer]:
              - /url: "#bib-corpus-55"
            - text: ", a dichotomy that sorts the field without classifying either side."
          - paragraph [ref=e1511]:
            - text: Other sectors carry a normal form rather than an isomorphism classification. Completely positive maps are classified up to minimal Stinespring dilation, unique up to unitary
            - link "[41]" [ref=e1512] [cursor=pointer]:
              - /url: "#bib-corpus-10"
            - text: ", and the Choi-Kraus form is a normal form whose Kraus rank is an invariant of the form"
            - link "[42]" [ref=e1513] [cursor=pointer]:
              - /url: "#bib-corpus-11"
            - text: . The series treats this data as a normal form and not as an isomorphism classification of channels.
          - heading "The regime taxonomy" [level=3] [ref=e1514]
          - paragraph [ref=e1515]: "Part XI sorts the surveyed domains by the kind of achievement each represents, and the sort is stable across the twelve parts: a domain keeps its regime when a different part studies it. Seven regimes cover the surveyed domains."
          - generic [ref=e1516]:
            - term [ref=e1517]: Complete finite invariant.
            - definition [ref=e1518]:
              - paragraph [ref=e1519]: A theorem classifies the objects up to the chosen equivalence and the classifying invariant takes finitely many values or is a finite combinatorial datum. The Killing-Cartan classification and the dimension-vector classification live here.
            - term [ref=e1520]: Complete parameterized invariant.
            - definition [ref=e1521]:
              - paragraph [ref=e1522]: A theorem classifies the objects and the invariant ranges over an explicitly described family. The Petz-Sudar classification of monotone metrics lives here.
            - term [ref=e1523]: Normal form.
            - definition [ref=e1524]:
              - paragraph [ref=e1525]: A canonical form exists with a stated uniqueness, and the form is not an isomorphism classification of the objects. Stinespring dilation and the Choi-Kraus form live here.
            - term [ref=e1526]: Obstruction classification.
            - definition [ref=e1527]:
              - paragraph [ref=e1528]: A theorem classifies the obstruction to a property rather than the objects. Anomaly classes live here.
            - term [ref=e1529]: Open regime.
            - definition [ref=e1530]:
              - paragraph [ref=e1531]: Partial or parametric results exist and no completeness statement is available. Fusion categories and the Elliott program live here.
            - term [ref=e1532]: Claimed regime.
            - definition [ref=e1533]:
              - paragraph [ref=e1534]: A result has been announced and its supporting artifacts are not publicly checkable. The four-dimensional existence announcement lives here.
            - term [ref=e1535]: Impossibility regime.
            - definition [ref=e1536]:
              - paragraph [ref=e1537]: A theorem forbids classification of the stated kind. The McDuff obstruction, wildness, and four-manifold unrecognizability live here.
          - paragraph [ref=e1538]:
            - text: The taxonomy records boundaries as well as contents. Tame and wild separates the algorithmically tractable domains from the intractable ones
            - link "[43]" [ref=e1539] [cursor=pointer]:
              - /url: "#bib-corpus-57"
            - text: ", and dimension three separates from dimension four by the presence of a finite geometry table on one side and unrecognizable manifolds on the other"
            - link "[18]" [ref=e1540] [cursor=pointer]:
              - /url: "#bib-corpus-54"
            - text: ","
            - link "[36]" [ref=e1541] [cursor=pointer]:
              - /url: "#bib-corpus-60"
            - text: . Those two boundaries are the ones the regime sort reproduces most sharply.
          - heading "The periodic table" [level=3] [ref=e1542]
          - paragraph [ref=e1543]:
            - text: The chart that assembles these regimes is the periodic table of mathematical physics, and
            - link "5" [ref=e1544] [cursor=pointer]:
              - /url: "#tab:periodic"
            - text: states its six regions. A periodic table must mark where no table exists, so the sixth region is as much content as the first.
