          - paragraph [ref=e390]:
            - text: "A second constraint governs every equivalence used to identify systems. Any such equivalence must state which layer of structure it preserves. Equivalences that forget the monoidal or symmetric layer are provably insufficient: non-isomorphic finite groups carry equivalent representation categories as plain tensor categories"
            - link "[27]" [ref=e391] [cursor=pointer]:
