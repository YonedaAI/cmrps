          - heading "Morphism kinds" [level=3] [ref=e304]
          - paragraph [ref=e305]:
            - text: Five kinds of relationship appear across the series, and they are not all arrows of one 1-category. Coarse-graining forgets microscopic detail while preserving macroscopic observables. Exact equivalence is invertible and represents identity of content up to the chosen relation. Embedding realizes a system as a subsystem, a subtheory, or a sub-structure. These three are arrows in the strict reading of
            - generic [ref=e307]:
