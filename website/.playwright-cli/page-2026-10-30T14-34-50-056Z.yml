          - heading "Dimension three and dimension four" [level=3] [ref=e2099]
          - paragraph [ref=e2100]:
            - text: The clearest scope contrast in the series is dimensional. Closed three-manifolds decompose into exactly eight Thurston geometries
            - link "[36]" [ref=e2101] [cursor=pointer]:
              - /url: "#bib-corpus-60"
            - text: ","
            - link "[37]" [ref=e2102] [cursor=pointer]:
              - /url: "#bib-corpus-70"
            - text: ", a finite table with a complete decomposition theorem behind it. In dimension four the model geometries are countably infinite in one family"
            - link "[36]" [ref=e2103] [cursor=pointer]:
              - /url: "#bib-corpus-60"
            - text: ", only restricted classes decompose, and homeomorphism of a specific four-manifold is algorithmically unrecognizable"
            - link "[18]" [ref=e2104] [cursor=pointer]:
              - /url: "#bib-corpus-54"
            - text: . Finite classification tables exist in tame regimes and stop at the dimension where unrecognizability begins. The series states the contrast as a scope boundary and builds its regime taxonomy around it.
          - heading "Scope effects" [level=3] [ref=e2105]
          - paragraph [ref=e2106]:
            - text: Each obstruction removes a possibility rather than adding a difficulty. The McDuff construction
            - link "[13]" [ref=e2107] [cursor=pointer]:
              - /url: "#bib-corpus-65"
            - text: leaves the amenable classification intact and closes the non-amenable case. The isocategorical construction
            - link "[27]" [ref=e2108] [cursor=pointer]:
              - /url: "#bib-corpus-74"
            - text: leaves the symmetric theory intact and closes the plain tensor case. The Adyan-Rabin results
            - link "[14]" [ref=e2109] [cursor=pointer]:
              - /url: "#bib-corpus-53"
            - text: close uniform recognition while leaving individual presentations decidable. The wildness theorems
            - link "[15]" [ref=e2110] [cursor=pointer]:
              - /url: "#bib-corpus-55"
            - text: ","
            - link "[16]" [ref=e2111] [cursor=pointer]:
              - /url: "#bib-corpus-56"
            - text: ","
            - link "[17]" [ref=e2112] [cursor=pointer]:
              - /url: "#bib-corpus-58"
            - text: close finite-variety parameterization while leaving the tame side open to classification. Reading the register this way is what allows a classification program to state restricted-class theorems with explicit scope instead of promising a single global table.
          - heading "Worked examples" [level=2] [ref=e2113]
          - paragraph [ref=e2114]: Three systems trace the shared framework end to end. Each is an object of the category, each carries an invariant record, and each sits in a regime of the taxonomy.
          - heading "A finite-dimensional quantum system" [level=3] [ref=e2115]
          - paragraph [ref=e2116]:
            - text: Take a finite-dimensional quantum system whose observable algebra is a unital finite-dimensional complex
