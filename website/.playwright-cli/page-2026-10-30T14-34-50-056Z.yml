          - paragraph [ref=e1959]:
            - text: Reconstruction theorems fail when the probe category loses the hypotheses that carry the determination. The Doplicher-Roberts recovery of a compact supergroup collapses without the symmetric braiding, as non-isomorphic groups with equivalent plain tensor categories show
            - link "[27]" [ref=e1960] [cursor=pointer]:
