          - paragraph [ref=e1653]: "The existence of a finite list of exceptional objects in the finite-simple-group template does not transfer to physical theories in general, and the second region records the exceptions the mathematics actually supplies rather than a list the program expects to close. Reading the six regions together gives the summary of the series in one chart: families with invariants, exceptions the invariants must catch, recoveries from probes, identifications with declared scope, open problems, and proved limits."
