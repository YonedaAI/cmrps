          - heading "Requirements for a unified framework" [level=2] [ref=e3306]
          - paragraph [ref=e3307]: A unified structural theory of mathematical physics would need eight deliverables, and the assembly names each one precisely.
          - table [ref=e3308]:
            - caption [ref=e3309]: Table 7. The eight deliverables a unified framework requires, with the current state of each.
            - rowgroup [ref=e3310]:
              - row [ref=e3311]:
                - columnheader "Deliverable" [ref=e3312]
                - columnheader "Current state" [ref=e3313]
            - rowgroup [ref=e3314]:
              - row [ref=e3315]:
                - cell "Admissibility conditions defining the target class" [ref=e3316]
                - cell "Unfixed, so statements over the class are conditional" [ref=e3317]
              - row [ref=e3318]:
                - cell "Preservation laws and composition rules for morphisms" [ref=e3319]
                - cell "Unfixed, so the ambient category is a schema" [ref=e3320]
              - row [ref=e3321]:
                - cell "A chosen physical equivalence with declared preserved structure" [ref=e3322]
                - cell "Open, constrained by the isocategorical counterexample" [ref=e3323]
              - row [ref=e3324]:
                - cell "A constructed realization map from structures to theories" [ref=e3325]
                - cell "Stipulated only" [ref=e3326]
              - row [ref=e3327]:
                - cell "A constructed selection map from theories to observations" [ref=e3328]
                - cell "Not constructed in the record" [ref=e3329]
              - row [ref=e3330]:
                - cell "Regime-appropriate objectives" [ref=e3331]
                - cell [ref=e3332]:
                  - text: Established by the regime analysis of
                  - link "3" [ref=e3333] [cursor=pointer]:
                    - /url: "#tab:regimes"
                  - text: and by
                  - link "12" [ref=e3334] [cursor=pointer]:
                    - /url: "#thm:obstructions"
              - row [ref=e3335]:
                - cell "A verification layer for the registered proofs" [ref=e3336]
                - cell "No record carries a completed proof-assistant check" [ref=e3337]
              - row [ref=e3338]:
                - cell "Criteria for physical validation of the architecture" [ref=e3339]
                - cell "Open, level named but its criteria unstated" [ref=e3340]
          - paragraph [ref=e3341]:
            - text: The first three deliverables are definitional. Until the admissibility conditions are fixed, every theorem over the admissible class is conditional on the chosen conditions. Until the morphism rules are fixed, the ambient category is a schema, and any theorem must state which morphism classes are in force. The equivalence must name the structure it preserves, and the isocategorical counterexample shows what happens otherwise
            - link "[12]" [ref=e3342] [cursor=pointer]:
              - /url: "#bib-corpus-12"
            - text: .
          - paragraph [ref=e3343]:
            - text: The fourth and fifth deliverables are constructions, and neither exists in the record. The realization map is stipulated as an arrow in the architecture and never built; the selection map has no definition of its observation object, no domain, no codomain, and no composition rule with coarse-graining. Until both are built, the identity of
            - link "18" [ref=e3344] [cursor=pointer]:
              - /url: "#thm:conditional"
            - text: stops at the mathematical layer.
          - paragraph [ref=e3345]: The sixth deliverable is what this paper supplies. Restricted classification theorems are the right objective where invariants are finite or explicitly parameterized, and obstruction theorems are the right objective everywhere else. A rigorous impossibility result is a valuable outcome of the program, not a consolation.
          - paragraph [ref=e3346]: "The seventh deliverable is verification. No proof in the series has been checked by a proof-assistant kernel. The executable taxonomy code in the source directory is computational evidence: it is validated against stated specifications and has not been checked by a kernel. The verification directory records ten mechanization targets matching the definitions and theorems above. Mechanization is future work."
          - paragraph [ref=e3347]: The eighth deliverable is the hardest. Physical validation would require empirical criteria that the architecture could pass and its rivals fail. The corpus names the level and does not fix its criteria. Until those criteria exist, the architecture is a mathematical research program with proved components and an unvalidated assembly.
          - heading "Limitations" [level=2] [ref=e3348]
          - paragraph [ref=e3349]:
            - text: "Four limitations bound this synthesis. The assembly inherits the statuses of the program registry, and any status revision propagates. Three entries rest on single sources and were not independently re-verified here: the extra"
            - generic [ref=e3351]:
              - math [ref=e3353]:
                - generic [ref=e3356]:
                  - generic [ref=e3357]: Z
                  - generic [ref=e3358]: "2"
              - generic [ref=e3361]:
                - text: Z
                - generic [ref=e3362]: "2"
            - text: sector of higher-form DHR theory
            - link "[20]" [ref=e3370] [cursor=pointer]:
              - /url: "#bib-corpus-20"
            - text: ", the journal-published mass-gap claim"
            - link "[28]" [ref=e3371] [cursor=pointer]:
              - /url: "#bib-corpus-28"
            - text: ", and the Borel-reducibility obstruction announced at the survey level"
            - link "[55]" [ref=e3372] [cursor=pointer]:
              - /url: "#bib-corpus-59"
            - text: . The literature survey behind the registry ran on the arXiv API plus known-URL fetches, so non-arXiv venues may be under-covered, and absence of a citation here is not evidence of absence. The regime taxonomy organizes the registered domains and proves a coverage statement about them; it does not classify all of mathematics.
          - paragraph [ref=e3373]: "The formal statements of this paper are assembly results: coverage statements about a finite registry, reductions to the registered impossibility theorems, necessity statements about structure hypotheses, and one conditional reduction. No new classifying invariant is introduced."
          - heading "Conclusion" [level=2] [ref=e3374]
          - paragraph [ref=e3375]: The assembly establishes four things. Every domain of the program comparison spine sits in exactly one classification regime, fifteen of them with finite or explicitly parameterized invariants and complete classification theorems. Seven obstruction theorems forbid classification in the wild, non-amenable, and undecidable sectors, so classification objectives must match regimes. Every realization and identification theorem fails or becomes open when its structure hypotheses are dropped, so identifications must declare preserved structure. And the structural classification conjecture, under its five obligations, would complete the mathematical layer for a targeted class while leaving realization and selection untouched.
          - paragraph [ref=e3376]: What remains uncertain is equally sharp. The admissibility conditions are unfixed. The physical equivalence is unchosen. The realization and selection maps are stipulated and not constructed. The announced four-dimensional existence result carries the status existence claimed; manuscript and formalization withheld; verification pending, and the mass gap is open. No record carries a completed computer-checked proof. The central test of the realization layer, reconstruction of interacting dynamics and spacetime without presupposing spacetime, is unanswered.
          - paragraph [ref=e3377]: What follows is the founding program’s own calibration. The architecture is precise enough to organize a substantial long-term mathematical research program, and its components produce valuable results even if a universal classification theorem proves unattainable. The program should be prepared to prove either that a specified class admits a complete classification or that certain natural classification objectives are impossible without additional restrictions. Both are meaningful mathematical results, and the obstruction register has already begun to deliver the second.
