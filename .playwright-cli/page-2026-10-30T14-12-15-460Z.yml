          - paragraph [ref=e1976]:
            - text: A pre-claim baseline makes the ladder vivid. The 2026 survey of rigorous approaches to quantum field theory records that rigorous renormalization has never been made rigorous in the needed generality and that on the mass gap no clear path is known
