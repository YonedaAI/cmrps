          - paragraph [ref=e1854]:
            - strong [ref=e1855]: Theorem 14
            - text: "(Survey: necessity of the structure hypotheses, assembled from Etingof-Gelaki, Doplicher-Roberts, Stinespring, and the supermap results)."
            - emphasis [ref=e1856]: "Every registered realization or identification theorem fails or becomes open as soon as its structure hypotheses are dropped. In particular: plain tensor equivalence of representation categories does not determine the finite group; Doplicher-Roberts reconstruction requires the symmetric structure and its companion hypotheses; Stinespring data is a normal form and its Kraus rank is not an isomorphism invariant of channels; supermap representability requires channel-state duality. Consequently any identification of systems in the program must declare the layers of structure it preserves, and an identification that forgets the monoidal or symmetric layer is refuted."
          - paragraph [ref=e1858]:
            - emphasis [ref=e1859]: Proof.
            - text: Isocategorical finite groups are non-isomorphic groups whose representation categories are equivalent as plain tensor categories
            - link "[12]" [ref=e1860] [cursor=pointer]:
              - /url: "#bib-corpus-12"
            - text: ", which refutes recovery of the group from plain tensor data and proves the last clause for that case. The Doplicher-Roberts statement is a theorem under its hypotheses, and no theorem on record covers the hypothesis-free version; the symmetric layer is load-bearing because its removal is exactly the case refuted by the counterexample. The Stinespring statement classifies completely positive maps up to minimal dilation, unique up to unitary, and Kraus rank is an invariant of that normal form only"
            - link "[10]" [ref=e1861] [cursor=pointer]:
              - /url: "#bib-corpus-10"
            - text: ","
            - link "[11]" [ref=e1862] [cursor=pointer]:
              - /url: "#bib-corpus-11"
            - text: ", so any claim that treats it as an isomorphism invariant of channels asserts more than the theorem. Supermap representability is proved in settings with channel-state duality"
            - link "[37]" [ref=e1863] [cursor=pointer]:
              - /url: "#bib-corpus-40"
            - text: ","
            - link "[38]" [ref=e1864] [cursor=pointer]:
              - /url: "#bib-corpus-41"
            - text: ", and the general case is open. Each clause is therefore either a counterexample or a recorded hypothesis gap, and the conjunctive conclusion follows. ◻"
          - paragraph [ref=e1865]:
            - link "14" [ref=e1866] [cursor=pointer]:
              - /url: "#thm:hypotheses"
            - text: "is the realization-layer form of the discipline that any equivalence record must state the structure it preserves. The braided case adds a further warning: fixed-point-net representation categories in braided Galois theory require extra soliton data beyond the braiding"
            - link "[21]" [ref=e1867] [cursor=pointer]:
              - /url: "#bib-corpus-21"
            - text: ", so even a braided equivalence is not automatically sufficient."
          - heading "The central test" [level=3] [ref=e1868]
          - paragraph [ref=e1869]: The realization layer carries a central unanswered test. Can the proposed foundational structures reconstruct gauge connections and curvature, quantum states and observables, interacting Yang-Mills dynamics, and spacetime geometry together with gravitational dynamics, without assuming at the outset the spacetime geometry they aim to explain? Four constraints bound the current answer.
          - paragraph [ref=e1870]:
            - text: The finite-groupoid and weighted-nerve constructions of emergent spacetime are concrete, and their continuum convergence conditions are not established without complete proofs. The Ryu-Takayanagi formula is a proposal argued from the AdS/CFT correspondence and verified exactly only in the three-dimensional anti-de Sitter setting with two-dimensional conformal field theory
            - link "[41]" [ref=e1871] [cursor=pointer]:
              - /url: "#bib-corpus-45"
            - text: . Entanglement-wedge bulk reconstruction is a proved quantum-information theorem
            - link "[42]" [ref=e1872] [cursor=pointer]:
              - /url: "#bib-corpus-46"
            - text: ", so it lives at the interface of the mathematical and realization layers and is not a theorem about gravity. Tensor-network constructions prove entropy relations inside exactly solvable toys and not inside the physical duality"
            - link "[44]" [ref=e1873] [cursor=pointer]:
              - /url: "#bib-corpus-48"
            - text: ", and the statement that entanglement builds spacetime is an argument rather than a theorem"
            - link "[45]" [ref=e1874] [cursor=pointer]:
              - /url: "#bib-corpus-49"
            - text: .
          - paragraph [ref=e1875]: The honest summary of the realization layer is therefore asymmetric. Reconstruction from probes is strong where the probes are algebraic or categorical. Reconstruction of interacting dynamics and of spacetime itself from primitive data remains open.
          - heading "The empirical layer" [level=2] [ref=e1876]
          - paragraph [ref=e1877]:
            - text: The empirical layer
            - generic [ref=e1879]:
              - math [ref=e1881]:
                - generic [ref=e1882]: E
              - generic [ref=e1886]: E
            - text: is where mathematical classification stops and observational selection begins.
          - paragraph [ref=e1888]:
            - strong [ref=e1889]: Theorem 15
            - text: "(Survey: classical uniqueness and quantum parametricity, assembled from Chentsov and Petz-Sudar)."
            - emphasis [ref=e1890]: The Fisher metric is the unique Riemannian metric, up to constant factor, that is monotone under stochastic maps. Quantum monotone metrics are classified by operator monotone functions, a parametric family containing more than one element. Classical uniqueness therefore does not extend to the quantum case, and any quantum distinguishability criterion must either select within the parametric family and justify the selection or carry the family as data.
          - paragraph [ref=e1892]:
            - emphasis [ref=e1893]: Proof.
            - text: The first statement is Chentsov’s theorem
            - link "[48]" [ref=e1894] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: . The second is the Petz-Sudar classification
            - link "[48]" [ref=e1895] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: . The parameterizing class of operator monotone functions contains more than one element; for instance the identity function and the affine function
            - generic [ref=e1897]:
              - math [ref=e1899]:
