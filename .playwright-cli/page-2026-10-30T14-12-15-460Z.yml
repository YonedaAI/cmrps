            - text: ", which places it in regime 7 and separates decidability from classification."
          - paragraph [ref=e1666]: The register therefore has a constructive use. An obstruction names the restriction a classification theorem needs. McDuff’s theorem tells a would-be factor classification to restrict to the amenable class, and that restricted classification exists. Wildness tells a would-be module classification to restrict to the derived-tame side. The unrecognizability theorem tells a would-be four-manifold classification to restrict to decomposable classes. Each obstruction pairs with a restricted positive theorem, and that pairing is the working form of the program’s negative results.
          - paragraph [ref=e1668]:
            - strong [ref=e1669]: Remark 13
            - text: . The program founding documents warn against assuming that physical theories possess a finite collection of exceptional objects analogous to the twenty-six sporadic groups
            - link "[1]" [ref=e1670] [cursor=pointer]:
              - /url: "#bib-corpus-1"
            - text: . The sporadic groups exist and are exhaustive in the finite-simple setting, and the corresponding question for physical theories is open. The obstruction register shows what a periodic table must record where no table exists.
