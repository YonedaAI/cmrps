          - paragraph [ref=e1488]:
            - strong [ref=e1489]: Remark 11
            - text: ". Row 21 records a proved parametric classification: quantum monotone metrics are classified by operator monotone functions"
            - link "[48]" [ref=e1490] [cursor=pointer]:
              - /url: "#bib-corpus-52"
            - text: ". The parameter class here is an infinite-dimensional class of functions, not the finite or discrete data of the other regime-1 rows, and uniqueness fails in the quantum case. The program periodic table lists the same domain among open classification problems because the classification is not a finite list. Both statements stand together: the classification theorem is proved, and the classification is not finite."
          - paragraph [ref=e1491]:
            - text: Within the evidence base, classification is sharp exactly where the invariant is finite or explicitly parameterized, and the classification content can be entirely global. Every regime-1 and regime-2 row of
            - link "3" [ref=e1492] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: has a finite or explicitly parameterized invariant, and the domains without such invariants are exactly the domains with no classification theorem. The global character of symplectic classification is Darboux’s theorem
            - link "[6]" [ref=e1493] [cursor=pointer]:
              - /url: "#bib-corpus-6"
            - text: ": any two symplectic manifolds of the same dimension are locally symplectomorphic, so the local invariant is empty and the classifying data must be global. The contrast with Riemannian geometry, where curvature supplies local invariants, is structural rather than incidental."
          - heading "Classification, parameterization, recognition" [level=3] [ref=e1494]
          - paragraph [ref=e1495]: Three classification achievements are often conflated. A parameterization assigns uniform finite data to each object. A classification lists the objects exhaustively. A recognition procedure identifies an object algorithmically from companion data.
          - paragraph [ref=e1496]:
            - text: The classification of finite simple groups delivers the second achievement and only part of the third. The list of families and sporadic groups is complete
            - link "[1]" [ref=e1497] [cursor=pointer]:
              - /url: "#bib-corpus-1"
            - text: ","
            - link "[2]" [ref=e1498] [cursor=pointer]:
              - /url: "#bib-corpus-2"
            - text: ", and practical identification runs through companion data of atlas type: order, Schur multiplier, outer automorphism group, presentations, and character tables with power maps"
            - link "[3]" [ref=e1499] [cursor=pointer]:
              - /url: "#bib-corpus-3"
            - text: . No clean uniform parameterization analogous to Dynkin diagrams is known
            - link "[1]" [ref=e1500] [cursor=pointer]:
              - /url: "#bib-corpus-1"
            - text: . The template program itself therefore sits in regime 2 of
            - link "7" [ref=e1501] [cursor=pointer]:
              - /url: "#def:regimes"
            - text: ", and a periodic table of physical structures cannot expect more from its analogy than the template delivers."
          - paragraph [ref=e1502]:
            - text: The analogy between the two classification problems is architectural rather than evidentiary. The finite simple groups share one definition; physical systems have no universally accepted mathematical definition, and the schema of
            - link "1" [ref=e1503] [cursor=pointer]:
              - /url: "#def:representation"
            - text: is a candidate. The founding documents warn against assuming that physical theories possess a finite collection of exceptional objects analogous to the twenty-six sporadic groups
            - link "[1]" [ref=e1504] [cursor=pointer]:
              - /url: "#bib-corpus-1"
            - text: ". Exceptional mathematics exists and the taxonomy must accommodate it: the exceptional Lie algebras"
            - link "[4]" [ref=e1505] [cursor=pointer]:
