            - strong [ref=e620]: Definition 6
            - text: (Evidence grades). A statement carries grade 1 when it is a mathematical formulation, grade 2 when a rigorous proof exists in the literature, and grade 3 when the statement has achieved physical validation, meaning that its physical realization and its empirical selection have been established for the systems it describes.
          - paragraph [ref=e622]:
            - strong [ref=e623]: Definition 7
            - text: "(Classification regimes). A domain of mathematical structures is assigned to exactly one of seven regimes. Regime 1 is complete and parameterized: a classification theorem exists and a finite or explicitly described parameter class determines the object. Parameter classes range from finite data such as dimension vectors to infinite function classes such as operator monotone functions, and the classification is a bijection with the parameter class in either case. Regime 2 is complete but unparameterized: a classification theorem exists and no uniform parameterization is known. Regime 3 is complete as obstruction: the classification content is the obstruction itself. Regime 4 is open: partial results, normal forms, or claims only. Regime 5 is impossible in the stated generality: a theorem forbids the classification. Regime 6 is undecidable: no algorithm can carry the classification. Regime 7 is decidable but unclassified."
