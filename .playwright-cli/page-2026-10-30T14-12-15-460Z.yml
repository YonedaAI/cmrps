            - text: "are both operator monotone and give different metrics. The uniqueness statement is therefore false in the quantum case, and the last clause follows: a criterion that names a single quantum monotone metric makes an additional choice beyond the classification theorem. ◻"
          - paragraph [ref=e1918]:
            - link "15" [ref=e1919] [cursor=pointer]:
              - /url: "#thm:monotone"
            - text: fixes what empirical distinguishability can borrow from information geometry. In the classical case the statistical distance is canonical. In the quantum case the statistical distance is a choice inside a proved parameterization, so an observational equivalence relation built on such distances must state the choice.
          - heading "Observational equivalence" [level=3] [ref=e1920]
          - paragraph [ref=e1921]:
            - text: Two theories that differ as mathematical descriptions may be empirically indistinguishable in an accessible regime, so observational equivalence is a further quotient that the mathematical classification does not compute. Conversely an equivalence that forgets the monoidal or symmetric layer is too coarse to be a correct identification at all, because isocategorical groups refute it
            - link "[12]" [ref=e1922] [cursor=pointer]:
              - /url: "#bib-corpus-12"
            - text: . Any observational criterion must therefore be fine enough to respect the preserved-structure requirement and coarse enough to quotient the empirically indistinguishable.
          - paragraph [ref=e1923]:
            - text: "Formalizing that criterion needs an observation functor with four pieces of data: a domain of theories, a codomain of observational constraints or predictions, a composition rule with coarse-graining, and the induced equivalence classes of"
            - link "10" [ref=e1924] [cursor=pointer]:
              - /url: "#def:observational"
            - text: ". The record contains none of the four. Whether observational equivalence composes in interacting regimes is unstudied, and the positive question of what makes two descriptions one physical system is open: the isocategorical counterexample shows what is insufficient, and no reconstruction criterion for sameness exists."
