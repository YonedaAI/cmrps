            - text: below covers, and those rows carry partial data or nothing at all where a classification theorem would sit.
          - paragraph [ref=e1478]:
            - text: The regime-4 rows are partial in four distinct ways. Quantum channels carry only normal-form data
            - link "[10]" [ref=e1479] [cursor=pointer]:
