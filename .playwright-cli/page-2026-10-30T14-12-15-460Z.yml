            - strong [ref=e1549]: Theorem 12
            - text: "(Survey: non-classification outside tame regimes, assembled from McDuff, Adyan-Rabin, the wildness results, Tancer, Etingof-Gelaki, and Grochow-Qiao)."
            - emphasis [ref=e1550]:
