            - text: which asserts that every admissible physical system is generated from a collection of fundamental structural families under admissible constructions. The identity is a conjecture and is never used here as a lemma. The results assembled around it are the classification regimes where theorems exist, the obstruction theorems that forbid classification elsewhere, the reconstruction theorems that recover objects from probes, and the empirical constraints that no mathematical classification can discharge.
          - paragraph [ref=e91]: This assembly establishes four results. Twenty-eight mathematical domains fall into six realized classification regimes, with complete invariants appearing only where the invariant is finite or explicitly parameterized. Seven impossibility theorems show that wild representation categories, non-amenable factors, and generic four-manifolds admit no uniform classification. Every reconstruction theorem on record requires its full algebraic hypotheses, and dropping the symmetric or monoidal structure admits non-isomorphic counterexamples. Resolving the structural classification conjecture would complete the mathematical classification alone, leaving physical realization and empirical selection unconstrained.
          - paragraph [ref=e92]: "A mathematical classification is never stated as a physical realization, and neither is ever stated as empirical selection. The strongest defensible claim on record is the founding program’s own calibration: the architecture is precise enough to organize a substantial, long-term mathematical research program, and its individual components produce valuable results even if a universal classification theorem ultimately proves unattainable."
