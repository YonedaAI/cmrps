            - heading "Abstract" [level=2] [ref=e25]
            - text: "Quantum physical systems admit a complete structural classification only in restricted regimes, and this paper records where those regimes begin and end. Finite-dimensional observable algebras are classified by one combinatorial invariant, the dimension vector of the block decomposition. Amenable operator-algebraic models are classified by Murray-von Neumann type together with Connes invariants. Completely positive maps admit a canonical normal form through minimal Stinespring dilations, unique up to unitary equivalence, and the Kraus rank of that normal form is not an isomorphism invariant of channels. Beyond the amenable class no finite answer is possible: uncountably many pairwise non-isomorphic separable"
            - generic [ref=e27]:
              - math [ref=e29]:
                - generic [ref=e32]:
                  - generic [ref=e33]:
                    - generic [ref=e34]: I
                    - generic [ref=e35]: I
                  - generic [ref=e36]: "1"
              - generic [ref=e39]:
                - generic [ref=e40]: II
                - generic [ref=e41]: "1"
            - text: factors exist, so no finite list of factor types can be exhaustive. On the categorical side, the Doplicher-Roberts reconstruction theorem and Deligne’s theorem classify superselection and symmetric tensor categories under explicit hypotheses, and the Etingof-Gelaki examples show that any equivalence forgetting the symmetric structure fails to recover its group. Quantum monotone metrics form a parametric family rather than a unique choice. The paper separates classified islands from proved impossibilities and open problems, and reports executable models of the finite-dimensional taxonomy as computational evidence only.
          - heading "Introduction" [level=2] [ref=e49]
          - paragraph [ref=e50]: "Three kinds of result organize the classification of quantum physical systems: complete classification theorems, proved non-classification theorems, and open problems. The finite-dimensional theory is complete and combinatorial. The amenable operator-algebraic theory is complete and analytic. Outside the amenable class, McDuff’s theorem of 1969 rules out any finite list of factor types, and this negative result is content of the theory, not a temporary difficulty. The categorical theory is complete under explicit hypotheses and open without them."
          - paragraph [ref=e51]:
            - text: "The classification question follows the program of this series. Fix a category of mathematical representations of physical systems and an equivalence relation on its objects; classify the objects up to that equivalence. For quantum systems the representations are operator-algebraic and categorical: Hilbert spaces,"
            - generic [ref=e53]:
              - math [ref=e55]:
                - generic [ref=e58]:
                  - generic [ref=e59]: C
                  - generic [ref=e60]: ∗
              - generic [ref=e63]:
                - text: C
                - generic [ref=e64]: ∗
            - text: "-algebras and von Neumann algebras of observables, completely positive maps between them, and tensor categories of superselection sectors. The equivalence relations that appear in established results are exact:"
            - generic [ref=e70]:
              - math [ref=e72]:
                - generic [ref=e73]: ∗
              - generic [ref=e77]: ∗
            - text: "-isomorphism of algebras, unitary equivalence of dilations, monoidal equivalence of categories, each with the structure it preserves made explicit."
          - paragraph [ref=e78]: "Three structural families carry the quantum material: Hilbert spaces and operator algebras, probability and measure structure on the quantum side, and tensor categories with compositional structure. The classifying invariants in force are correspondingly three kinds: a discrete invariant (the dimension vector), a pair of analytic invariants (Murray-von Neumann type and Connes invariants), and a parametric invariant (an operator monotone function classifying a monotone metric). The families are candidate organizing families, and no independence or completeness claim about them is used here."
          - paragraph [ref=e79]: Two scope restrictions hold throughout. The long-term classification target of the program is a research objective and is never assumed as a hypothesis; every statement proved here is proved from its own hypotheses. The paper classifies mathematical representations of physical systems.
