          - heading "Tensor categories and superselection" [level=2] [ref=e9830]
          - paragraph [ref=e9831]: "Superselection sectors of a quantum field theory organize into tensor categories, and two reconstruction theorems classify such categories under explicit hypotheses. The hypotheses are load-bearing: both theorems fail or become open when they are dropped, and one equivalence-negligible layer turns out to carry the group."
          - paragraph [ref=e9833]:
            - strong [ref=e9834]: Definition 40
            - text: "(Superselection category). Fix a local net of observable algebras satisfying the Haag-Kastler axioms and the DHR selection criterion: representations that are equivalent to the vacuum representation on the algebra of every causally disconnected region. Under Haag duality these representations correspond to localized transportable endomorphisms of the observable algebra, and their intertwiners form a symmetric tensor"
            - generic [ref=e9836]:
              - math [ref=e9838]:
                - generic [ref=e9839]: ∗
              - generic [ref=e9843]: ∗
            - text: "-category with conjugates, direct sums, and subobjects."
          - paragraph [ref=e9844]: The tensor structure of that category is concrete. Composition of endomorphisms supplies the tensor product, intertwiners supply the morphisms, conjugate endomorphisms supply duals, and the statistics of composing an endomorphism with itself distinguishes bosonic from fermionic sectors. Haag duality is the step that passes from representations to endomorphisms, and the selection criterion is what bounds the sectors; modified selection rules change the category.
