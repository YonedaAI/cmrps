          - heading "Discussion" [level=2] [ref=e11239]
          - paragraph [ref=e11240]:
            - text: Three complete classifications cover finite-dimensional observable algebras, amenable factors, and symmetric tensor categories under stated hypotheses. Finite-dimensional observable algebras are classified by dimension vector with a self-contained proof. Amenable factors are classified by Murray-von Neumann type and Connes invariants with proofs in the literature of Murray-von Neumann, Connes, and Haagerup. Symmetric tensor categories under the hypotheses of Deligne and Doplicher-Roberts are classified by the underlying supergroup. Beyond these, the general
            - generic [ref=e11242]:
              - math [ref=e11244]:
                - generic [ref=e11247]:
                  - generic [ref=e11248]:
                    - generic [ref=e11249]: I
                    - generic [ref=e11250]: I
                  - generic [ref=e11251]: "1"
              - generic [ref=e11254]:
                - generic [ref=e11255]: II
                - generic [ref=e11256]: "1"
            - text: factors admit no finite list of types, and the classification question changes shape there from listing objects to delimiting the classifiable classes.
          - paragraph [ref=e11264]:
            - text: Three limitations bound the results. The first is exactness of equivalence. Every classification here is up to an equivalence that preserves named layers of structure, and
            - link "45" [ref=e11265] [cursor=pointer]:
              - /url: "#prop:eg"
            - text: shows that dropping the symmetric layer changes the answer. The classification of mathematical representations is therefore always relative to the preserved structure, and none of it establishes physical equivalence of the systems the representations describe. The second limitation is hypothesis dependence.
            - link "Theorem 41, Theorem 44" [ref=e11266] [cursor=pointer]:
              - /url: "#thm:dr,thm:deligne"
            - text: hold under conjugates, direct sums, subobjects, scalar endomorphisms of the unit, and in Deligne’s case
            - generic [ref=e11268]:
              - math [ref=e11270]:
                - generic [ref=e11271]: C
              - generic [ref=e11275]: C
            - text: "-linearity, abelianness, rigidity, and subexponential growth in characteristic zero; relaxed selection criteria or growth hypotheses leave the classified regime. The third limitation is depth of the record. The finite-dimensional proofs are given in full here; the operator-algebraic and categorical proofs are established in the sources cited and are not reproduced, and the claim on each is only as strong as those sources."
          - paragraph [ref=e11276]:
            - text: The parametric result of
            - link "8" [ref=e11277] [cursor=pointer]:
              - /url: "#sec:metrics"
            - text: deserves separate emphasis because it constrains future work. Quantum monotone metrics are classified by a continuous parameter, so any proposed uniqueness statement for quantum information geometry must either fix the parameter or weaken to the parametric family. Extending classical uniqueness statements across the classical-to-quantum boundary is not a defensible move.
          - paragraph [ref=e11278]: "The three complete classifications instantiate the three structural families of the quantum domain with their classifying invariants in place: Hilbert spaces and operator algebras through the dimension vector and the Murray-von Neumann type with Connes invariants, probability and measure structure through the operator monotone parameter, and tensor categories through the underlying supergroup of a symmetric tensor category. The McDuff obstruction joins the register of non-classification theorems, and the Etingof-Gelaki counterexample fixes the equivalence discipline for any later classification by tensor data. The evidence for the program’s target statement is therefore mixed: restricted-class theorems exist in quantum theory, and obstruction theorems mark exactly where they stop."
          - paragraph [ref=e11279]:
            - text: No theorem here states that any two of the structural families used above are logically independent, and no theorem here establishes physical or empirical equivalence of any two systems. The long-term classification target of the program remains a research objective; the results of this paper are consistent with it in the classified islands and constrain it by theorem in the non-classifiable ocean. The open problems of
            - link "9" [ref=e11280] [cursor=pointer]:
              - /url: "#sec:regimes"
            - text: "are the natural restricted-class targets next, and each has the shape of a solved problem: a named class, a declared equivalence, and an invariant that either separates or provably cannot."
          - paragraph [ref=e11281]: A complete quantum classification program would need three further deliverables, and this paper supplies none of them. It would need a normal form for channels that upgrades to a classification under a named equivalence, a structure theory for fusion categories that decides the double-dual coherence question, and a restricted classification of non-amenable factors under explicit rigidity hypotheses. Each deliverable is a classification problem of the same shape as the solved ones, and the obstructions recorded here bound what any solution can claim.
          - heading "Conclusion" [level=2] [ref=e11282]
          - paragraph [ref=e11283]:
            - text: "Quantum physical systems admit classification by dimension vector in finite dimension, by Murray-von Neumann type and Connes invariants on the amenable side of operator algebra, and by underlying supergroup in the symmetric tensor categories of superselection theory. Completely positive maps admit a minimal Stinespring normal form whose Kraus rank is not a channel classification. Quantum monotone metrics are parametric, classified by operator monotone functions rather than by a unique metric. Against these classifications stands the McDuff obstruction: uncountably many separable"
            - generic [ref=e11285]:
              - math [ref=e11287]:
                - generic [ref=e11290]:
