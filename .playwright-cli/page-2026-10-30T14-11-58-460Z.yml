          - paragraph [ref=e9919]:
            - link "41" [ref=e9920] [cursor=pointer]:
              - /url: "#thm:dr"
            - text: is stated with its hypotheses on the face of the statement. The symmetric structure, the existence of conjugates, and the scalar endomorphism ring of the unit are each used in the proof; a category missing them lies outside the theorem. The reconstruction of the gauge group from superselection data is the completion of the Doplicher-Haag-Roberts analysis, and the supergroup grading accounts for fermionic sectors.
          - paragraph [ref=e9922]:
            - emphasis [ref=e9923]: Remark 42
            - text: (Selection criteria matter). The DHR criterion selects representations with trivial behaviour at infinity. Long-range forces such as electromagnetism violate the criterion, and the resulting categories fall outside
            - link "41" [ref=e9924] [cursor=pointer]:
              - /url: "#thm:dr"
            - text: unless the analysis is redone with modified selection rules. A classification claim for superselection categories is therefore always relative to the selection criterion in force.
          - paragraph [ref=e9926]:
            - emphasis [ref=e9927]: Remark 43
            - text: (What reconstruction does not do). The Doplicher-Roberts theorem recovers a symmetry group from sector data. It does not recover spacetime, dynamics, or states, and it does not classify the systems whose sectors are being read.
