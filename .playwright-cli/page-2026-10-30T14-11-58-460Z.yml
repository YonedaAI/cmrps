                    - generic [ref=e11292]: I
                    - generic [ref=e11293]: I
                  - generic [ref=e11294]: "1"
              - generic [ref=e11297]:
                - generic [ref=e11298]: II
                - generic [ref=e11299]: "1"
            - text: factors exist, so no finite list of factor types is exhaustive and no CFSG-style list exists outside restricted classes. The open problems of the Elliott program, fusion-category structure, non-amenable type
            - generic [ref=e11308]:
              - math [ref=e11310]:
