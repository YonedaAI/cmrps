          - paragraph [ref=e3262]:
            - emphasis [ref=e3263]: Remark 15
            - text: "(Recognition). The dimension vector solves the recognition problem for this class as well as the classification problem: given matrix blocks, comparing their size multisets decides"
            - generic [ref=e3265]:
              - math [ref=e3267]:
                - generic [ref=e3268]: ∗
              - generic [ref=e3272]: ∗
            - text: "-isomorphism directly, and the comparison is a sort. In the finite-dimensional regime classification, parameterization, and recognition therefore coincide. The classification of finite simple groups separates the three: it delivers the list, partially solves recognition through atlas data, and supplies no uniform parameterization. The separation reappears, in worse form, in"
            - link "5" [ref=e3273] [cursor=pointer]:
              - /url: "#sec:mcduff"
            - text: ". For channels the recognition problem is open in the same way the classification problem is: comparing Choi spectra decides nothing beyond the orbit invariants of"
            - link "36" [ref=e3274] [cursor=pointer]:
              - /url: "#prop:krausrank"
            - text: ", and no recognition procedure for unitary equivalence of channels is on record."
