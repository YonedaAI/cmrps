          - paragraph [ref=e9984]:
            - text: "Deligne’s theorem classifies a purely categorical hypothesis class, without reference to any net of observables. The two reconstruction theorems differ in their inputs and agree in their outputs. The Doplicher-Roberts theorem starts from the sectors of a net of observables, so its hypotheses are analytic as well as categorical: Haag duality, the selection criterion, and the tensor structure of intertwiners. Deligne’s theorem starts from"
            - generic [ref=e9986]:
              - math [ref=e9988]:
                - generic [ref=e9989]: C
              - generic [ref=e9993]: C
            - text: "-linearity, abelianness, rigidity, symmetry, and subexponential growth. Both conclusions are representation categories of supergroups, so the two theorems are the analytic and the categorical face of one reconstruction pattern, and neither classifies the systems whose sectors or categories are being read. Together"
            - link "Theorem 41, Theorem 44" [ref=e9994] [cursor=pointer]:
              - /url: "#thm:dr,thm:deligne"
            - text: settle the classification of the symmetric categories that appear as superselection data, and of the finite-growth categories that appear in low-dimensional and combinatorial models. The case of fusion categories (finitely many simple objects, semisimple, finite categorical dimension) is open beyond these hypotheses.
