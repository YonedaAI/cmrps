            - text: "Etingof and Gelaki exhibit the affine symplectic group of a vector space over the field of two elements and a corresponding affine pseudosymplectic group: these are non-isomorphic and isocategorical, meaning their representation categories are monoidally equivalent. The symmetric structure of the two categories differs, and Tannaka reconstruction for symmetric tensor categories recovers the group from the symmetric structure alone. The symmetric layer is therefore load-bearing in the sense of"
