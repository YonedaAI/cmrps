          - heading "Computational evidence" [level=2] [ref=e11111]
          - paragraph [ref=e11112]: The source files that accompany this paper as supplementary material contain executable models and three experiment scripts; they live in the directory . They are computational evidence for the finite-dimensional and channel statements. They are not proofs, and no part of the paper rests on them for validity.
          - paragraph [ref=e11113]: "The Haskell module instantiates the taxonomy classes for this paper’s physical systems: finite-dimensional block algebras, Hilbert-space systems with observable algebras, operator-algebra systems with factor data, quantum channels with Kraus data, and superselection categories with tensor data. The instances cover the system-record class, the Hilbert-space and operator-algebra family class, the probability and measure family class on the quantum side, the tensor-category family class, the construction and decomposition hooks, irreducibility of matrix blocks under direct sum, and mathematical equivalence of block algebras by dimension vector. The instances name their methods after the definitions and theorem targets of this paper (dimension vector, minimal Kraus rank, Stinespring minimal dilation, operator monotone parameter). These are executable models of the taxonomy, validated against the statements of the paper; no machine-checked formalization is claimed for them."
