            - text: strata, and channel isomorphism define the current frontier. The supplementary code records the finite-dimensional content as computational evidence and nothing more.
          - paragraph [ref=e11319]: The negative results are part of the answer. The McDuff obstruction and the Etingof-Gelaki counterexample say where classification stops and which layers of structure carry it, and a classification program that records only its successes would misreport the state of the subject.
