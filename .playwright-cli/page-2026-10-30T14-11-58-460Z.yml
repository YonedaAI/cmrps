          - paragraph [ref=e11042]: "The regimes show a pattern the rest of the series exploits. Classification is complete exactly where the invariant is discrete or parametric and the hypotheses are stated; finite lists stop where the structure theory manufactures uncountably many non-isomorphic objects; and the question is open where a presentation theorem exists but the invariants do not separate. The finite-dimensional theory and the amenable theory differ in technique but agree in shape: both reduce a system to a list of standard pieces plus invariant data. The McDuff obstruction marks where that shape cannot persist."
          - paragraph [ref=e11043]:
            - text: Five kinds of classification result appear in
            - link "3" [ref=e11044] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: . The dimension-vector classification is complete and parameterized, in the manner of the Dynkin classification of semisimple Lie algebras. The amenable factor classification is complete and analytic, its invariants computed from operator-algebraic structure rather than read off combinatorial data. The monotone-metric classification is parametric, in the manner of a classification by continuous parameters.
          - paragraph [ref=e11045]: "The McDuff corollary is a complete obstruction: its classification content is the proof that no finite list exists. The remaining rows are open problems with presentation theorems but no separating invariants. These five kinds separate cleanly, and a quantum classification claim that mixes two of them is misstated."
