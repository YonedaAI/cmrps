          - paragraph [ref=e5302]:
            - emphasis [ref=e5303]: Proof.
            - text: "The proof exhibits a fiber functor by a Tannakian argument: the subexponential growth condition bounds the dimensions of simple objects, the symmetric structure gives the braiding needed for a faithful tensor functor to super vector spaces, and the resulting fiber functor presents the category as representations of its automorphism group scheme. The supergrading arises from the possible nontriviality of the symmetry on odd parts. ◻"
          - paragraph [ref=e5304]:
            - text: The reconstruction results classify the sector categories of nets that satisfy the hypotheses. Three frontier directions are on the record and none of them is settled. The first generalizes the DHR analysis to higher-form symmetries and notes that an extra factor of order two is not ruled out and would not be realizable by Lagrangian gauge models
            - link "[7]" [ref=e5305] [cursor=pointer]:
              - /url: "#bib-casini-magan"
            - text: ; this is a single-source claim and we record it without weight. The second constructs a global quantum gauge group through a braided DoplicherRoberts program
            - link "[31]" [ref=e5306] [cursor=pointer]:
              - /url: "#bib-pinzari"
            - text: ; it is work in progress at the preprint stage. The third is the soliton-data warning already cited
            - link "[26]" [ref=e5307] [cursor=pointer]:
              - /url: "#bib-mueger"
            - text: ", which is proved and shows that fixed-point-net sector categories need data beyond the braiding."
          - paragraph [ref=e5309]:
            - emphasis [ref=e5310]: Remark 31
            - text: (Long-range forces). The DHR criterion selects representations whose deviations from the vacuum are localized. Electromagnetism has long-range fields and its charged representations violate the strict localization hypothesis, so the DHR analysis as stated does not cover quantum electrodynamics without modification. The classification of sectors is therefore a classification within a restricted hypothesis class, not of all quantum field theories.
          - heading "Reconstruction and classification" [level=2] [ref=e5311]
          - paragraph [ref=e5312]: "The DoplicherRoberts theorem is a reconstruction theorem: it recovers a group from the probe data of its representation category. A second line of reconstruction results runs through commutative and topological probes, and comparing the two clarifies what the gauge classification of this volume does and does not achieve."
