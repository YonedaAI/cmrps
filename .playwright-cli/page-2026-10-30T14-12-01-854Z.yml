          - paragraph [ref=e5787]:
            - text: "The OpenAI claim carries the strongest external attention and the weakest public evidence. Its status string, binding on every mention of the work, is: existence claimed; manuscript and formalization withheld; verification pending"
            - link "[29]" [ref=e5788] [cursor=pointer]:
              - /url: "#bib-openai"
            - text: ","
            - link "[22]" [ref=e5789] [cursor=pointer]:
              - /url: "#bib-kitp"
            - text: . Nothing withheld from the public record can be machine-checked. The release of the artifacts is a tracked event; until then the entry belongs to the claims register and not among theorems.
          - paragraph [ref=e5790]:
            - text: The mass-gap row is the hard constraint. The Clay problem requires existence and a positive mass gap together
            - link "[8]" [ref=e5791] [cursor=pointer]:
              - /url: "#bib-clay"
            - text: . An existence theorem alone does not settle it, so the two entries are never merged. The pre-claim survey of the field, published in January 2026
            - link "[13]" [ref=e5792] [cursor=pointer]:
              - /url: "#bib-douglas"
            - text: ", records that rigorous renormalization has never been made rigorous in the needed generality and that no clear path to the mass gap is known; the October 2026 announcement postdates that survey, challenges its pessimism on the existence side, and confirms its assessment on the mass-gap side."
          - paragraph [ref=e5793]:
            - text: The remaining rows fix the other rungs. A journal-published claim that the community has not verified stays at its rung. A withdrawn preprint leaves the ladder. An outline without proof carries no status. The lattice rows of Table
            - link "2" [ref=e5794] [cursor=pointer]:
              - /url: "#tab:rigorous"
            - text: are rigorous within their regimes and say nothing about the continuum limits the classification needs.
          - paragraph [ref=e5795]:
            - text: The program these claims enter has foundations older than the claims. The OsterwalderSchrader axioms fix the passage from Euclidean correlation functions to a Minkowski theory
            - link "[30]" [ref=e5796] [cursor=pointer]:
              - /url: "#bib-osterwalder-schrader"
            - text: . The renormalization-group program for lattice gauge theories that the existence claims invoke descends from Balaban’s multiscale cluster expansions
            - link "[4]" [ref=e5797] [cursor=pointer]:
              - /url: "#bib-balaban"
            - text: . Glimm and Jaffe’s text is the standard reference for constructive field theory
            - link "[18]" [ref=e5798] [cursor=pointer]:
              - /url: "#bib-glimm-jaffe"
            - text: . The register above is the current frontier of that program, and the classification question is which of its eventual members the invariants of the proved core will reach.
          - paragraph [ref=e5799]: If the OpenAI claim is validated, the admissible set of four-dimensional interacting theories will contain at least one rigorous member, and the classification will record where it sits relative to the known families. Until the artifacts are released, no result of this volume depends on the claim. Classifying the structures that are already proved does not wait on the verdict.
          - paragraph [ref=e5800]:
            - text: A validated existence claim would establish less than it might appear. It would show that a four-dimensional interacting quantum field theory can be constructed with the stated properties, and it would settle the existence half of the Clay problem. It would not give a mass gap, it would not classify the set of such theories, and it would not place the constructed theory inside the classification of gauge structures of Sections
            - link "3" [ref=e5801] [cursor=pointer]:
              - /url: "#sec:lie"
            - text: to
            - link "5" [ref=e5802] [cursor=pointer]:
              - /url: "#sec:anomalies"
            - text: without further work on its gauge group, its bundle data, and its matter representations. The classification program would then face a concrete object in the claimed regime and the question of which invariants reach it. That is the practical shape of the boundary between the proved core and the claims register.
          - heading "Computational experiments" [level=2] [ref=e5803]
          - paragraph [ref=e5804]:
            - text: A companion script computes the ChevalleyEilenberg cohomology of the two small gauge algebras of Example
            - link "22" [ref=e5805] [cursor=pointer]:
              - /url: "#ex:abelian-anomaly"
            - text: exactly over the rationals and reports the algebraic obstruction data. The non-abelian case displays the nonzero first class that records its nontrivial abelian quotient, and the semisimple case displays the vanishing consistent with the absence of abelian quotients. The field-theory anomaly of Definition
            - link "20" [ref=e5806] [cursor=pointer]:
              - /url: "#def:bvbrst-anomaly"
            - text: lives in the local BRST cohomology and is not computed here.
          - paragraph [ref=e5807]:
            - text: Three further scripts accompany the volume as worked illustrations rather than evidence. One records the sphere-bundle classification values of Proposition
            - link "12" [ref=e5808] [cursor=pointer]:
              - /url: "#prop:spheres"
            - text: for five gauge groups and four base dimensions. One evaluates the gluing identities of Theorem
            - link "24" [ref=e5809] [cursor=pointer]:
              - /url: "#thm:frobenius"
            - text: on the group algebra of
