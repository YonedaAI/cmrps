            - heading "Abstract" [level=2] [ref=e25]
            - text: We develop the classification of gauge structures and quantum field theories within the CMRPS program. The subject divides into two territories of unequal evidential standing. The established territory contains the KillingCartan classification of semisimple Lie algebras, the highest-weight classification of their finite-dimensional representations, the classification of principal
            - generic [ref=e27]:
              - math [ref=e29]:
                - generic [ref=e30]: G
              - generic [ref=e34]: G
            - text: "-bundles by homotopy classes of maps into the classifying space"
            - generic [ref=e36]:
              - math [ref=e38]:
                - generic [ref=e40]:
                  - generic [ref=e41]: B
                  - generic [ref=e42]: G
              - generic [ref=e44]: BG
            - text: ", characteristic classes as pullbacks of universal classes, and anomalies as cohomological obstructions that gate quantization. The restricted territory contains functorial topological field theories under the Atiyah axioms and the DoplicherRoberts reconstruction of superselection sectors under the HaagKastler framework. Beyond these islands the evidence is claimed rather than proved. The cobordism hypothesis classifies extended topological field theories by fully dualizable objects, yet the 2009 writeup is an informal proof sketch. The October 2026 four-dimensional quantum chromodynamics claim stands at existence claimed with manuscript and formalization withheld and verification pending, and the YangMills mass gap remains open. We present the classification results with their hypotheses and keep proved, claimed, and open statements apart throughout."
          - heading "Introduction" [level=2] [ref=e45]
          - paragraph [ref=e46]: "Gauge theories and quantum field theories occupy the point in the CMRPS program where classification is strongest on the geometric side and weakest on the analytic side. This volume takes the classification problem for its subject: which gauge structures and which quantum field theories are determined, up to a stated equivalence, by an explicit and computable invariant, and which are not. The answer splits sharply. For principal bundles, semisimple Lie algebras, their finite-dimensional representations, and the obstruction content of anomalies, complete classification theorems exist and are proved in the standard literature. For functorial topological field theories in low dimensions the position is similar. For extended topological field theories the classification is claimed on the strength of a proof sketch. For four-dimensional interacting quantum field theories the position is a claims register: one existence result is announced with its artifacts withheld, the mass gap is open, and several lower-rung claims carry statuses ranging from journal-published-and-unverified to withdrawn."
          - paragraph [ref=e47]:
            - text: A mature classification of mathematical representations of physical systems must record, for each domain, whether the invariant is complete and parameterized, complete but unparameterized, complete as an obstruction, claimed with a proof gap, open, or impossible. This volume records those regimes for the gauge and quantum field theory domains and states each result at exactly the strength the sources support. The split between proved and claimed is itself classification data, and Table
            - link "1" [ref=e48] [cursor=pointer]:
              - /url: "#tab:invariants"
            - text: is its record for this volume.
          - paragraph [ref=e49]:
            - text: Gauge structures and topological field theories classify under three kinds of invariant. Homotopy classes of classifying maps
            - generic [ref=e51]:
              - math [ref=e53]:
