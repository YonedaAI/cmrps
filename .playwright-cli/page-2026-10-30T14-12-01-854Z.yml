          - paragraph [ref=e3797]: "The anomaly statement is the model of a complete obstruction classification: the classification content of the theory is the vanishing of the obstruction. No list of consistent theories is asserted; what is asserted is a necessary and sufficient condition for consistency. Anomaly cancellation conditions then become computable inputs to the classification of matter content: a matter representation contributes to the anomaly classes, and only the representations whose contributions cancel are admissible."
