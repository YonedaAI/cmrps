          - paragraph [ref=e1188]:
            - emphasis [ref=e1189]: Proof.
            - text: "Uniqueness is the classification of a representation by its highest weight: the weight strings of a finite-dimensional irreducible are determined by the action of the raising and lowering operators, and the highest weight is annihilated by every raising operator and integral in the weight lattice. Existence is the content of the BorelWeil construction, or equivalently of the Verma module with the maximal proper submodule quotiented out; the quotient is finite-dimensional exactly when the highest weight is dominant integral. Irreducibility follows because every nonzero submodule contains a highest weight vector, and the highest weight space of an irreducible is one-dimensional. ◻"
          - paragraph [ref=e1190]:
            - text: "Together these two theorems give the complete Lie-theoretic layer of a gauge theory: the gauge algebra by its Dynkin diagram, the real form by its Satake diagram, the connected gauge group by central quotient data, and the finite-dimensional matter representations by dominant integral weights. Example instantiations of the invariant record appear in the code evidence of Section"
            - link "11" [ref=e1191] [cursor=pointer]:
              - /url: "#sec:experiments"
            - text: .
