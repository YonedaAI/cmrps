          - paragraph [ref=e4927]: The status of this statement is a claim with a proof gap. The 1995 paper states the hypothesis; the 2009 work describes itself as an informal sketch of a proof, and the range of cases in which the classification is complete is not settled on the public record. We therefore record the extended classification as claimed rather than proved, and no result in this volume depends on it as a theorem. Low-dimensional cases are the subject of later work; resolving which of those cases carry complete proofs is an open item.
          - paragraph [ref=e4929]:
            - emphasis [ref=e4930]: Remark 26
            - text: (What topological classification does not give). A topological quantum field theory is a functorial invariant of manifolds up to cobordism, not a quantum field theory on a fixed spacetime with local degrees of freedom. The classification results in this section say nothing about YangMills theory, quantum chromodynamics, or any theory with a metric and a renormalization problem. The line between the topological and the local is the line between classification and the claims register.
