                  - generic [ref=e59]: B
                  - generic [ref=e60]: G
                  - generic [ref=e61]: "]"
              - generic [ref=e63]: "[X, BG]"
            - text: determine principal bundle topologies. Root diagrams and dominant integral weights determine Lie symmetries and matter representations. Fully dualizable objects name the extended topological field theories. Principal bundles with connection form the differential-geometric substrate, and operator algebras and tensor categories parameterize localized superselection sectors. In the terms of the series, the structural families in force are the principal-bundle family and the topological and higher-categorical family, with the tensor-category family wherever superselection sectors are in play.
          - paragraph [ref=e64]: "The classification template of the finite simple groups is instructive in one respect and misleading in another. It is instructive because it separates three achievements that are often conflated: a parameterization by uniform data, an exhaustive list up to isomorphism, and a recognition procedure driven by companion invariants. The finite simple groups have the list, lack the uniform parameterization, and carry a practical recognition apparatus. This volume keeps the same separation: the Dynkin diagram is a uniform parameterization, the homotopy-class description of bundles is both a parameterization and a list, and the anomaly classes are a recognition test. The template is misleading if it suggests that a gauge theory or a quantum field theory will be organized by a finite set of families with finitely many exceptions. The classification data of this volume shows instead that the topological and algebraic layers are tame and the analytic layer is open or claimed, and no finite exception list is in evidence."
          - paragraph [ref=e65]: Throughout the series an announced result, a manuscript, a machine-checked formalization, an independently verified proof, and an accepted theorem are five different things. The constructive quantum field theory frontier of 2024 to 2026 is dense with announcements, and the ladder is what keeps them from being absorbed into the proved core. An existence theorem for a four-dimensional interacting theory would not settle the YangMills mass gap problem, which requires existence together with a positive mass gap. No withheld formalization may be described as machine-checked.
          - paragraph [ref=e66]: "The mathematical classification of gauge and quantum field theories splits into an established topological and algebraic core and an unverified analytic frontier. Complete classification invariants characterize Lie symmetries, bundle topologies, two-dimensional topological field theories, and localized superselection sectors: Dynkin diagrams, universal characteristic classes, Frobenius algebras, and unitary tensor categories do this work. The classification of four-dimensional continuum field theories, connection moduli spaces, and non-perturbative mass spectra remains conditional, claimed without public proof artifacts, or open."
