            - text: with a degenerate-counit negative control. One enumerates the finite-type Dynkin diagrams up to rank eight by testing positive definiteness of Cartan matrices over all arrow assignments of every tree. Each illustrates the tables and arguments of the sections above; none of them is claimed as evidentiary support.
