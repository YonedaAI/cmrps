            - text: vanishes. Outside these topological and algebraic domains, the classification of four-dimensional continuum field theories lacks a non-perturbative construction, the gauge connection moduli spaces are unclassified, and the mass spectrum is open.
          - paragraph [ref=e5928]: "The two incomplete places are the extended topological field theory classification and four-dimensional constructive quantum field theory. The first is claimed on the strength of a proof sketch and registered as such. The second is a claims register: one existence result announced with its artifacts withheld, one mass gap open, one journal-published unverified construction, one withdrawn preprint, regime-restricted lattice theorems, and one outline. The ladder keeps them apart, and the classification program does not import any of them as a dependency."
          - paragraph [ref=e5929]: The structural lesson is the one the series draws from Darboux as well. Classification content is exactly where the invariant is finite or parameterized, which for gauge structures means the topological and the algebraic layers. The analytic layer, where a metric, a renormalization group, and a continuum limit are in play, is where classification is claimed or open. A complete classification of mathematical representations of gauge theories would therefore proceed from the proved islands outward, and the boundary of the proved region is now recorded precisely.
          - paragraph [ref=e5930]: "Two outcomes of the continuing program are both acceptable results. One is a classification of a restricted class: flat connections on a fixed bundle, self-dual connections in a fixed topological class, or the sectors of nets satisfying a fixed axiom list. The other is an impossibility theorem showing that a natural classification objective cannot be met without additional restrictions. The obstruction results already in evidence, from the anomaly classes to the global-form distinctions to the extra data in braided sector categories, are of the second kind and are theorems rather than caveats."
          - paragraph [ref=e5931]: The volume closes where the classification is sharp. Gauge algebras, matter representations, bundles, anomaly-free configurations, and two-dimensional topological theories are classified by explicit invariants under stated equivalences. The extended topological classification is claimed and registered as claimed. Four-dimensional existence is claimed with its artifacts withheld and the mass gap is open. The claim ladder keeps those rows apart, and the classification program carries the proved rows forward without waiting on the others.
