          - paragraph [ref=e5673]:
            - text: The claim ladder separates an announced result, a manuscript, a machine-checked formalization, an independently verified proof, and an accepted theorem; a result moves up the ladder only by an artifact that can be checked, and each row of the register below keeps its current rung. Table
