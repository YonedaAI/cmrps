          - heading "Open problems" [level=2] [ref=e5836]
          - paragraph [ref=e5837]: Six problems bound the classification in this volume and each is stated at the strength the record supports.
          - paragraph [ref=e5838]: The proof status of the extended topological field theory classification is the first. The cobordism hypothesis is stated and the 2009 writeup is an informal sketch; which cases of the classification carry complete proofs, and in which dimensions, is not settled on the public record. Low-dimensional cases are the subject of later work, and resolving which of them are complete is the open item that would move the extended classification from claimed to proved.
          - paragraph [ref=e5839]: The anomaly classification has its own gap. The local and algebraic obstruction classes are computed, and the global anomaly question has a partial theory, but the general cobordism-spectrum statement that would classify all anomalies uniformly is not on the record in a form we can verify. A primary source is needed before any statement of that classification may be used.
          - paragraph [ref=e5840]:
            - text: The constructive quantum field theory claims have a tracked event. The release of the withheld manuscript and the claimed formalization behind the October 2026 existence announcement would move that row of Table
            - link "3" [ref=e5841] [cursor=pointer]:
              - /url: "#tab:claims"
            - text: "from withheld to publicly checkable, and a committee verdict would move it further. Until the release, no result of this volume depends on it. The competing journal-published construction of a four-dimensional YangMills theory with a mass gap carries a second question: where its continuum limit is closed and where it is assumed. An audit of that construction is the sharpest available test of the mass-gap claim, and the audit has not been done."
          - paragraph [ref=e5842]:
            - text: The algebraic framework has an open foundation. The HaagKastler axiom list is under discussion, and the sector classification of Section
            - link "7" [ref=e5843] [cursor=pointer]:
              - /url: "#sec:aqft"
            - text: is conditional on the axiom set in force and on Haag duality. Whether the DoplicherRoberts uniqueness statement survives the relaxation of those hypotheses is open; the braided setting already shows that extra data can appear.
          - paragraph [ref=e5844]: A single-source frontier claim needs verification. The possible extra factor of order two in the sector data of higher-form symmetric theories is noted in one preprint, and the classification of higher-form sectors would change if the possibility is realized. We record it and do not build on it.
          - paragraph [ref=e5845]: The classification of connections modulo gauge is open outside restricted cases. The bundle is classified, the gauge algebra is classified, and the matter representations are classified; the moduli space of connections carries the analytic theory and no classification theorem in the sense of this volume reaches it. A classification restricted to flat connections, or to self-dual connections in dimension four, is the natural next restricted-class result.
          - heading "Limitations" [level=2] [ref=e5846]
          - paragraph [ref=e5847]: This volume classifies structures, not physical theories in full. Four limitations bound the conclusions.
          - paragraph [ref=e5848]:
            - text: The classification of principal bundles is classification of the bundle. Connections are classified only modulo gauge in restricted settings, and no general classification theorem for connections is recorded. The dynamics of a gauge theory, the quantum state space, and the observable algebra are outside the classification results of Sections
            - link "3" [ref=e5849] [cursor=pointer]:
              - /url: "#sec:lie"
            - text: and
            - link "4" [ref=e5850] [cursor=pointer]:
              - /url: "#sec:bundles"
            - text: .
          - paragraph [ref=e5851]: The superselection analysis is restricted to nets satisfying the DHR criterion and Haag duality. Long-range forces such as electromagnetism fall outside the criterion as stated, and the HaagKastler axiom list itself is under discussion. The DoplicherRoberts theorem reconstructs a gauge group from the sectors of a net that satisfies its hypotheses; it does not classify nets.
          - paragraph [ref=e5852]: The extended topological field theory classification is claimed and not proved, so no conclusion of this volume may rest on it. The four-dimensional constructive claims are registered at their rungs and are not used as premises. The Clay mass gap problem is open and is recorded as open.
          - paragraph [ref=e5853]: "The computational experiments are evidence. They reproduce known classification tables and test obstruction conditions on small examples, and they do not establish any theorem. The phrase used elsewhere in the series applies here as well: executable models validated against specifications, never machine-checked proofs."
          - paragraph [ref=e5854]: "A further limitation is inherited from the series. The choice of physical equivalence is not settled, so every classification statement here is classification up to an explicitly named equivalence: isomorphism of principal bundles, isomorphism of Lie algebras, equivalence of categories preserving the symmetric monoidal structure, or unitary equivalence of representations. Statements that would require a stronger or weaker equivalence are marked by the structure they preserve. The EtingofGelaki constraint is the standing warning: an equivalence that forgets the symmetric monoidal layer cannot recover the group, so no classification record in this volume identifies systems by an equivalence without naming the layers it keeps."
          - heading "Conclusion" [level=2] [ref=e5855]
          - paragraph [ref=e5856]:
            - text: Rigorous classification of gauge and quantum field theories succeeds where topological or algebraic data decouple from continuum dynamics. The KillingCartan root diagrams parameterize complex semisimple Lie algebras. Dominant integral weights classify the finite-dimensional irreducible representations. Homotopy classes
