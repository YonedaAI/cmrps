          - paragraph [ref=e5413]:
            - text: Reconstruction and classification answer different questions. A classification theorem names an invariant whose value determines the object up to a stated equivalence, and its output is a parameter space. A reconstruction theorem recovers the object from a class of probes, and its output is a functor that rebuilds the object. Theorem
            - link "32" [ref=e5414] [cursor=pointer]:
              - /url: "#thm:gelfand"
            - text: rebuilds an algebra from its commutative probes, Theorem
            - link "29" [ref=e5415] [cursor=pointer]:
              - /url: "#thm:dr"
            - text: rebuilds a gauge group from its representation-category probes, and Theorem
            - link "11" [ref=e5416] [cursor=pointer]:
              - /url: "#thm:bundles"
            - text: classifies bundles by homotopy-class data without rebuilding them. The gauge group recovered by DoplicherRoberts is the global form data of Example
            - link "15" [ref=e5417] [cursor=pointer]:
              - /url: "#ex:global-form"
            - text: ", which the local algebra of observables cannot see; the reconstruction is therefore genuinely recovering structure rather than reparameterizing it."
          - paragraph [ref=e5418]: "The pattern matters for the series program because reconstruction is better developed than classification in several domains. Where a classification is open, a reconstruction result may still recover the object from probes, and where a reconstruction exists, the recovered data becomes a candidate classifying invariant. We record both kinds of result for the gauge and topological domains and mark the boundary between them: bundles are classified, gauge groups are reconstructed from sectors, and the analytic moduli spaces of connections are neither."
