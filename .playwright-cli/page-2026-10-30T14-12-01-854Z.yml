          - paragraph [ref=e633]:
            - text: We say a classification statement is
            - emphasis [ref=e634]: complete
            - text: for a domain when an invariant is named, the classification theorem is proved, and the theorem’s hypotheses are stated in full. We say it is
            - emphasis [ref=e635]: complete as an obstruction
            - text: when the classification content is itself the vanishing of obstruction classes. We reserve
            - emphasis [ref=e636]: claimed
            - text: for statements supported by an announcement, a manuscript, or a proof sketch without a complete proof on the public record, and
            - emphasis [ref=e637]: open
            - text: for problems with no resolution on the record. These labels are used in prose only in their ordinary mathematical sense; the formal claim ledger records the status of each statement.
