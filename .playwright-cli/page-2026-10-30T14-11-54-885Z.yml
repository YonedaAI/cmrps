          - heading "Limitations and open questions" [level=2] [ref=e16555]
          - paragraph [ref=e16556]: The classification results above hold exactly in the regimes of the established mathematics they rest on.
          - paragraph [ref=e16557]: "Global classification of closed symplectic manifolds is open. The invariants of Section 5 classify in restricted regimes: surfaces by area and genus, toric manifolds by Delzant polytopes, homogeneous manifolds by weight data. Beyond these regimes the diffeomorphism classification of the underlying manifold is itself incomplete in dimension four and above, and the symplectic classification contains it. No claim of the paper addresses that gap."
          - paragraph [ref=e16558]: The classification of Poisson structures beyond local models is open. The Weinstein splitting theorem classifies the local type at each point, and the leaf foliation organizes the global object, but the topology of leaf spaces, the structure of singular leaves, and the classification of Poisson manifolds with prescribed leaf space are not addressed by the local theory. This paper makes no claim about them.
          - paragraph [ref=e16559]:
            - text: Decomposition uniqueness is open in general.
            - link "32" [ref=e16560] [cursor=pointer]:
              - /url: "#prop:monodromy"
            - text: "exhibits the obstruction inside one of the best behaved subclasses: action-angle monodromy prevents global decomposition of integrable systems whose local decomposition is complete. Characterizing the subclasses with unique decomposition is a genuine gap in the classical theory."
          - paragraph [ref=e16561]:
            - text: "The bridge between classical and quantum families is conjectural. Deformation quantization associates to a Poisson manifold a family of noncommutative algebras, and it is one of the candidate constructions connecting the symplectic family to the operator-algebra family. No equivalence theorem connects the two families, and the paper treats the connection as a programmatic conjecture: every statement crossing the classical and quantum boundary is conditional on that conjecture and is marked as such. The Petz-Sudar classification of"
            - link "45" [ref=e16562] [cursor=pointer]:
              - /url: "#thm:petz-sudar"
            - text: "shows concretely that uniqueness phenomena do not transfer: the classical uniqueness of the Fisher metric has a parametric quantum shadow."
          - paragraph [ref=e16563]:
            - text: The equivalence relation of the series is not fixed here. This paper classifies under mathematical equivalence of
            - link "5" [ref=e16564] [cursor=pointer]:
              - /url: "#def:morphisms"
            - text: ", which preserves the symplectic form, the Poisson bracket, or the statistical structure exactly. Physical equivalence for classical systems must be coarser, and identifying two classical systems as physically equivalent requires naming the preserved layers and the observational content. The paper does neither, and the classification statements above are statements about mathematical objects."
          - paragraph [ref=e16565]: The computational experiments of Section 10 demonstrate that the normal forms are computable on examples; no claim of the paper depends on them.
          - paragraph [ref=e16566]: The open questions the classical sector poses to the series are the following.
          - list [ref=e16567]:
            - listitem [ref=e16568]:
              - paragraph [ref=e16569]:
                - text: Which global invariants beyond
                - generic [ref=e16571]:
                  - math [ref=e16573]:
                    - generic [ref=e16575]:
                      - generic [ref=e16576]: "["
                      - generic [ref=e16577]: ω
                      - generic [ref=e16578]: "]"
                  - generic [ref=e16580]: "[ω]"
                - text: ", the characteristic classes, and the capacities complete the classification of closed symplectic manifolds in dimension four? The inventory of Section 5 is partial in that regime and complete nowhere else."
            - listitem [ref=e16581]:
              - paragraph [ref=e16582]:
                - text: Which subclasses of classical systems admit unique decomposition into
                - generic [ref=e16584]:
                  - math [ref=e16586]:
                    - generic [ref=e16587]: C
                  - generic [ref=e16591]: C
                - text: "-irreducible factors? The integrable subclass admits local decomposition and fails global decomposition by monodromy, and the boundary between the two behaviors is not characterized."
            - listitem [ref=e16592]:
              - paragraph [ref=e16593]: What is the classification of Poisson structures with prescribed leaf space? The Weinstein splitting theorem classifies the local type and leaves the global organization of singular leaves open.
            - listitem [ref=e16594]:
              - paragraph [ref=e16595]: Does deformation quantization connect the symplectic family to the operator-algebra family in any sense stronger than a programmatic correspondence? Every statement of this paper that crosses that boundary is conditional on the conjecture.
            - listitem [ref=e16596]:
              - paragraph [ref=e16597]: Which coarsenings of mathematical equivalence are the physically correct equivalences for classical systems? The answer must name the preserved layers and the observational content, and the paper fixes neither.
          - heading "Conclusion" [level=2] [ref=e16598]
          - paragraph [ref=e16599]: Classical physical systems admit classification exactly where the invariants are finite, parametric, or combinatorial, and the paper has exhibited each type of success in this domain. Local symplectic classification is complete and trivial (Darboux), and the classification content is global. Local Poisson classification is a rank stratification with a transverse factor (Weinstein). Homogeneous symplectic classification is the Dynkin and highest-weight theory of Lie algebras (coadjoint orbits). Global classification succeeds for toric manifolds (Delzant polytopes) and for surfaces (genus and area). The classical statistical family carries a unique monotone metric up to scale (Chentsov), and the quantum analogue is parametric rather than unique (Petz-Sudar).
          - paragraph [ref=e16600]: "The negative results are theorems of the same standing. There are no local symplectic invariants. Global action-angle coordinates fail by monodromy. Classical uniqueness phenomena do not extend to the quantum family. These are content, not caveats: they delimit the regimes in which classification theorems can be expected, and they block the false transfers that analogy would suggest."
          - paragraph [ref=e16601]:
            - text: The classification inventory of
            - link "3" [ref=e16602] [cursor=pointer]:
              - /url: "#tab:inventory"
            - text: is complete for the regimes it names and silent elsewhere, and the next classical results will come either from widening a regime (which subclasses of integrable systems decompose uniquely) or from deepening an obstruction (what exactly monodromy forbids beyond global action-angle coordinates). The evidence supports restricted classification theorems plus explicit obstructions in the classical domain. It does not support a universal periodic table of classical systems, and the paper does not claim one.
