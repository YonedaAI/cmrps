            - text: "(Morphisms and equivalence in force). Between symplectic systems the admissible exact morphisms are symplectomorphisms and, between Poisson systems, Poisson maps (smooth maps pulling Poisson brackets back). Between classical statistical systems the admissible coarse-grainings are stochastic maps. Mathematical equivalence of classical systems is isomorphism in the ambient category fixed here: symplectomorphism, Poisson isomorphism, or diffeomorphism of statistical models carrying the model map. Every such identification preserves the symplectic form or the Poisson bracket or the probability structure, and the paper names the preserved layer whenever an identification is claimed."
