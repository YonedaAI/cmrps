          - code [ref=e16469]: "def moser_field(x, t): # solve omega_t(x) X = alpha(x), the matrix form of # iota_X omega_t = -alpha with M skew-symmetric M = omega_t(x, t) a = EPS * alpha(x) return np.linalg.solve(M, a) def test_chart_pullback(n_samples=12, h=1e-20): worst = 0.0 for _ in range(n_samples): x0 = rng.normal(scale=0.3, size=DIM) x1 = flow_time1(x0) J = np.zeros((DIM, DIM)) for k in range(DIM): e = np.zeros(DIM, dtype=complex) e[k] = 1j * h J[:, k] = np.imag(flow_time1(x0.astype(complex) + e)) / h resid = J.T @ omega(x1) @ J - omega_0(x0) worst = max(worst, np.max(np.abs(resid))) return worst"
