          - generic [ref=e24]:
            - heading "Abstract" [level=2] [ref=e25]
            - text: "This paper classifies restricted classes of classical physical systems: symplectic and Poisson systems and classical statistical systems. The central structural fact is an inversion of the Riemannian situation. Darboux’s theorem removes every local symplectic invariant, so the classification content of Hamiltonian mechanics is global and topological. On the Poisson side, Weinstein’s splitting theorem replaces local rigidity by a rank stratification into symplectic leaves and transverse data, and coadjoint orbits tie the homogeneous case to the Dynkin classification of simple Lie algebras and the highest-weight classification of their finite-dimensional representations. On the statistical side, Chentsov’s theorem singles out the Fisher metric as the unique metric monotone under stochastic maps, while the quantum analogue is parametric rather than unique. The results include one complete local classification theorem, one rank normal form, one uniqueness theorem, and two restricted global classification theorems, each stated with hypotheses and proof or proof reference. The limitation that matters most is scope: no global classification theorem for closed symplectic manifolds is claimed or available, decomposition uniqueness is open outside restricted subclasses, and the deformation-quantization bridge to quantum theory remains conjectural. Computational experiments exhibit the local normal forms and supply executable models; they are evidence, not proofs."
          - heading "Introduction" [level=2] [ref=e26]
          - paragraph [ref=e27]: "Classical physical systems carry their state, observables, dynamics, symmetries, and composition rules on smooth manifolds and probability simplices, and the relevant mathematical structures are fully developed: symplectic manifolds, Poisson manifolds, probability simplices. A classification of these structures is a question about what the surviving invariants are."
          - paragraph [ref=e28]: "The answer is shaped by a single theorem. Darboux’s theorem states that all symplectic manifolds of a fixed dimension are locally indistinguishable: near every point, a symplectic manifold looks exactly like a standard linear space with a standard two-form. Riemannian geometry classifies locally through curvature, an invariant with content at every point. Symplectic geometry has no local invariants at all. Whatever classification content Hamiltonian mechanics possesses lives in the large, in topology and global geometry. This inversion, recorded as a structural lesson of the research program, organizes the entire paper."
          - paragraph [ref=e29]: "Three bodies of established mathematics carry the classification effort. The local theory of Poisson manifolds contributes the rank stratification: Weinstein’s splitting theorem decomposes a neighborhood of a point into a symplectic factor and a transverse Poisson factor, so Poisson geometry replaces the missing local invariants of the symplectic case by a rank stratification and a foliation into symplectic leaves. The theory of coadjoint orbits contributes the homogeneous case. Coadjoint orbits of a Lie group carry a canonical symplectic form, the Kirillov-Kostant-Souriau form, and for compact semisimple groups the orbits form flag manifolds parameterized by the positive Weyl chamber, with dominant integral weights selecting the integral orbits. The Killing-Cartan classification of simple Lie algebras and the highest-weight classification of their representations therefore enter classical mechanics as the classification of homogeneous symplectic manifolds. Information geometry on the classical side contributes the uniqueness theorem: Chentsov’s theorem singles out the Fisher metric, up to a constant, as the unique Riemannian metric monotone under stochastic maps. Classical statistical systems thus possess a uniqueness theorem that their quantum analogues provably lack."
          - paragraph [ref=e30]: No global classification theorem for closed symplectic manifolds is known or claimed. Decomposition of classical systems into irreducible factors is unique only in restricted subclasses, and action-angle monodromy is an explicit obstruction to global decomposition in one of those subclasses. The deformation-quantization bridge between classical and quantum families is a programmatic conjecture, and the paper treats it as conditional throughout. Every theorem below is stated with its hypotheses; every computational claim is marked as evidence rather than proof.
          - paragraph [ref=e31]: "Mathematical equivalence for these systems is structure-preserving isomorphism: symplectomorphisms preserve symplectic forms, Poisson isomorphisms preserve brackets, and reparameterizations preserve probability structure. Physical equivalence is a coarser relation that this paper does not define, and every classification theorem below applies to mathematical structures under these isomorphisms."
          - heading "Mathematical framework" [level=2] [ref=e32]
          - paragraph [ref=e33]: "A classical system in this paper is an instance of the five-component schema of the series: a tuple of state space, observables, dynamics, symmetries, and composition rules, with each component specialized to smooth-geometric or measure-theoretic data."
