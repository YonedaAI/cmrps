          - paragraph [ref=e78]: This paper develops the empirical side of that quotient. Observational equivalence identifies two systems exactly when no admissible observation separates them. The formal object is the observation functor named by the Information Geometry Correspondence program of the YonedaAI research summary; that program names the object without defining it, so the definition, its basic properties, and its limits are established here.
          - paragraph [ref=e79]: Observation functors are ordinary functors from a category of systems to a category of observation records. The indistinguishability relation they induce is an equivalence relation whose classes are the record isomorphism classes of the functor.
          - paragraph [ref=e80]:
            - text: "Coarsening the observations identifies at least as many systems as the fine observations identify, and the inclusion of relations can be strict. The quantitative side of distinguishability splits along the classical and quantum divide: the Fisher metric is unique up to constant among metrics monotone under stochastic maps"
