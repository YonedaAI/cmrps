            - text: .
          - paragraph [ref=e4761]:
            - text: "Whether the two patterns connect into one principle is open. The series records the question explicitly: whether the categorical-supermap line unifies with the Gelfand, Stone, and Naimark pattern into a single account of objects determined by their relationships is not established, and this paper does not close it. The relevance to observation functors is a hypothesis rather than a result. If representability of higher-order operations extends from supermaps to observation records in general, then records could be defined as representable objects and the functorial account of"
            - link "4" [ref=e4762] [cursor=pointer]:
              - /url: "#sec:functors"
            - text: would be derived rather than stipulated. The hypothesis needs a channel-state-duality statement for the systems in question, and no such statement is on record for general system classes.
          - paragraph [ref=e4763]:
            - text: "What can be used now is narrower. The reconstruction pattern fixes the shape of a legitimate claim about observation: an object recovered from named probes under named hypotheses is a theorem of reconstruction, not a classification and not an empirical adequacy claim. The series qualification applies to both patterns verbatim: “Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem.”"
            - link "4" [ref=e4764] [cursor=pointer]:
              - /url: "#sec:functors"
            - text: defines observation functors as additional structure, and this section records the standing option of deriving them instead. The option is reasonable and unresolved.
