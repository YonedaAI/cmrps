            - text: The third script computes character tables of the dihedral group of order 8 and the quaternion group of order 8 from their multiplication tables, by brute-force enumeration of conjugacy classes, one-dimensional characters from the abelianization, and completion of the table by orthogonality against the regular character. The two groups are not isomorphic (their element orders differ), and their character tables coincide as tables of numbers. The computation illustrates the failure of coarse representation data to separate groups. It is not the counterexample of
            - link "8" [ref=e8681] [cursor=pointer]:
              - /url: "#thm:eg"
            - text: ": that counterexample lives at the level of monoidal categories and their symmetric structure, and the script does not construct it."
          - paragraph [ref=e8682]:
            - text: The Haskell module
            - code [ref=e8683]: Instances.hs
            - text: "in the same directory declares instances of the shared family classes of the series taxonomy for the systems this paper uses: observation functors over classical and quantum records, the equivalence classes of"
            - link "12" [ref=e8684] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: ", and the witness type that records preserved layers in the sense of"
            - link "9" [ref=e8685] [cursor=pointer]:
              - /url: "#cor:preserved"
            - text: . The module is an executable model of the definitions; it proves nothing and is not verified by any proof assistant.
