            - text: ": a coarse record is computed from a fine one, so it cannot separate what the fine record identifies."
          - paragraph [ref=e4698]:
            - text: A further candidate deserves recording because it is tempting. One might define physical equivalence by equality of all observation records of a fixed maximal family of experiments, in the spirit of operational theories. This criterion is well defined once the family of experiments is fixed, and
            - link "12" [ref=e4699] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: "applies to it directly. The difficulty is that “maximal family” is itself a choice: fix a strictly larger family and the relation becomes finer. No argument in the series selects a canonical family for general systems, so the criterion restates the choice of"
            - generic [ref=e4701]:
              - math [ref=e4703]:
                - generic [ref=e4704]: ≃
              - generic [ref=e4708]: ≃
            - text: rather than resolving it.
          - heading "A search protocol" [level=3] [ref=e4709]
          - paragraph [ref=e4710]: The counterexample search above is repeatable for any future criterion. A candidate relation on system records comes with the morphism kind realizing its identifications, and the protocol screens it in three passes.
          - paragraph [ref=e4711]:
            - text: The screening pass reads the preserved layers off the morphism kind and checks them against
            - link "2" [ref=e4712] [cursor=pointer]:
              - /url: "#tab:layers"
            - text: ; a witness naming the monoidal layer without symmetry fails on the strength of
            - link "8" [ref=e4713] [cursor=pointer]:
              - /url: "#thm:eg"
            - text: "immediately. The testing pass runs the candidate on four cases: a finite classical pair separated only by a second experiment, a qubit pair of monotone metrics disagreeing off the commutative slice, two non-isomorphic groups of order 8 with equal character tables, and a product of observations that separates what its factors hide. A criterion that misidentifies any case is false, and a criterion that passes all four is untested."
          - paragraph [ref=e4714]:
            - text: The band pass compares the candidate with
            - link "5" [ref=e4715] [cursor=pointer]:
              - /url: "#def:band"
            - text: ": the candidate must be at least as coarse as isomorphism and no coarser than admissible observation."
          - paragraph [ref=e4716]:
            - text: "A criterion that survives all three steps is not thereby correct. It is admissible so far, and the record of the search is part of the argument: which examples were run, which layers were named, which failure modes were ruled out. The series records no positive criterion for physical equivalence; the outcomes of"
            - link "3" [ref=e4717] [cursor=pointer]:
              - /url: "#tab:criteria"
            - text: are the first run of the protocol.
          - heading "Reconstruction patterns and representability" [level=2] [ref=e4718]
          - paragraph [ref=e4719]: Observation functors are stipulated here rather than derived, because the two proved reconstruction patterns do not yet connect across general system classes.
