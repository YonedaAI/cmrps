          - paragraph [ref=e4870]:
            - text: Related work supplies a representability result in an adjacent direction. Categorical supermaps on a physical theory are concretely representable through channel-state duality whenever the theory has such a duality
            - link "[5]" [ref=e4871] [cursor=pointer]:
              - /url: "#bib-b5"
            - text: ","
            - link "[9]" [ref=e4872] [cursor=pointer]:
              - /url: "#bib-b9"
            - text: . That line shows observational structure of the higher-order kind is representable in the stated settings. It does not define observation records for general systems.
          - paragraph [ref=e4873]:
            - text: What the layer is mathematically remains open in the series, and the open items are specific. The composition of observation with coarsened observations is settled by functoriality (
            - link "15" [ref=e4874] [cursor=pointer]:
              - /url: "#prop:coarse"
            - text: ); the composition of empirical indistinguishability in interacting regimes is conditional (
            - link "16" [ref=e4875] [cursor=pointer]:
              - /url: "#prop:composed"
            - text: ). The codomain
            - generic [ref=e4877]:
              - math [ref=e4879]:
                - generic [ref=e4881]:
                  - generic [ref=e4882]: O
                  - generic [ref=e4883]: b
                  - generic [ref=e4884]: s
              - generic [ref=e4886]: Obs
            - text: is proposed as a category of records here; the architecture allows observational constraints or predictions, and whether records are the right objects is a modeling choice the program has not fixed. The correct relation
            - generic [ref=e4889]:
              - math [ref=e4891]:
                - generic [ref=e4892]: ≃
              - generic [ref=e4896]: ≃
            - text: "is the central open problem of the whole series, and the results of this paper constrain it from three sides: it must be no finer than observation ("
            - link "12" [ref=e4897] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: ), it must name its preserved layers (
            - link "9" [ref=e4898] [cursor=pointer]:
              - /url: "#cor:preserved"
            - text: ), and it must not rest on an unnamed monotone metric (
            - link "21" [ref=e4899] [cursor=pointer]:
              - /url: "#cor:noncanonical"
            - text: ).
          - heading "Contents of the record category" [level=3] [ref=e4900]
          - paragraph [ref=e4901]:
            - link "11" [ref=e4902] [cursor=pointer]:
              - /url: "#def:obs"
            - text: names the record category without fixing its objects beyond outcome data. The results of this paper force specific contents of that category, and each forced content names an open condition.
          - paragraph [ref=e4903]:
            - text: Experiments and outcomes are forced by
            - link "12" [ref=e4904] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: ": a record that carries no outcome data induces the universal relation, and every system is indistinguishable from every other. Outcome labels are fixed by calibration of a given experiment: isomorphism of records compares the outcome distributions of the same experiment on the same label set, and a relabeling of outcomes is an isomorphism of experiment presentations rather than of records of one calibrated experiment. Comparison morphisms between records are forced by"
            - link "15" [ref=e4905] [cursor=pointer]:
              - /url: "#prop:coarse"
            - text: ": coarsening is a functor on records, so the record category must contain the morphisms that forgetting induces. Limits of records are forced only when limiting procedures are in force, and"
            - link "2.4" [ref=e4906] [cursor=pointer]:
              - /url: "#sec:morphisms"
            - text: records that case as the least settled.
          - paragraph [ref=e4907]:
            - text: What remains open is the treatment of interaction. The record of a composite system is not determined by the records of the factors unless the record category carries a monoidal structure mirroring the composition rules
            - generic [ref=e4909]:
              - math [ref=e4911]:
                - generic [ref=e4912]: C
              - generic [ref=e4916]: C
            - text: of the object schema, and
            - link "16" [ref=e4917] [cursor=pointer]:
              - /url: "#prop:composed"
            - text: shows both what holds under a product hypothesis and what can fail without it. The series leaves this open, and the record category proposed here inherits the open status.
          - heading "Empirical selection as a quotient" [level=3] [ref=e4918]
          - paragraph [ref=e4919]:
            - text: "Instantiated as an observation functor, the empirical layer computes a quotient: two theories land in the same class exactly when their records are isomorphic, which is the relation of"
            - link "12" [ref=e4920] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: ". This is the part of empirical selection that observation performs, and its limits are the limits of the records. A class of the quotient contains every theory compatible with the recorded outcomes, and the founding document anticipates exactly this situation: several mathematically distinct theories may produce identical predictions inside an experimentally accessible regime (section 7)."
          - paragraph [ref=e4921]:
            - text: Selection among the members of one class is not an observation problem in the sense of
            - link "11" [ref=e4922] [cursor=pointer]:
              - /url: "#def:obs"
            - text: ". It requires data the records do not carry: the internal structure of the theories, the behavior outside the accessible regime, or criteria of a different kind entirely. The three-layer architecture keeps this separation explicit: the empirical layer maps theories to observational constraints and predictions, and it is not a claim that every model maps to a single observational object. The quotient of"
            - link "12" [ref=e4923] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: is the observational part of that map, nothing more.
          - heading "Worked examples" [level=2] [ref=e4924]
          - paragraph [ref=e4925]:
            - text: The constructions of
            - link "Section Observation functors, Section Information-geometric distinguishability" [ref=e4926] [cursor=pointer]:
              - /url: "#sec:functors,sec:metrics"
            - text: run on explicit data. The explicit data cover a finite classical observation functor with its quotient classes, the qubit computation of
            - link "20" [ref=e4927] [cursor=pointer]:
              - /url: "#ex:monotone"
            - text: in full generality, groups of order 8 whose character tables agree, and a product of observations.
