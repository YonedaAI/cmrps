          - paragraph [ref=e4630]:
            - text: Operational distinguishability defined by admissible experiments is the third position and the only one that produces equivalence relations through
            - link "12" [ref=e4631] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: ". It is also the least formalized: the admissible experiments of a general system class are not fixed. The position adopted here is the third as the construction of"
            - link "4" [ref=e4632] [cursor=pointer]:
              - /url: "#sec:functors"
            - text: ", with metrics as derived data computed on records rather than as the definition of distinguishability. Metric thresholds remain legitimate as measures of nearness between records; they do not classify."
          - paragraph [ref=e4633]:
            - text: "The parametricity result also fixes what a classifying invariant can be. A classifying invariant is a value that determines an object up to the chosen equivalence, computed from the object and nothing else. The Fisher metric has that status in the classical case: it is a function of the probability model alone, unique up to constant ("
            - link "17" [ref=e4634] [cursor=pointer]:
              - /url: "#thm:chentsov"
            - text: ). No quantum monotone metric has that status, because the value of the distance depends on the chosen function
            - generic [ref=e4636]:
