            - text: "-algebra of its continuous functions are distinct objects of their categories, isomorphic to no common record, yet Gelfand duality identifies them as presentations of one object"
            - link "[3]" [ref=e4693] [cursor=pointer]:
              - /url: "#bib-b3"
            - text: . A pair of system records inside one formal framework, proved non-isomorphic and declared physically equivalent, would close the row at the system level; the search did not produce one.
          - paragraph [ref=e4694]:
            - text: The second row is different in kind.
            - link "8" [ref=e4695] [cursor=pointer]:
              - /url: "#thm:eg"
            - text: "is a proved counterexample, and it falsifies the criterion. The third row is computational and analytic:"
            - link "20" [ref=e4696] [cursor=pointer]:
              - /url: "#ex:monotone"
            - text: is verifiable by direct computation and is reproduced by the script named in the code appendix. The fourth row is the monotonicity of
            - link "15" [ref=e4697] [cursor=pointer]:
