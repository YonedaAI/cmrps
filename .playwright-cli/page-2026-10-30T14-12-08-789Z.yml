            - link "[4]" [ref=e4757] [cursor=pointer]:
              - /url: "#bib-b4"
            - text: ". Each theorem is a precise statement with named hypotheses: an object is determined by how probes see it. The modern pattern represents higher-order operations. Categorical supermaps on a theory are concretely representable through channel-state duality whenever the theory has such a duality"
            - link "[5]" [ref=e4758] [cursor=pointer]:
              - /url: "#bib-b5"
            - text: ","
            - link "[9]" [ref=e4759] [cursor=pointer]:
              - /url: "#bib-b9"
            - text: ", and the factorization theorems for supermaps rest on the Yoneda lemma and on representability"
            - link "[5]" [ref=e4760] [cursor=pointer]:
