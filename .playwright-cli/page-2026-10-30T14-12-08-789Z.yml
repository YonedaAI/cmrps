          - heading "Constraints on the classification quotient" [level=2] [ref=e8752]
          - paragraph [ref=e8753]:
            - text: The classification problem is the quotient of admissible systems by
            - generic [ref=e8755]:
              - math [ref=e8757]:
                - generic [ref=e8758]: ≃
              - generic [ref=e8762]: ≃
            - text: . The results of this paper do not determine
            - generic [ref=e8764]:
              - math [ref=e8766]:
                - generic [ref=e8767]: ≃
              - generic [ref=e8771]: ≃
            - text: ", and"
            - link "5" [ref=e8772] [cursor=pointer]:
              - /url: "#def:band"
            - text: bounds where it can sit.
          - paragraph [ref=e8773]:
            - link "5" [ref=e8774] [cursor=pointer]:
              - /url: "#def:band"
            - text: is a constraint, not a construction, and both of its failure modes are live. A relation too close to
            - generic [ref=e8776]:
              - math [ref=e8778]:
                - generic [ref=e8779]: ≅
              - generic [ref=e8783]: ≅
            - text: cannot identify dual presentations, and the founding document records such presentations as the reason
            - generic [ref=e8785]:
              - math [ref=e8787]:
                - generic [ref=e8788]: ≃
              - generic [ref=e8792]: ≃
            - text: is a choice at all. A family
            - generic [ref=e8794]:
              - math [ref=e8796]:
                - generic [ref=e8797]: A
              - generic [ref=e8801]: A
            - text: "that is too small over-identifies: the fewer observation functors are admitted, the larger the intersection, and a system class with one weak experiment identifies systems no working physicist would call the same. Enlarging"
            - generic [ref=e8803]:
              - math [ref=e8805]:
                - generic [ref=e8806]: A
              - generic [ref=e8810]: A
            - text: shrinks the intersection toward
            - generic [ref=e8812]:
              - math [ref=e8814]:
                - generic [ref=e8815]: ≅
              - generic [ref=e8819]: ≅
            - text: (
            - link "13" [ref=e8820] [cursor=pointer]:
              - /url: "#lem:products"
            - text: is the mechanism), so an oversized family can empty the band for the dual presentations that
            - generic [ref=e8822]:
              - math [ref=e8824]:
                - generic [ref=e8825]: ≃
              - generic [ref=e8829]: ≃
            - text: is supposed to identify. The band is usable only for families of observations that match the physics in question.
          - paragraph [ref=e8830]:
            - text: The counterexample search of
            - link "6" [ref=e8831] [cursor=pointer]:
              - /url: "#sec:search"
            - text: "adds a third constraint: a candidate that realizes its identifications by plain tensor equivalence violates"
            - link "8" [ref=e8832] [cursor=pointer]:
              - /url: "#thm:eg"
            - text: wherever the group data are observable, and a candidate that reads numerical distances from an unnamed monotone metric is not well defined in the quantum case (
            - link "21" [ref=e8833] [cursor=pointer]:
              - /url: "#cor:noncanonical"
            - text: ).
          - paragraph [ref=e8834]:
            - text: The preserved-layer discipline is the one constructive tool the paper offers. A candidate
            - generic [ref=e8836]:
              - math [ref=e8838]:
                - generic [ref=e8839]: ≃
              - generic [ref=e8843]: ≃
            - text: becomes checkable when its proponents file an equivalence witness (
            - link "6" [ref=e8844] [cursor=pointer]:
              - /url: "#def:witness"
            - text: ") for each identification: the notion in force, the morphism kind, the preserved layers. Isocategorical groups then serve as the standing test: a witness whose preserved layers omit the symmetric monoidal structure and whose systems carry different observable group data must be rejected before further analysis. The series records no positive reconstruction criterion for “the same physical system”; the search for one is open, and the constraints above are the admissibility conditions any such criterion must meet."
          - paragraph [ref=e8845]:
            - text: The relation to the three-layer architecture is immediate. The band of
            - link "5" [ref=e8846] [cursor=pointer]:
              - /url: "#def:band"
            - text: "sits at the empirical layer: the first inclusion is mathematical, the second is empirical, and neither follows from the other. A complete classification of the mathematical representations (layer one) would leave the second inclusion unproved, and a proof of the second inclusion would leave the quotient of layer one uncomputed."
          - heading "What would settle the choice" [level=3] [ref=e8847]
          - paragraph [ref=e8848]:
            - text: The choice of
            - generic [ref=e8850]:
              - math [ref=e8852]:
                - generic [ref=e8853]: ≃
              - generic [ref=e8857]: ≃
            - text: "moves from open to fixed only through concrete tasks, each stated so that it can fail. The first task is to fix the record category for a named class of systems: the admissible experiments, the isomorphisms of records, and the composition of records under interaction. Success means a construction to which"
            - link "12" [ref=e8858] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: applies outside the toy model of
            - link "9" [ref=e8859] [cursor=pointer]:
              - /url: "#sec:examples"
            - text: ; failure means the class admits no well-formed observation functor. The second task is to determine whether bounded experimental indistinguishability composes in an interacting regime, the question
            - link "4" [ref=e8860] [cursor=pointer]:
              - /url: "#sec:functors"
            - text: leaves open through
            - link "16" [ref=e8861] [cursor=pointer]:
              - /url: "#prop:composed"
            - text: . Success means a theorem connecting the functorial relation of
            - link "4" [ref=e8862] [cursor=pointer]:
              - /url: "#sec:functors"
            - text: with an operational relation between records; failure means a counterexample in which two systems are indistinguishable by every individual experiment and distinguishable by a joint one. The third task is to state a positive criterion for physical equivalence and run it through the protocol of
            - link "6.1" [ref=e8863] [cursor=pointer]:
              - /url: "#sec:protocol"
            - text: . Success means a criterion that survives the protocol and is argued for at the empirical layer; failure means another row of
            - link "3" [ref=e8864] [cursor=pointer]:
              - /url: "#tab:criteria"
            - text: closes negatively, which is itself a result the program accepts.
          - paragraph [ref=e8865]: "Until the three tasks are run, the constraints of this section are the result: a band the correct relation must lie in, a discipline for declaring what identifications preserve, and a standing counterexample to the most natural criterion of all."
          - heading "Limitations" [level=2] [ref=e8866]
          - paragraph [ref=e8867]:
            - text: The observations of this paper are proposals constrained by proved results; they are not a completed formalization of the empirical layer. The domain and codomain of
            - link "11" [ref=e8868] [cursor=pointer]:
              - /url: "#def:obs"
            - text: "fix the shape of an observation functor, and the sources do not fix the contents: which experiments are admissible for a given system, how outcome families compose under interaction, and what structure the record category must carry are open. Until they are fixed,"
            - link "12" [ref=e8869] [cursor=pointer]:
              - /url: "#prop:equivrel"
            - text: is a statement about a proposed construction, not about physics.
          - paragraph [ref=e8870]:
            - text: The counterexample search found one proved falsification (
            - link "8" [ref=e8871] [cursor=pointer]:
              - /url: "#thm:eg"
            - text: ) and one computed failure of canonicity (
            - link "20" [ref=e8872] [cursor=pointer]:
              - /url: "#ex:monotone"
            - text: ); it did not produce a concrete non-isomorphic pair of system records to close the dual-presentation row of
            - link "3" [ref=e8873] [cursor=pointer]:
              - /url: "#tab:criteria"
            - text: at the system level. The search is bounded by the sources reviewed (cutoff 2026-10-29), and the absence of such a pair in this paper is not evidence that the literature lacks one.
          - paragraph [ref=e8874]:
            - text: The metric results carry their own boundary.
            - link "Theorem 17, Theorem 18" [ref=e8875] [cursor=pointer]:
              - /url: "#thm:chentsov,thm:petzsudar"
            - text: "are used as established mathematics with their hypotheses intact: monotone under stochastic maps in the classical case, operator monotone functions normalized at"
            - generic [ref=e8877]:
              - math [ref=e8879]:
                - generic [ref=e8880]: "1"
              - generic [ref=e8884]: "1"
            - text: and self-reciprocal in the quantum case. Nothing here extends classical uniqueness to the quantum case, and
            - link "21" [ref=e8885] [cursor=pointer]:
              - /url: "#cor:noncanonical"
            - text: is the reason not to. The explicit computation is two-dimensional; the disagreement of the metrics is general (
            - link "18" [ref=e8886] [cursor=pointer]:
              - /url: "#thm:petzsudar"
            - text: ) but only the two-dimensional instance is exhibited here.
          - paragraph [ref=e8887]:
            - text: The observational equivalence defined here is functorial indistinguishability. Bounded experimental indistinguishability in interacting regimes is not shown to coincide with it (
            - link "16" [ref=e8888] [cursor=pointer]:
              - /url: "#prop:composed"
            - text: ), and the empirical layer of the three-layer architecture keeps its full open status wherever the sources keep it.
          - heading "Conclusion" [level=2] [ref=e8889]
          - paragraph [ref=e8890]: "Observational equivalence can be defined with ordinary categorical tools: an observation functor induces an equivalence relation whose classes are its record isomorphism classes, and coarsening the observations identifies at least what the fine observations identify. Distinguishability has a canonical classical ruler and no canonical quantum one: the Fisher metric is unique among monotone metrics on classical models, while quantum monotone metrics form a parametric family that agrees only on commutative data and disagrees on explicit non-commuting examples. Physical equivalence remains a choice, constrained from three sides by the results of this paper: it cannot be finer than observation, it must name the layers of structure it preserves, and it cannot rest on an unnamed metric. The most natural categorical criterion for it is false by a proved counterexample: plain tensor equivalence does not recover the group."
          - paragraph [ref=e8891]:
            - text: What follows is a research program rather than a theorem. Fix the admissible experiments of a system class, build the record category for that class, and ask whether the induced quotient is the one the classification problem needs. Until then, the quotient
