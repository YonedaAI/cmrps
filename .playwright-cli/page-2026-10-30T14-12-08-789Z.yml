                  - text: and its computational illustration
          - paragraph [ref=e4675]:
            - text: "The first row is only partially closed. The program’s founding document states that two mathematical descriptions may be physically equivalent without being mathematically isomorphic, and dual presentations are the motivating case. The table gives a mathematical illustration of dual presentations: a compact Hausdorff space and the commutative"
