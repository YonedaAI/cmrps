                - generic [ref=e4639]: f
              - generic [ref=e4643]: f
            - text: in addition to the states (
            - link "21" [ref=e4644] [cursor=pointer]:
              - /url: "#cor:noncanonical"
            - text: ). The pair (state, ruler) can carry the invariant; the state alone cannot. Any classification table that lists a quantum distinguishability distance as an invariant of the states must therefore list the ruler as part of the invariant or drop the entry.
          - heading "Counterexample search" [level=2] [ref=e4645]
          - paragraph [ref=e4646]:
            - text: The methodology of the series requires a counterexample search against each candidate criterion for physical equivalence.
            - link "3" [ref=e4647] [cursor=pointer]:
