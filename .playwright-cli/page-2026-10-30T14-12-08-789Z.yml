          - paragraph [ref=e591]: "Any equivalence used to identify systems in the classification quotient must state which layer of structure it preserves. The requirement exists because one natural criterion is false. The criterion says: identify two systems when their representation categories are equivalent as tensor categories. The criterion is natural, since compositional structure is part of the object schema; it is also insufficient."
