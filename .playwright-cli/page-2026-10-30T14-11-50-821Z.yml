            - text: "used to identify systems or factors in this paper is a *-isomorphism of observable algebras, unless another relation is named. In concrete terms for the classes at hand: two decomposed algebras are identified exactly when a bijection of their block lists matches matrix sizes blockwise and implements a *-isomorphism. Equivalences that forget algebraic structure are not used to establish classification statements, and no identification of mathematical isomorphism with physical or empirical equivalence is attempted here."
          - heading "Classification, parameterization, recognition" [level=3] [ref=e876]
          - paragraph [ref=e877]:
            - text: Three achievements are separated throughout this paper because the classification of finite simple groups separates them in practice. A classification is an exhaustive list of isomorphism types. A parameterization is a uniform finite or algebraic description of those types, in the style of Dynkin diagrams for semisimple Lie algebras. A recognition procedure is an algorithm that identifies a presented object by computing its invariants. The finite simple groups are classified, are not uniformly parameterized in the Dynkin sense
            - link "[15]" [ref=e878] [cursor=pointer]:
              - /url: "#bib-solomon"
            - text: ", and are recognized in practice by companion data of the kind recorded in group atlases: order, character table, outer automorphism group, presentations. The decomposition theorem of the next section delivers all three achievements at once for its class."
          - heading "Decomposition existence" [level=2] [ref=e879]
          - paragraph [ref=e880]: "The central positive result of this paper is the block decomposition of unital finite-dimensional complex C*-algebras. This section proves it in full, because the classification package built on it needs both halves: existence of the decomposition and uniqueness of the invariants."
