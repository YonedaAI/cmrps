          - paragraph [ref=e11154]: "The comparison makes the volume’s shape visible. The complete rows are exactly the rows with a finite or parametric invariant, and every one of them is a restricted class: semisimple finite-dimensional algebras, commutative algebras, bipartite pure states. The normal-form row is the trap this volume documents at length: a canonical description that does not classify. The last two rows are theorems, not disappointments: nonunique decomposition for interacting systems and the impossibility of finite-dimensional parameterization in wild regimes are proved statements about the boundary of decomposition programs."
          - paragraph [ref=e11155]:
            - text: "The von Neumann row deserves one sentence of its own. Decomposition into factors exists, and the pieces resist classification: uncountably many pairwise non-isomorphic separable type"
