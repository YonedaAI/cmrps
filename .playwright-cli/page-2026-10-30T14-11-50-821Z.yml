          - heading "Wildness and the parameterization boundary" [level=2] [ref=e11180]
          - paragraph [ref=e11181]: The finite-dimensional decomposition theorem classifies its objects by a finite invariant. The expectation that similar parameterizations exist beyond tame regimes is false, and the falsity is a theorem.
          - paragraph [ref=e11183]:
            - strong [ref=e11184]: Theorem 43
            - text: (Tame-wild dichotomy).
            - emphasis [ref=e11185]:
              - text: Every finite-dimensional algebra over an algebraically closed field is either derived tame or derived wild
              - link "[1]" [ref=e11186] [cursor=pointer]:
                - /url: "#bib-bekkert-drozd"
              - text: . Derived wildness is preserved under degeneration, and derived tameness is preserved under deformation.
          - paragraph [ref=e11188]:
            - strong [ref=e11189]: Theorem 44
            - text: (Wildness of the generic determinant).
            - emphasis [ref=e11190]:
              - text: The maximal Cohen-Macaulay module theory of the generic determinant is wild
              - link "[2]" [ref=e11191] [cursor=pointer]:
                - /url: "#bib-buchweitz-leuschke"
              - text: ": already in rank two, the isomorphism classes of modules cannot be parametrized by a finite-dimensional variety over the coefficients."
          - paragraph [ref=e11192]:
            - text: "The phrase used for this phenomenon in the literature is that the representation theory is quite wild: the wildness is not merely an absence of known invariants, it is the proven absence of finite-dimensional parameterization. The technique behind the dichotomy is the theory of matrix problems, in which representations are reduced by an algorithm to normal forms for boxes and arrows; derived tameness means the reduction terminates with a one-parameter-family description of indecomposables, and derived wildness means the reduction embeds an arbitrary matrix problem, after which no finite-dimensional parameterization can exist. A parallel obstruction in equivariant stable homotopy"
            - link "[8]" [ref=e11193] [cursor=pointer]:
              - /url: "#bib-grevstad-may"
            - text: shows that no meaningful classification of compact
