            - text: ) recovers symmetry data from decomposed sector categories. Equivalence morphisms preserve decomposition when they are *-isomorphisms of observable algebras, and only for those is the dimension vector invariant.
          - heading "Decomposition across the families" [level=2] [ref=e11109]
          - paragraph [ref=e11110]: "The block decomposition is one row of a larger chart. The table below records the established position, for each domain in which a decomposition question is live, on the three questions this paper keeps separate: existence of a decomposition, uniqueness of the decomposition, and parameterization of the pieces. The sources are the same that supply the theorems cited in the preceding sections."
