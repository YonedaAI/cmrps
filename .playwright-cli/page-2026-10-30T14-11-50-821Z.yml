            - heading "Abstract" [level=2] [ref=e25]
            - text: "Structural classification of physical systems requires a precise account of irreducibility: the objects counted as basic, the constructions that assemble systems from them, and the uniqueness, or absence of uniqueness, of the resulting decomposition. This paper develops that account within a categorical schema of physical systems whose composition data determine what irreducibility means. The central positive result is the complete decomposition theory of unital finite-dimensional complex C*-algebras: every such algebra is a finite direct sum of matrix algebras, the multiset of matrix sizes classifies it up to *-isomorphism, and unital *-homomorphisms between decomposed algebras are classified exactly by multiplicity matrices with explicit arithmetic constraints. The paper then maps the limits of this pattern. Kraus rank is an invariant of the Stinespring normal form and not an isomorphism invariant of channels. Interacting systems admit no unique decomposition outside restricted subclasses. Wild representation categories forbid finite-dimensional parameterization of their indecomposables. Reconstruction theorems recover objects from probes under stated hypotheses, and those hypotheses carry the content. Computational evidence in an executable taxonomy layer and in enumeration experiments is recorded as evidence and never as proof. The results support decomposition theorems only in restricted, tame regimes."
          - heading "Introduction" [level=2] [ref=e26]
          - paragraph [ref=e27]:
            - text: "Classification programs in mathematics succeed where three conditions hold at once: the objects are well defined, the equivalence is fixed, and a finite or parametric invariant separates the objects up to that equivalence. The classification of finite simple groups is the model case, and it is also a warning, because the classification is complete while a clean uniform parameterization of the simple groups remains out of reach"
            - link "[15]" [ref=e28] [cursor=pointer]:
              - /url: "#bib-solomon"
            - text: ". A structural classification of mathematical representations of physical systems would need all three conditions, and the third is where decomposition enters: a classification by constituents presumes that systems decompose into irreducibles, that the decomposition is unique enough to define invariants, and that the constructions assembling systems from irreducibles are understood."
