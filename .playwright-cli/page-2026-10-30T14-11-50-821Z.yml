            - text: ", the statement that every admissible system is assembled from the fundamental families by the admissible constructions. That identity is a research objective and not an assumed result. The results below are narrower and concrete: existence and uniqueness of decomposition in one tame class, and theorem-marked boundaries beyond it."
          - paragraph [ref=e170]: "Irreducibility depends strictly on the composition operation assigned to a system, and the relativity is visible in concrete examples. Under direct sum, unital finite-dimensional complex C*-algebras decompose uniquely into simple matrix blocks classified completely by their dimension vectors, and their unital *-homomorphisms correspond bijectively to integer multiplicity matrices with explicit arithmetic constraints. This decomposition theory is an isolated tame regime. The Stinespring and Kraus descriptions of completely positive maps yield normal forms rather than isomorphism classifications. Interacting systems admit no unique decomposition outside restricted subclasses. Wild representation categories forbid finite-dimensional parameterization of their indecomposables. The reconstruction pattern, in which an object is recovered from its probes, is developed and separated from classification: commutative C*-algebras are recovered from their spectra, and symmetry data from superselection categories, both under hypotheses that cannot be dropped."
          - paragraph [ref=e171]: "The technical development concerns the observable-algebra layer of the tuple: the classification theorems below classify algebras and their morphisms, and the state-space layer enters only where decomposition acts on states. Dynamics, symmetry actions, and coupling data are named in the definitions and left untreated here. Every statement about interacting systems is restricted to subclasses, and every result that leans on an unproved premise is marked conditional. A rigorous impossibility theorem is as valuable here as a classification theorem, and both kinds of content appear below."
