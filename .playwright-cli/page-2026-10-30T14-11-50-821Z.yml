                    - generic [ref=e11701]: m
              - generic [ref=e11704]:
                - generic [ref=e11705]: Phys
                - generic [ref=e11706]: adm
            - text: are unfixed, and no result here depends on either. Doplicher-Roberts reconstruction is available only under hypotheses that include symmetric structure and the DHR selection criteria; relaxing them destroys the uniqueness clause.
          - paragraph [ref=e11716]: No part of the mathematical content of this volume is machine-checked.
          - paragraph [ref=e11717]:
            - text: Two premises are unfixed, and no theorem above depends on them. The admissibility conditions defining
            - generic [ref=e11719]:
              - math [ref=e11721]:
                - generic [ref=e11724]:
                  - generic [ref=e11725]:
                    - generic [ref=e11726]: P
                    - generic [ref=e11727]: h
                    - generic [ref=e11728]: "y"
