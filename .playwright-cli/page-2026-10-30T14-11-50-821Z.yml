            - text: . A global classification of factors is therefore impossible in the stated generality, and any decomposition program that hopes to finish with a parameterized list of indecomposables must restrict its class. Existence of a decomposition and classification of its pieces are different achievements, and the second one fails here.
          - heading "Morphisms and multiplicity data" [level=2] [ref=e3802]
          - paragraph [ref=e3803]: A classification of objects is worth little if the morphisms between them are opaque. For decomposed finite-dimensional C*-algebras the morphisms admit an exact combinatorial description, and the description is a second existence-and-uniqueness theorem in a restricted setting.
