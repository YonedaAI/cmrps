                - generic [ref=e11738]: adm
            - text: do not exist yet, so every statement quantified over admissible systems is conditional. The equivalence
            - generic [ref=e11749]:
              - math [ref=e11751]:
                - generic [ref=e11752]: ≃
              - generic [ref=e11756]: ≃
            - text: for physical systems is open as well; this volume uses *-isomorphism of observable algebras and claims nothing about coarser identifications. Probe-based arguments carry a standing qualification, that Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem; no reconstruction result here is read as a classification result.
          - heading "Conclusion" [level=2] [ref=e11757]
          - paragraph [ref=e11758]: "Irreducibility is relative to the composition data of a system, and the relativity is visible in concrete examples: one algebra is irreducible for the direct sum and reducible for the tensor product. Within the tamest regime, unital finite-dimensional complex C*-algebras, the decomposition theory is complete: blocks exist, the dimension vector classifies, and unital *-homomorphisms are classified by multiplicity matrices with explicit arithmetic constraints. That package is exactly as large as advertised: it classifies observable algebras and their morphisms, not states, dynamics, or composition."
          - paragraph [ref=e11759]: "Beyond the tame regime the pattern breaks in three directions, each with a theorem behind it. Normal forms do not classify: Kraus rank is an invariant of the normal form and not an isomorphism invariant of channels. Interacting systems admit no unique decomposition outside restricted subclasses. Wild representation categories forbid finite-dimensional parameterization of their indecomposables. A program that assembles systems from fundamental families by admissible constructions must therefore state its regime, and the regime that admits existence-and-uniqueness theorems is restricted, tame, and finite."
          - paragraph [ref=e11760]: "Reconstruction from probes generalizes better than classification by invariants: commutative C*-algebras are recovered from their spectra, and symmetry data are recovered from superselection categories under hypotheses that cannot be dropped. Whether the probe pattern can be unified with the reconstruction theorems into a single principle is open. What is established now is a division of labor: classification where the invariant is finite or parametric, reconstruction where probes suffice, and impossibility theorems where neither holds."
