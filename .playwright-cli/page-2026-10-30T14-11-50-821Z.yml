          - paragraph [ref=e9633]:
            - emphasis [ref=e9634]: Remark 36
            - text: "(Probes and classification). The reconstruction pattern is an instance of the general principle that objects can be probed by the morphisms into or out of them. A standing qualification governs any argument of this form: Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem. Faithfulness of a probe functor is a mathematical statement about a category. Whether the probes carry physical content depends on data outside the functor."
