          - paragraph [ref=e10212]: "The closure of a finite set of blocks under direct sum and tensor product is always infinite as a class, because tensor powers keep producing new sizes, and the closure is always decidable at the level of individual dimension vectors: entry size belongs to a finitely generated multiplicative semigroup of the positive integers, and membership in such a semigroup is decidable. The computability of the closure is a peculiarity of the finite-dimensional regime, where the constructions act on integer vectors; nothing here extends it to closure taken over the full admissible construction list of the framework section."
