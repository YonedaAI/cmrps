          - paragraph [ref=e11677]: The third artifact is a code evidence table, given in the appendix, that maps each computational claim to the file and function that exhibits it.
          - heading "Limitations" [level=2] [ref=e11678]
          - paragraph [ref=e11679]: The classification package of this volume has four sharp limits.
          - paragraph [ref=e11680]:
            - text: Uniqueness is a restricted phenomenon. The existence-and-uniqueness statements hold for unital finite-dimensional complex C*-algebras and their *-homomorphisms, and for the tame corners of tensor decomposition named in
            - link "25" [ref=e11681] [cursor=pointer]:
              - /url: "#prop:unique-restricted"
            - text: ". For interacting systems only restricted-subclass realism is available: unique decomposition is not assumed anywhere in this paper."
          - paragraph [ref=e11682]: Normal forms are not classifications. The Stinespring and Kraus results describe maps canonically; they do not classify channels up to isomorphism, and no such classification is on record.
          - paragraph [ref=e11683]:
            - text: The wildness results of
            - link "44" [ref=e11684] [cursor=pointer]:
              - /url: "#thm:wild-generic-det"
            - text: confine finite-dimensional parameterization to tame regimes, and the tame-wild boundary for the representation categories of physical interest, as opposed to generic algebras, is unstudied.
          - paragraph [ref=e11685]:
            - text: The structural generation identity is conjectural, the admissibility conditions that would define
            - generic [ref=e11687]:
              - math [ref=e11689]:
                - generic [ref=e11692]:
                  - generic [ref=e11693]:
                    - generic [ref=e11694]: P
                    - generic [ref=e11695]: h
                    - generic [ref=e11696]: "y"
                    - generic [ref=e11697]: s
                  - generic [ref=e11698]:
