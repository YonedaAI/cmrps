          - heading "Counterexamples and boundary cases" [level=2] [ref=e11371]
          - paragraph [ref=e11372]: Three natural strengthenings of the results above fail, and the failures locate their hypotheses.
          - heading "Uniqueness without parameterization" [level=3] [ref=e11373]
          - paragraph [ref=e11374]:
            - text: "A tempting inference runs: decomposition is unique, therefore the irreducibles can be parametrized. The inference is false in general. Finite-dimensional algebras over an algebraically closed field satisfy the Krull-Schmidt theorem, so every such algebra decomposes uniquely into indecomposable summands up to permutation, and"
            - link "44" [ref=e11375] [cursor=pointer]:
              - /url: "#thm:wild-generic-det"
            - text: shows that in wild regimes the indecomposables still admit no finite-dimensional parameterization. Unique decomposition and parameterization of the pieces are different achievements; the finite-dimensional C*-case of
            - link "11" [ref=e11376] [cursor=pointer]:
              - /url: "#thm:block-decomposition"
            - text: has both only because its indecomposables are the matrix algebras
