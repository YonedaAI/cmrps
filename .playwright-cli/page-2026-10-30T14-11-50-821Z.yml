            - text: "used positivity through the spectral theorem, and without positivity nothing forces the radical to vanish. Boundary case: the class of unital finite-dimensional complex C*-algebras is exactly the class where the block decomposition with matrix blocks holds; widening to finite-dimensional algebras requires the semisimplicity hypothesis, and widening to infinite-dimensional C*-algebras replaces direct sums by the direct-integral machinery of the contrast theorem."
          - heading "Normal-form invariants" [level=3] [ref=e11437]
          - paragraph [ref=e11438]:
            - text: "A second tempting inference runs: every map has a canonical normal form with an invariant, therefore the maps are classified."
            - link "32" [ref=e11439] [cursor=pointer]:
              - /url: "#ex:equal-count"
            - text: "refutes it: two channels with minimal Kraus count one differ on a single matrix, and the invariant cannot see the difference. The general lesson is that an invariant of a normal form is not an isomorphism invariant of the classified objects. The decomposition theorems of this volume avoid the trap because their invariants are complete: the dimension vector decides isomorphism of algebras ("
            - link "12" [ref=e11440] [cursor=pointer]:
              - /url: "#cor:classification"
            - text: ), and the multiplicity matrix decides conjugacy of homomorphisms (
            - link "20" [ref=e11441] [cursor=pointer]:
              - /url: "#thm:homs"
            - text: ). Completeness is the property the normal forms lack.
          - heading "Interacting systems" [level=3] [ref=e11442]
          - paragraph [ref=e11443]: "The counterexample search found no interacting system outside the restricted subclasses with a uniqueness theorem, and none is claimed here. The failure modes named earlier, entanglement, gauge redundancy, emergence, and coupling, are open problems rather than refuted conjectures: no theorem states that interacting systems admit unique decompositions, and existence-and-uniqueness theorems are realistic only in restricted subclasses. Any analysis that needs uniqueness for an interacting system must restrict the class and prove the restriction suffices."
          - heading "Computational evidence" [level=2] [ref=e11444]
          - paragraph [ref=e11445]: Three computational artifacts accompany this paper. They are evidence about the combinatorics of the theorems above; no statement in this volume is established by them.
