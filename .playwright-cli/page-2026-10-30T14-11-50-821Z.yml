          - heading "Existence beyond the finite-dimensional case" [level=3] [ref=e3774]
          - paragraph [ref=e3775]: Two further existence results are recorded because the later sections compare against them. They are background theorems of operator algebra, used here as reference points and not as dependencies of the classification statements above.
          - paragraph [ref=e3776]:
            - text: "The first is the direct-integral decomposition of von Neumann algebras: every von Neumann algebra is a direct integral of factors over a measure space, and the decomposition is essentially unique up to measure-class isomorphism of the base"
            - link "[13]" [ref=e3777] [cursor=pointer]:
              - /url: "#bib-murray-vonneumann"
            - text: ". Existence of a decomposition into indecomposable pieces is therefore available in that setting. The second is the negative theorem that closes the classification story for the indecomposable pieces: there are uncountably many pairwise non-isomorphic separable type"
            - generic [ref=e3779]:
