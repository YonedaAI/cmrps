          - paragraph [ref=e11105]: Limiting procedures are the least controlled interaction. Direct sums of finite-dimensional blocks pass to direct integrals of factors in infinite-volume or continuum limits, and the block structure of the approximating algebras need not survive the limit. The decomposition theorems of this volume are finite-dimensional statements; their behavior under the limiting procedures named in the construction list is a separate problem, and nothing here claims continuity of decomposition under limit.
