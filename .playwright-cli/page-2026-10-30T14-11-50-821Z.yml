              - text: (Uniqueness in the restricted classes).
              - emphasis [ref=e7432]: Uniqueness of decomposition up to permutation of isomorphic factors holds in each of the following restricted classes.
            - list [ref=e7433]:
              - listitem [ref=e7434]:
                - paragraph [ref=e7435]:
                  - emphasis [ref=e7436]:
