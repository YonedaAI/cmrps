          - paragraph [ref=e8074]:
            - text: "The proposition is the state-level counterpart of the normal-form warning: every mixed state has a canonical spectral decomposition, and no decomposition into pure states is unique. Uniqueness returns only in the restricted bipartite case of"
            - link "25" [ref=e8075] [cursor=pointer]:
              - /url: "#prop:unique-restricted"
            - text: .
          - paragraph [ref=e8077]:
            - emphasis [ref=e8078]: Remark 28
            - text: "(Interacting systems). Interacting physical systems need not admit unique decompositions. Entanglement, emergent phenomena, gauge redundancy, and nontrivial interactions each break naive decomposability: a gauge-invariant state does not split along the subsystem decomposition of the underlying Hilbert space; a coupled system’s observable algebra need not be the tensor product of the factor algebras; and emergent degrees of freedom need not appear as factors of any microscopic decomposition. Existence-and-uniqueness theorems are realistic only in carefully restricted subclasses: finite-dimensional quantum systems with fixed tensor structure, finite groupoid models, and selected classes of topological field theories. This paper proves uniqueness in the first of those regimes at the level of observable algebras and morphisms and claims nothing for the others."
          - paragraph [ref=e8080]:
            - emphasis [ref=e8081]: Remark 29
            - text: (Gauge redundancy). Under a gauge quotient, the decomposition of a system depends on the choice of subalgebra retained after reduction. Two systems with isomorphic reduced observable algebras can carry non-isomorphic unreduced data, and the reduction map does not preserve tensor decompositions in general. Decomposition after quotient is therefore a different problem from decomposition before quotient, and the admissible construction list marks quotient as a construction whose contribution to
            - generic [ref=e8083]:
              - math [ref=e8085]:
                - generic [ref=e8086]: C
              - generic [ref=e8090]: C
            - text: must be stated case by case.
