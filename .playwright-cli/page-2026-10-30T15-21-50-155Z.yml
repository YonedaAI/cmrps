          - paragraph [ref=f6e6319]:
            - text: The conjecture enters later work as a declared hypothesis rather than as a lemma. Its five proof obligations, recorded in Table
            - link "5" [ref=f6e6320] [cursor=pointer]:
              - /url: "#tab:obligations"
            - text: ", are the targets that would turn it into a theorem."
          - table [ref=f6e6321]:
            - caption [ref=f6e6322]:
              - text: Table 5. The five proof obligations of Conjecture
              - link "37" [ref=f6e6323] [cursor=pointer]:
                - /url: "#conj:structural"
              - text: and the content each one requires.
            - rowgroup [ref=f6e6324]:
              - row [ref=f6e6325]:
                - columnheader "Obligation" [ref=f6e6326]
                - columnheader "Content" [ref=f6e6327]
                - columnheader "Status" [ref=f6e6328]
              - row [ref=f6e6329]:
                - cell "Completeness" [ref=f6e6330]
                - cell "Every admissible record lies in the closure of the families" [ref=f6e6331]
                - cell "Open" [ref=f6e6332]
              - row [ref=f6e6333]:
                - cell "Soundness" [ref=f6e6334]
                - cell "Every generated record satisfies the admissibility conditions" [ref=f6e6335]
                - cell "Open" [ref=f6e6336]
              - row [ref=f6e6337]:
                - cell "Equivalence" [ref=f6e6338]
                - cell "Different representations of one system are identified correctly" [ref=f6e6339]
                - cell "Open" [ref=f6e6340]
              - row [ref=f6e6341]:
                - cell "Structural characterization" [ref=f6e6342]
                - cell "The families have precise mathematical definitions" [ref=f6e6343]
                - cell "Partial" [ref=f6e6344]
              - row [ref=f6e6345]:
                - cell "Decomposition" [ref=f6e6346]
                - cell "Targeted classes are constructed from the families" [ref=f6e6347]
                - cell "Open in general" [ref=f6e6348]
          - paragraph [ref=f6e6349]:
            - text: The third obligation is constrained by the preserved-structure discipline of Definition
            - link "17" [ref=f6e6350] [cursor=pointer]:
              - /url: "#def:preserved-structure"
            - text: ": an equivalence that discards the symmetric layer cannot identify the systems correctly, and counterexamples are proved"
            - link "[19]" [ref=f6e6351] [cursor=pointer]:
              - /url: "#bib-etingof-gelaki"
            - text: . The fifth obligation has complete instances in restricted domains and none in general.
          - paragraph [ref=f6e6352]:
            - text: Each obligation has a concrete target. Completeness asks for a construction of every admissible record from family data, which in the restricted classes of Section
            - link "8" [ref=f6e6353] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: is Theorem
            - link "34" [ref=f6e6354] [cursor=pointer]:
              - /url: "#thm:generation"
            - text: . Soundness asks for proofs that the constructions preserve the conditions of Definitions
            - link "21" [ref=f6e6355] [cursor=pointer]:
              - /url: "#def:admissibility"
            - text: and
            - link "22" [ref=f6e6356] [cursor=pointer]:
              - /url: "#def:admissible-spec"
            - text: ", which is a question about the constructions and the conditions together. Equivalence asks for a justified choice of"
            - generic [ref=f6e6358]:
              - math [ref=f6e6360]:
                - generic [ref=f6e6361]: ≃
              - generic [ref=f6e6365]: ≃
            - text: together with proofs that the identification respects the preserved layers. Structural characterization asks for membership definitions of the ten candidates named in Section
            - link "9" [ref=f6e6366] [cursor=pointer]:
              - /url: "#sec:conjecture"
            - text: . Decomposition asks for existence and, in restricted subclasses, uniqueness of the factorization into family data. Each of the five obligations has restricted instances in the classes of Section
            - link "8" [ref=f6e6367] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: ", and the general statements are the theorem targets."
          - paragraph [ref=f6e6368]:
            - text: The program accepts a negative outcome as a result. A proof that a specified class admits a complete classification, and a proof that certain natural classification objectives are impossible without additional restrictions, count equally as mathematical progress. The obstruction theorems surveyed in Section
            - link "2" [ref=f6e6369] [cursor=pointer]:
              - /url: "#sec:problem"
            - text: "set the expectation: outside tame regimes a total theorem of the finite-simple-group kind is implausible, and the honest synthesis is that restricted-class classification theorems and explicit obstruction theorems together are the realistic output of the program. That synthesis is itself a conjectural expectation and is not proved here."
          - heading "Claim-status discipline" [level=2] [ref=f6e6370]
          - paragraph [ref=f6e6371]: The value of a classification program depends on the honesty of its claim labels. The series uses exactly six, and every theorem-level statement carries exactly one.
          - paragraph [ref=f6e6373]:
            - strong [ref=f6e6374]: Definition 38
            - text: (Claim-status labels). The claim-status labels are the following.
            - emphasis [ref=f6e6375]: Machine-checked
            - text: ": a complete formalization has been accepted by a clean kernel-checked build, with the build archived."
            - emphasis [ref=f6e6376]: Complete-informal-proof
            - text: ": a complete mathematical proof exists, given in full in the record or cited from the mathematical literature."
            - emphasis [ref=f6e6377]: Conditional
            - text: ": the statement is proved from hypotheses recorded explicitly, and some hypothesis is itself unproved."
            - emphasis [ref=f6e6378]: Conjecture
            - text: ": a precise statement with no complete proof."
            - emphasis [ref=f6e6379]: Computational-evidence
            - text: ": support from computation that is not a proof."
            - emphasis [ref=f6e6380]: Open-problem
            - text: ": a stated question with neither proof nor substantial evidence."
          - table [ref=f6e6381]:
            - caption [ref=f6e6382]: Table 6. The six claim-status labels and what each one requires. No label may be upgraded by prose, and computational evidence never upgrades a record.
            - rowgroup [ref=f6e6383]:
              - row [ref=f6e6384]:
                - columnheader "Label" [ref=f6e6385]
                - columnheader "Requirement" [ref=f6e6386]
              - row [ref=f6e6387]:
                - cell "Machine-checked" [ref=f6e6388]
                - cell "A complete formalization accepted by a clean kernel-checked build" [ref=f6e6389]
              - row [ref=f6e6390]:
                - cell "Complete-informal-proof" [ref=f6e6391]
                - cell "A complete proof, given here or cited from the literature" [ref=f6e6392]
              - row [ref=f6e6393]:
                - cell "Conditional" [ref=f6e6394]
                - cell "A proof from hypotheses that include unproved statements" [ref=f6e6395]
              - row [ref=f6e6396]:
                - cell "Conjecture" [ref=f6e6397]
                - cell "A precise statement with no complete proof" [ref=f6e6398]
              - row [ref=f6e6399]:
                - cell "Computational-evidence" [ref=f6e6400]
                - cell "Computation that supports a statement without proving it" [ref=f6e6401]
              - row [ref=f6e6402]:
                - cell "Open-problem" [ref=f6e6403]
                - cell "A question with neither proof nor substantial evidence" [ref=f6e6404]
          - paragraph [ref=f6e6405]:
            - text: The discipline applies to this paper’s own statements. The propositions, corollary, and theorems of Sections
            - link "4" [ref=f6e6406] [cursor=pointer]:
              - /url: "#sec:morphisms"
            - text: to
            - link "8" [ref=f6e6407] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: are proved in full above, Conjecture
            - link "37" [ref=f6e6408] [cursor=pointer]:
              - /url: "#conj:structural"
            - text: is stated with its proof obligations, and the experiments of the appendix are computations in the sense of Definition
            - link "38" [ref=f6e6409] [cursor=pointer]:
              - /url: "#def:claim-status"
            - text: .
          - paragraph [ref=f6e6410]:
            - text: "Nothing in the program is machine-checked at the time of writing: no formalization of any record has been accepted by a clean kernel-checked build, and a formalization that is announced but withheld does not qualify for the first label. The record of the announced existence result in constructive quantum field theory reads “existence claimed; manuscript and formalization withheld; verification pending”"
            - link "[21]" [ref=f6e6411] [cursor=pointer]:
              - /url: "#bib-openai-claim"
            - text: ","
            - link "[22]" [ref=f6e6412] [cursor=pointer]:
              - /url: "#bib-kitp"
            - text: ", and an existence result and a mass-gap result are separate claims, the Yang-Mills mass gap remaining an open problem"
            - link "[23]" [ref=f6e6413] [cursor=pointer]:
              - /url: "#bib-clay"
            - text: .
          - paragraph [ref=f6e6414]:
            - text: "A computation never becomes a proof, however many of them agree. The executable models of the taxonomy layer for this volume are written in Haskell and are evidence of that kind: they instantiate the definitions of Sections"
            - link "3" [ref=f6e6415] [cursor=pointer]:
              - /url: "#sec:framework"
            - text: to
            - link "7" [ref=f6e6416] [cursor=pointer]:
              - /url: "#sec:irreducibility"
            - text: ", and they are checked against the statements of Section"
            - link "8" [ref=f6e6417] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: by executable tests. No such model is verified by Lean, and no claim in this paper rests on a computation rather than on a proof.
          - paragraph [ref=f6e6418]:
            - text: "The program also separates three levels of mathematical achievement: mathematical formulation, rigorous theorem, and physical validation. The definitions of this paper sit on the first level, the classification theorems of Section"
            - link "8" [ref=f6e6419] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: sit on the second, and nothing in the program has reached the third.
          - heading "Limitations" [level=2] [ref=f6e6420]
          - paragraph [ref=f6e6421]:
            - text: The scope of the framework is fixed by its preservation laws and admissibility axioms. The five morphism kinds are closed under self-composition and not across kinds (Proposition
            - link "12" [ref=f6e6422] [cursor=pointer]:
              - /url: "#prop:composition-not-typed"
            - text: ), so a theorem that composes morphisms is stated relative to a chosen repair of Corollary
            - link "13" [ref=f6e6423] [cursor=pointer]:
              - /url: "#cor:schema-not-category"
            - text: ; whether a single category accommodates all five kinds is the question that corollary poses. Results over admissible records are stated relative to the axioms of Definition
            - link "21" [ref=f6e6424] [cursor=pointer]:
              - /url: "#def:admissibility"
            - text: and Definition
            - link "22" [ref=f6e6425] [cursor=pointer]:
              - /url: "#def:admissible-spec"
            - text: ", and Proposition"
            - link "25" [ref=f6e6426] [cursor=pointer]:
              - /url: "#prop:conditional"
            - text: records how the class of true statements moves with the list.
          - paragraph [ref=f6e6427]:
            - text: The equivalence relation is declared per class and is not derived. For the restricted classes of Section
            - link "8" [ref=f6e6428] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: the declared relation is mathematical equivalence, and a physical classification of the same objects would need a different relation with its own justification. For realistic systems the choice of physical equivalence is a separate task, and the preserved-structure discipline of Definition
            - link "17" [ref=f6e6429] [cursor=pointer]:
              - /url: "#def:preserved-structure"
            - text: rules out candidate choices without supplying a positive criterion.
          - paragraph [ref=f6e6430]:
            - text: The classification theorems treat the restricted classes of Section
            - link "8" [ref=f6e6431] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: ": finite classical records, finite dynamical records, and finite symmetric records. Their scope is combinatorial; the candidate structural families, interacting systems, quantum field theory, spacetime, and gravity lie outside it. They establish that the definitions support classification statements with complete proofs."
          - paragraph [ref=f6e6432]:
            - text: The universal classification statement is the subject of Conjecture
            - link "37" [ref=f6e6433] [cursor=pointer]:
              - /url: "#conj:structural"
            - text: ", whose five obligations include the finiteness of a generating family set. The literature surveyed in Section"
            - link "2" [ref=f6e6434] [cursor=pointer]:
              - /url: "#sec:problem"
            - text: is registered background of the series, and the survey that registered it searched primarily arXiv and known sources, so citations absent from this paper are not evidence of absence in the literature.
          - paragraph [ref=f6e6435]:
            - text: "A revision of the framework has a clear path. The preservation laws need completion in three directions: the inter-kind composition rule of Corollary"
            - link "13" [ref=f6e6436] [cursor=pointer]:
              - /url: "#cor:schema-not-category"
            - text: ", the algebraic form of the laws for quantum and gauge records, and the status of dualities as equivalences between record presentations. The admissibility list needs testing against records the paper does not treat, in particular gauge records with constraints and lattice records with a continuum limit. The equivalence relation takes a positive criterion beyond the negative constraint of Definition"
            - link "17" [ref=f6e6437] [cursor=pointer]:
              - /url: "#def:preserved-structure"
            - text: . Each of these is a stated task with a stated failure mode.
          - heading "Conclusion" [level=2] [ref=f6e6438]
          - paragraph [ref=f6e6439]: The paper established the definitional layer the classification program needs. A representation is a five-component record, morphisms are declared in five kinds with explicit preservation laws, admissibility is fixed by four record conditions and two class-level conditions, and physical equivalence is a declared choice with a preserved-structure discipline. Inside that framework each morphism kind is closed under self-composition and cross-kind composites fall outside the five laws, so the morphism vocabulary organizes into kind-relative categories. Finite classical records are classified by cardinality, finite dynamical records decompose uniquely into connected components, finite symmetric records are classified by orbit type, and each class satisfies the generation statement from its irreducibles. A four-dimensional example shows that decomposition requires factorization data the bare record does not carry.
          - paragraph [ref=f6e6440]:
            - text: All results are stated relative to the admissibility axioms of Definition
            - link "21" [ref=f6e6441] [cursor=pointer]:
              - /url: "#def:admissibility"
            - text: and Definition
            - link "22" [ref=f6e6442] [cursor=pointer]:
              - /url: "#def:admissible-spec"
            - text: ", the preservation laws of Definition"
            - link "11" [ref=f6e6443] [cursor=pointer]:
              - /url: "#def:concrete-laws"
            - text: ", and the declared equivalence of Definition"
            - link "16" [ref=f6e6444] [cursor=pointer]:
              - /url: "#def:phys-equiv"
            - text: . The five proof obligations of the structural classification conjecture are the theorem targets of the program, and a negative resolution of any of them would be a result of equal value.
          - paragraph [ref=f6e6445]: What follows is that the definitions are precise enough to be refutable, the classification problem is now statable, the obligations are tracked, and the restricted theorems set a standard of proof that any claim of classification in this program will have to meet.
