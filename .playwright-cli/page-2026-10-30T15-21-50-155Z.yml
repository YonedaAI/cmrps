          - paragraph [ref=f6e5021]: Entanglement is a relation between a vector and a chosen tensor structure, and a classification of quantum systems that forgets the tensor structure classifies vectors in a bare space. The non-uniqueness visible here is the smallest member of the family of phenomena, entanglement, emergence, and gauge redundancy among them, that make decomposition uniqueness open for interacting systems in general.
