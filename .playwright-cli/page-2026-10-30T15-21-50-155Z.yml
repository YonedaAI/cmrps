            - text: The second theorem is complete without being parameterized. The classifying datum of a connected component is the isomorphism class of its functional graph, a directed cycle with rooted trees attached to its vertices, and no single integer records that datum. The class is decidable and enumerable, and the classification runs through graph isomorphism of the components rather than through a finite invariant list. The regime distinction of Table
            - link "1" [ref=f6e5674] [cursor=pointer]:
