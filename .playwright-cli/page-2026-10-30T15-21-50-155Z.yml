          - paragraph [ref=f6e17]: Part 1 of The Classification of Mathematical Representations of Physical Systems
          - generic [ref=f6e18]:
            - generic [ref=f6e19]: Matthew Long · The YonedaAI Collaboration
            - generic [ref=f6e20]: October 2026
