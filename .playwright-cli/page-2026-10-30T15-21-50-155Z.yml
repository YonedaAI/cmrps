            - text: claim 1. The orbits are invariant and give a decomposition into transitive records, and any decomposition into irreducibles is a partition into invariant parts, each of which is a single orbit by claim 1, so the multiset of orbits is the multiset of factors and is independent of the decomposition; this proves claim 2. Two transitive
