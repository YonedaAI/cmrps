            - text: reappears inside one restricted class.
          - paragraph [ref=f6e5675]: The theorems of this section are statements of the combinatorial layer. The observable algebra in these classes is the full function algebra, and the interaction of nontrivial observables, Hamiltonian dynamics, and gauge constraints under morphisms is the subject of later work. On records where every claim is decidable, the definitions of irreducibility, decomposition, generation, and classification compose correctly and are proved in full.
