          - paragraph [ref=f6e6126]: "The program’s organizing conjecture asserts that this problem has an answer built from fundamental families and constructions. The families in question are the ten candidate organizing families named in the series ontology: symplectic and Poisson structures, Hilbert spaces and operator algebras, smooth manifolds and geometric structures, principal bundles and connections, probability and measure-theoretic structures, topological and higher-categorical structures, dynamical systems and operator semigroups, tensor categories and compositional structures, discrete combinatorial structures, and derived and homotopical structures. They are candidates, not a completed taxonomy, and some may turn out to be special cases of others."
