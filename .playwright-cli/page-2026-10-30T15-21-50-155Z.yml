            - text: a different list yields a different class of true statements.
          - paragraph [ref=f6e3484]:
            - text: Each condition excludes a concrete pathology, and the list can be tested record by record. A tuple with a component named but not defined fails AC-1. An observable collection such as the two point masses on a two-point state space fails AC-2. A Hamiltonian vector field defined only on an open subset of the state space fails AC-3. A symmetry action that moves an observable outside the observable collection fails AC-4. A composition rule that produces records with undefined components on some inputs, with no declared domain, fails AC-5. A class of records with no declared equivalence relation fails AC-6. The conditions are strong enough to rule these out and weak enough to admit the restricted classes of Section
            - link "8" [ref=f6e3485] [cursor=pointer]:
              - /url: "#sec:restricted"
            - text: ", and that pairing is the design criterion for any revision of the list."
