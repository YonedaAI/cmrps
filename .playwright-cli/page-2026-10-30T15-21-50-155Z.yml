            - text: contravariant on observables, and with the remaining components transported compatibly with their declared structure; on records carrying dynamics the tuple intertwines the dynamics. Morphisms of records compose componentwise. On point-set records whose observables are functions on the state space, the tuple is determined by the state map through precomposition, and the laws of Definition
            - link "11" [ref=f6e1641] [cursor=pointer]:
              - /url: "#def:concrete-laws"
            - text: are stated in that specialization. A preservation law for a morphism kind assigns to each declared morphism of that kind explicit conditions on the tuple, and a composition rule stating which kind, if any, the composite of two declared morphisms belongs to. A morphism is admissible when its declared preservation law is stated. The morphism schema is the collection of all admissible morphisms over all kinds.
          - paragraph [ref=f6e1642]:
            - text: "The laws used in this paper are the following. Two of the five kinds carry structure beyond a map of records: a duality is a contravariant equivalence between record presentations, and a limiting procedure is the leg of a cone on a diagram of records. Neither is an arrow of an ordinary record category in its own right, and the schema records both as morphism kinds whose preservation law carries the extra structure; the underlying map is the part that composes. The laws are stated for point-set records, and the quantum records of Example"
            - link "4" [ref=f6e1643] [cursor=pointer]:
              - /url: "#ex:quantum"
            - text: "require the algebraic form of the same laws: there a coarse-graining is a unital *-homomorphism of observable algebras, as in the partial trace on a tensor factor, and an embedding is an inclusion of algebras, rather than a surjection or an injection of points."
