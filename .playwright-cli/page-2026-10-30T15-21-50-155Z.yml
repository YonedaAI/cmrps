          - generic [ref=f6e24]:
            - heading "Abstract" [level=2] [ref=f6e25]
            - text: "The classification of mathematical representations of physical systems is a structural problem before it is a physical one, and this paper establishes the foundations that the problem requires. A representation is recorded as a five-part tuple of state space, observables, dynamics, symmetries, and composition rules. Morphisms are admitted in five named kinds, each with an explicit preservation law, and admissibility is fixed by six stated conditions that single out admissible records and admissible class specifications. Several results give the framework content. An explicit counterexample shows that the composite of an embedding and a coarse-graining satisfies no listed preservation law: the five morphism kinds are closed under self-composition and not across kinds, and the vocabulary resolves into kind-relative categories. Three restricted classes are then classified in full: finite classical systems under disjoint union are classified by cardinality with one-point systems as the unique irreducibles, finite dynamical systems decompose uniquely into connected components, and finite symmetric systems are classified by orbit type. Irreducibility is characterized relative to the composition rule; a two-qubit example identifies the additional factorization data that decomposition requires. The structural classification conjecture is stated with its five proof obligations as the theorem targets of the program. All results are stated relative to the admissibility axioms and the preservation laws fixed in the paper, in the standard axiom-relative form."
          - heading "Introduction" [level=2] [ref=f6e26]
          - paragraph [ref=f6e27]:
            - text: Classifying the mathematical representations of physical systems is a structural question. It asks which representations exist, which of them describe the same system, and which are assembled from simpler ones. The Classification of Finite Simple Groups shows how much a completed structural classification can deliver and how much it can withhold. The classification is complete, every finite simple group belongs to a named family or is a sporadic group, and no uniform parameterization analogous to Dynkin diagrams is known
            - link "[1]" [ref=f6e28] [cursor=pointer]:
              - /url: "#bib-gorenstein1982"
            - text: ","
            - link "[2]" [ref=f6e29] [cursor=pointer]:
              - /url: "#bib-solomon2001"
            - text: . Practical identification runs through companion data of the ATLAS kind, order, Schur multiplier, outer automorphism group, presentations, and character tables with power maps
            - link "[3]" [ref=f6e30] [cursor=pointer]:
              - /url: "#bib-atlas-book"
            - text: . A completed classification and a usable parameterization are separate achievements.
          - paragraph [ref=f6e31]:
            - text: Three notions must be kept apart from the start. A
            - emphasis [ref=f6e32]: classification
            - text: is an exhaustive list of objects up to a stated equivalence. A
            - emphasis [ref=f6e33]: parameterization
            - text: is a uniform finite or continuous datum whose value identifies the object. A
            - emphasis [ref=f6e34]: recognition procedure
            - text: is an algorithm that decides identity from recorded invariants. The finite simple groups deliver the first, partially the third, and not the second. Complex semisimple Lie algebras deliver all three, since Dynkin diagrams parameterize them
            - link "[4]" [ref=f6e35] [cursor=pointer]:
              - /url: "#bib-humphreys1972"
            - text: . A foundation for a classification program of physical systems has to state which of the three it pursues.
          - paragraph [ref=f6e36]: "The foundations needed here are definitional. Before a classification theorem can be stated, the program needs a mathematical notion of a physical system, a notion of morphism, a notion of equivalence, and a condition that separates admissible records from arbitrary ones. The difficulty is that no universally accepted mathematical definition of every possible physical system exists. This paper does not remove that difficulty. It makes the difficulty explicit and workable: it fixes a record schema, a morphism vocabulary with preservation laws, an equivalence discipline, and a list of admissibility conditions, and it proves results about that framework rather than about any physical theory."
          - paragraph [ref=f6e37]:
            - text: This paper contributes a five-component record for a representation with each component given a precise mathematical role, carried by worked classes of records that support every later construction. Preservation laws for the five named morphism kinds come with a proof that the kinds do not compose across kinds (Proposition
            - link "12" [ref=f6e38] [cursor=pointer]:
              - /url: "#prop:composition-not-typed"
            - text: ), so the morphism vocabulary is a schema with kind-relative categories rather than a single one, and with a proof that each kind is closed under self-composition (Proposition
            - link "14" [ref=f6e39] [cursor=pointer]:
              - /url: "#prop:self-composition"
            - text: ). Four conditions single out admissible records, two further conditions single out admissible class specifications, and under a closed morphism kind the admissible records form a category (Propositions
            - link "24" [ref=f6e40] [cursor=pointer]:
              - /url: "#prop:schema-category"
            - text: and
            - link "25" [ref=f6e41] [cursor=pointer]:
              - /url: "#prop:conditional"
            - text: ). Three restricted classes receive complete classification (Theorems
            - link "32" [ref=f6e42] [cursor=pointer]:
              - /url: "#thm:finite-state-classification"
            - text: ","
            - link "33" [ref=f6e43] [cursor=pointer]:
              - /url: "#thm:dynamical-decomposition"
            - text: ", and"
            - link "35" [ref=f6e44] [cursor=pointer]:
              - /url: "#thm:symmetric-classification"
            - text: ), and an explicit two-qubit computation shows that decomposition needs factorization data beyond the record (Proposition
            - link "31" [ref=f6e45] [cursor=pointer]:
              - /url: "#prop:factorization-nonunique"
            - text: ). The structural classification conjecture is stated with its five proof obligations, and a claim-status discipline keeps announced results, complete proofs, and machine-checked statements apart.
          - paragraph [ref=f6e46]: The scope of the program follows a founding distinction. Classifying mathematical representations of physical systems is a mathematical problem that can be formalized at once. Classifying physical systems themselves additionally requires a justified notion of physical equivalence and an empirical interpretation. This paper works entirely on the first side of that line. It also adopts the program’s three levels of mathematical achievement, mathematical formulation, rigorous theorem, and physical validation, and it places its own results on the first two. Nothing in this paper reaches physical validation.
          - heading "The classification problem" [level=2] [ref=f6e47]
          - paragraph [ref=f6e48]:
            - text: Completed classifications in mathematics fall into regimes, and the regimes determine what a classification program for physics can promise. Table
            - link "1" [ref=f6e49] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: collects representative cases on which the program relies as background. The rows are established mathematics, cited here as registered background; no theorem of this paper depends on them, and the comparison with finite simple groups is the only one of them that shapes the constructions below.
