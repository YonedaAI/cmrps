          - paragraph [ref=f6e6062]:
            - text: Theorem
            - link "35" [ref=f6e6063] [cursor=pointer]:
              - /url: "#thm:symmetric-classification"
            - text: sits in the parameterized regime of Table
            - link "1" [ref=f6e6064] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: and shows that symmetry does not by itself push a restricted class out of it. Its invariant is already a function on conjugacy classes rather than a single number, which is the shape that classifying data takes as soon as group actions enter.
          - paragraph [ref=f6e6065]:
            - text: These results do not touch the candidate structural families of Section
            - link "9" [ref=f6e6066] [cursor=pointer]:
              - /url: "#sec:conjecture"
            - text: ", interacting systems, or any physical theory. What they establish is that the framework of Sections"
            - link "3" [ref=f6e6067] [cursor=pointer]:
              - /url: "#sec:framework"
            - text: to
            - link "6" [ref=f6e6068] [cursor=pointer]:
              - /url: "#sec:admissibility"
            - text: supports complete restricted classification with proofs, which is a first success criterion of the program.
