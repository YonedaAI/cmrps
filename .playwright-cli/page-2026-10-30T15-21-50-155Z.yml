          - paragraph [ref=f6e152]:
            - text: Classification is sharp exactly where the identifying invariant is finite or parametric. Classification content can be entirely global, since Darboux’s theorem removes all local invariants from symplectic geometry, so the classifying data of a classical system has to be topological
            - link "[11]" [ref=f6e153] [cursor=pointer]:
              - /url: "#bib-arnold1978"
            - text: . Non-classifiability is itself a theorem rather than a difficulty, as the impossibility of classifying general type II
