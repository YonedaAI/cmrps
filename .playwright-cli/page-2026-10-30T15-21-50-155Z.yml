                  - text: (−, P)
            - text: "is established mathematics: in a locally small category an object is determined up to isomorphism by its representable functor"
            - link "[20]" [ref=f6e2864] [cursor=pointer]:
              - /url: "#bib-maclane1971"
            - text: . The physical interpretation of that embedding is the subject of the following constraint, adopted verbatim. “Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem.” Relational data alone settles none of the three, and a later volume that derives any of the three from representability alone has derived nothing.
          - paragraph [ref=f6e2865]: Physical equivalence is also distinct from empirical indistinguishability, and the program keeps the two apart by construction.
          - paragraph [ref=f6e2867]:
            - strong [ref=f6e2868]: Definition 19
            - text: (Three layers). The program separates three layers of achievement. The mathematical layer classifies admissible structures up to the chosen equivalence. The realization layer assigns to classified structures physical systems. The selection layer assigns to physical systems the observational constraints or predictions that experiments bear on. A complete solution of the first layer would not by itself solve the second or the third.
          - paragraph [ref=f6e2869]: The separation has two consequences that later volumes inherit. A mathematical structure can be consistent without describing the observed world, and several mathematically distinct theories can produce identical predictions in an experimentally accessible regime. The layers belong to the assembly stage of the series, and the present paper works on the first of them only.
          - paragraph [ref=f6e2871]:
            - emphasis [ref=f6e2872]: Remark 20
            - text: "(Observational equivalence). A third relation is often confused with the first two. Two records are observationally equivalent when no measurement available to a stated observer distinguishes them, which is a relation on records relative to a measurement class and an observer, and not an intrinsic relation on mathematical structures. The implication pattern is one-way in each direction that matters: mathematical equivalence implies observational equivalence for any fixed measurement class, while observational equivalence does not imply mathematical equivalence, and physical equivalence is asserted on physical grounds rather than derived from either. Identifying mathematical isomorphism with empirical indistinguishability is therefore a category error, and no classification statement in this series is allowed to make that identification."
          - heading "Admissible physical systems" [level=2] [ref=f6e2873]
