          - paragraph [ref=f6e2836]:
            - strong [ref=f6e2837]: Definition 17
            - text: (Preserved-structure record). An identification of two records must name the layers of structure it preserves. The layers are the symmetric monoidal layer, the monoidal layer without symmetry, the braided layer, the plain tensor layer, the *-structure of operator-algebraic data, the algebraic structure, the topological structure, complete positivity of channels, and the unitary freedom of dilations. An identification that names no preserved layer is not admissible.
          - paragraph [ref=f6e2838]:
            - text: "The requirement is a discipline with a proved reason. Tensor-category equivalence that discards the symmetric layer does not determine the group: non-isomorphic finite groups can carry equivalent plain tensor representation categories"
            - link "[19]" [ref=f6e2839] [cursor=pointer]:
              - /url: "#bib-etingof-gelaki"
            - text: . Any classification built on an equivalence that forgets the monoidal or symmetric layer is therefore false as a classification of the underlying structures, and every equivalence record in the series must state what it preserves.
          - paragraph [ref=f6e2841]:
            - emphasis [ref=f6e2842]: Remark 18
            - text: (The Yoneda qualification). The Yoneda embedding
