            - text: "-sets are isomorphic exactly when their stabilizer subgroups are conjugate, so an isomorphism of records matches orbits by stabilizer class, and matched orbits patch to an isomorphism of records; this proves claim 3. Claim 4 follows because a finite group has finitely many conjugacy classes of subgroups and each orbit count is bounded by"
