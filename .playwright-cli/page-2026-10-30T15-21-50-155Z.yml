          - paragraph [ref=f6e2186]: The point-set laws above are specializations. Records whose state space is a Hilbert space carry observables that are operators rather than scalar functions, and their morphisms are algebra homomorphisms contravariant on observables and, where states are the primitive data, maps on density matrices. The five kinds and their preservation discipline survive the change of ambient category; only the form of the state map changes.
