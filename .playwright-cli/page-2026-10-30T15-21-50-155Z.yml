            - text: . These are results about recovering objects from probes, and they are proof templates for the series. They are not classification theorems, and they do not make classification unnecessary.
          - paragraph [ref=f6e216]: Classification and reconstruction both rest on explicit mathematical primitives. Classification demands an object class, an equivalence relation, and a composable morphism vocabulary; reconstruction demands structured probes and preservation laws. This paper fixes those primitives and proves results about them, and it separates the representation of a system from any empirical realization of it.
          - paragraph [ref=f6e217]:
            - text: This paper depends on no theorem of the series and on no classification theorem beyond the architectural comparison with finite simple groups. The classification theorems of Table
            - link "1" [ref=f6e218] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: "are registered background, and the conjecture below enters later work as a declared hypothesis. This paper asserts no universal classification; that statement is the conjecture’s subject. These rules make the definitions reusable: a definitional root that smuggled in results would make every dependent statement rest on them."
          - heading "Mathematical framework" [level=2] [ref=f6e219]
          - paragraph [ref=f6e220]: A representation of a physical system is a piece of mathematical data, and the schema below records that data in five components. The schema is a stipulation. It is proposed as a working definition, it is the definitional root of the series, and it is not claimed to capture every system anyone would call physical.
