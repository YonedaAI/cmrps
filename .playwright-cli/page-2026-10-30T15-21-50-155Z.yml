          - paragraph [ref=f6e1376]: "A classification problem needs morphisms as much as objects. The morphism vocabulary below names five kinds of admissible relationship, and each kind is given a preservation law: the conditions a map of records must meet to count as a morphism of that kind. Without such laws the vocabulary is a list of words."
