              - text: .
          - paragraph [ref=f6e2681]:
            - emphasis [ref=f6e2682]: Proof.
            - text: Surjective state maps compose to surjective maps, and pullbacks along a composite are the composite of the pullbacks, so a composite of coarse-grainings meets the coarse-graining law. Injective state maps compose to injective maps, and extensions along a composite are the composite of the extensions, so a composite of embeddings meets the embedding law. Bijections carrying the record across compose to bijections carrying the record across. Duality and limiting procedures require the extra data of their laws, and nothing here asserts closure for them. ◻
          - paragraph [ref=f6e2683]:
            - text: Proposition
            - link "12" [ref=f6e2684] [cursor=pointer]:
              - /url: "#prop:composition-not-typed"
            - text: and Proposition
            - link "14" [ref=f6e2685] [cursor=pointer]:
              - /url: "#prop:self-composition"
            - text: "together locate the difficulty: typed composition holds inside each kind and fails across kinds. Physical modeling composes kinds freely, an embedding followed by a coarse-graining being the common case, so the single-kind restriction of Corollary"
            - link "13" [ref=f6e2686] [cursor=pointer]:
              - /url: "#cor:schema-not-category"
            - text: "is a working convention of stated scope: admissible morphisms are restricted to one kind at a time, and Section"
            - link "6" [ref=f6e2687] [cursor=pointer]:
              - /url: "#sec:admissibility"
            - text: builds the resulting categories. A native treatment of inter-kind composition takes a bicategory of spans or cospans, or a typed multicategory, in which a composite carries its two kinds as typing data; that construction is the route beyond the present convention.
