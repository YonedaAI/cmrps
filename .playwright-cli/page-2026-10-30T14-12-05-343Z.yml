          - paragraph [ref=e177]: "The paper also separates three notions that are routinely conflated in emergent-spacetime discussions: classification of geometries by invariants, reconstruction of geometry from probe data, and derivation of a theory’s dynamics from information. The first two have proved instances in this volume and the third does not. Executable checks of the entropy inequalities, finite-order causal checks, and a typed taxonomy of the volume’s systems accompany the arguments as computational evidence."
