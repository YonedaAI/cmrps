          - paragraph [ref=e3831]:
            - strong [ref=e3832]: Corollary 26
            - text: (Dimension contrast).
            - emphasis [ref=e3833]: A finite table of model geometries with a canonical decomposition theorem exists for closed 3-manifolds and cannot exist, in the algorithmic sense, for closed 4-manifolds. Classification of closed manifolds by a finite table of models is a tame-regime phenomenon.
          - paragraph [ref=e3835]:
