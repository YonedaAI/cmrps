            - generic [ref=e6354]: lhs = ent[u] + ent[v]
            - generic [ref=e6355]: rhs = ent[u | v] + ent[u & v]
            - generic [ref=e6356]: "if lhs + 1e-12 < rhs:"
            - generic [ref=e6357]: return False
            - generic [ref=e6358]: return True
            - generic [ref=e6359]: "def mmi_holds(ent):"
            - generic [ref=e6360]: "# Monogamy S(A)+S(B)+S(C)+S(ABC) <= S(AB)+S(AC)+S(BC)."
            - generic [ref=e6361]: A, B, C = 1, 2, 4
            - generic [ref=e6362]: lhs = ent[A] + ent[B] + ent[C] + ent[A | B | C]
            - generic [ref=e6363]: rhs = ent[A | B] + ent[A | C] + ent[B | C]
            - generic [ref=e6364]: return lhs <= rhs + 1e-12
            - generic [ref=e6365]: "def check_witness():"
            - generic [ref=e6366]: "# Perfectly correlated triple A = B = C = X, X a uniform bit."
            - generic [ref=e6367]: ent = [0.0] * 8
            - generic [ref=e6368]: "for m in range(1, 8):"
            - generic [ref=e6369]: ent[m] = 1.0
            - generic [ref=e6370]: ssa = ssa_holds(ent)
            - generic [ref=e6371]: mmi = mmi_holds(ent)
            - generic [ref=e6372]: assert ssa and not mmi
            - generic [ref=e6373]: return ssa and not mmi
          - paragraph [ref=e6374]:
            - text: The finite-order experiment enumerates every partial order on at most four labeled points and takes a census of the ladder rungs. The loop check of
            - link "20" [ref=e6375] [cursor=pointer]:
              - /url: "#prop:finiteposet"
            - text: "and the interval check are definitional on a finite ground set and are reported as such; the informative output is the distinguishing census: only 33 of the 242 enumerated orders are distinguishing, and the antichain of two points fails distinguishing while passing the interval check, as"
            - link "21" [ref=e6376] [cursor=pointer]:
              - /url: "#prop:distinguish"
            - text: states. The companion Alexandroff experiment rebuilds each order from its up-set topology and verifies
            - link "39" [ref=e6377] [cursor=pointer]:
              - /url: "#prop:specialization"
            - text: ": the closure of each singleton is its down-set, so the topology recovers the order."
          - code [ref=e6380]:
            - generic [ref=e6381]: "def has_increasing_loop(le, n):"
            - generic [ref=e6382]: "# Strictly increasing loop x0 < x1 < ... < x0 (real test)."
            - generic [ref=e6383]: strict = [[le[x][y] and x != y for y in range(n)] for x in range(n)]
            - generic [ref=e6384]: "for start in range(n):"
            - generic [ref=e6385]: "stack = [(start, frozenset({start}))]"
            - generic [ref=e6386]: "while stack:"
            - generic [ref=e6387]: node, seen = stack.pop()
            - generic [ref=e6388]: "for nxt in range(n):"
            - generic [ref=e6389]: "if not strict[node][nxt]:"
            - generic [ref=e6390]: continue
            - generic [ref=e6391]: "if nxt == start:"
            - generic [ref=e6392]: return True
            - generic [ref=e6393]: "if nxt not in seen:"
            - generic [ref=e6394]: "stack.append((nxt, seen | {nxt}))"
            - generic [ref=e6395]: return False
            - generic [ref=e6396]: "def is_distinguishing(le, n):"
            - generic [ref=e6397]: "# Past- and future-distinguishing (Definition 2.3)."
            - generic [ref=e6398]: "for x in range(n):"
            - generic [ref=e6399]: "for y in range(n):"
            - generic [ref=e6400]: "if x == y:"
            - generic [ref=e6401]: continue
            - generic [ref=e6402]: px, fx = past_future(le, x, n)
            - generic [ref=e6403]: py, fy = past_future(le, y, n)
            - generic [ref=e6404]: "if px == py or fx == fy:"
            - generic [ref=e6405]: return False
            - generic [ref=e6406]: return True
          - heading "Limitations" [level=2] [ref=e6407]
          - paragraph [ref=e6408]:
            - text: Every proved result here classifies a narrow target rather than spacetime itself. The holonomy classification
            - link "[1]" [ref=e6409] [cursor=pointer]:
              - /url: "#bib-galaev"
            - text: classifies holonomy groups and not spacetimes. The causal ladder
            - link "[2]" [ref=e6410] [cursor=pointer]:
              - /url: "#bib-minguzzisanchez"
            - text: classifies causality conditions and not geometries. Geometrization
            - link "[3]" [ref=e6411] [cursor=pointer]:
              - /url: "#bib-perelman"
            - text: ","
            - link "[4]" [ref=e6412] [cursor=pointer]:
              - /url: "#bib-thurston1982"
            - text: classifies closed 3-manifolds, and
            - link "25" [ref=e6413] [cursor=pointer]:
              - /url: "#thm:tancer"
            - text: shows there is no algorithmic analogue in dimension four. The entropy cone theorem
            - link "28" [ref=e6414] [cursor=pointer]:
              - /url: "#thm:cone"
            - text: classifies entropy vectors produced by a proposal. No theorem in this paper classifies Lorentzian spacetimes themselves up to isometry, and no such theorem is claimed.
          - paragraph [ref=e6415]:
            - text: The holographic material is a proposal in all of its parts. The Ryu-Takayanagi formula has exact checks in special settings
            - link "[10]" [ref=e6416] [cursor=pointer]:
              - /url: "#bib-ryutakayanagi"
            - text: ","
            - link "[17]" [ref=e6417] [cursor=pointer]:
              - /url: "#bib-casinimyers"
            - text: and a physics-level replica derivation for static bulk geometries
            - link "[18]" [ref=e6418] [cursor=pointer]:
              - /url: "#bib-lewkowyczmaldacena"
            - text: ", and it is not a theorem. The HaPPY codes prove statements about toy models"
            - link "[12]" [ref=e6419] [cursor=pointer]:
              - /url: "#bib-haappy"
            - text: . The entanglement-connectedness statement is an argument
            - link "[13]" [ref=e6420] [cursor=pointer]:
              - /url: "#bib-vanraamsdonk"
            - text: . Every result of this paper that touches holography is stated conditionally on the prescription, and the conditionality is written where the result is used.
          - paragraph [ref=e6421]:
            - text: The reconstruction theorems recover different objects. The causal theorem
            - link "36" [ref=e6422] [cursor=pointer]:
              - /url: "#thm:malament"
            - text: recovers a conformal class from an order. The entanglement-wedge theorem
            - link "40" [ref=e6423] [cursor=pointer]:
              - /url: "#thm:dhw"
            - text: recovers operators inside a code subspace from boundary algebras. Neither recovers a metric from entanglement data, and the distance between these results and a derivation of gravity from information is a research program, not a step.
          - paragraph [ref=e6424]:
            - text: The Python experiments test finite instances of the propositions proved in
            - link "29" [ref=e6425] [cursor=pointer]:
              - /url: "#prop:mmi"
            - text: ","
            - link "20" [ref=e6426] [cursor=pointer]:
              - /url: "#prop:finiteposet"
            - text: ", and"
            - link "21" [ref=e6427] [cursor=pointer]:
              - /url: "#prop:distinguish"
            - text: ; the Haskell instances type the objects of
            - link "8" [ref=e6428] [cursor=pointer]:
              - /url: "#def:systems"
            - text: . The evidence is reproducible from the files in the appendix and is not proof. Nothing in this volume has been checked by a proof assistant, and the mechanization targets are recorded separately as targets. This volume depends on the shared definitions and on the registered background results it cites. It does not depend on any statement about the entropy cone for six or more regions, on the Ryu-Takayanagi formula outside its stated settings, or on tensor-network toy models as evidence about gravity; where a result needs those inputs, the conditional phrasing appears in the statement.
          - heading "Conclusion" [level=2] [ref=e6429]
          - paragraph [ref=e6430]:
            - text: Spacetime admits classification exactly where its invariants are finite or parametric and reconstruction exactly where probes determine a target up to a stated equivalence. Lorentzian holonomy groups form a classified list with realizing metrics
            - link "[1]" [ref=e6431] [cursor=pointer]:
              - /url: "#bib-galaev"
            - text: . Causality conditions form a complete ladder
            - link "[2]" [ref=e6432] [cursor=pointer]:
              - /url: "#bib-minguzzisanchez"
            - text: . Closed 3-manifolds form a finite table of eight geometries
            - link "[3]" [ref=e6433] [cursor=pointer]:
              - /url: "#bib-perelman"
            - text: ","
            - link "[4]" [ref=e6434] [cursor=pointer]:
              - /url: "#bib-thurston1982"
            - text: ", and closed 4-manifolds do not admit algorithmic recognition"
            - link "[5]" [ref=e6435] [cursor=pointer]:
              - /url: "#bib-tancer"
            - text: . The holographic entropy cone is a complete polyhedral calculation for at most four regions
            - link "[6]" [ref=e6436] [cursor=pointer]:
              - /url: "#bib-baoetal"
            - text: ", probed here by a witness showing that its two inequality families are independent ("
            - link "29" [ref=e6437] [cursor=pointer]:
              - /url: "#prop:mmi"
            - text: ).
          - paragraph [ref=e6438]:
            - text: "Reconstruction has one proved classical form: the chronological order determines the topology and the conformal class"
            - link "[8]" [ref=e6439] [cursor=pointer]:
              - /url: "#bib-malament"
            - text: ", and the conformal factor is exactly the undetermined freedom ("
            - link "37" [ref=e6440] [cursor=pointer]:
              - /url: "#cor:confactor"
            - text: "). It has one proved quantum-information form: bulk operators in an entanglement wedge are boundary-representable in the code subspace"
            - link "[11]" [ref=e6441] [cursor=pointer]:
              - /url: "#bib-dongharlowwall"
            - text: . Between them lies the conjecture that entanglement determines geometry
            - link "[10]" [ref=e6442] [cursor=pointer]:
              - /url: "#bib-ryutakayanagi"
            - text: ","
            - link "[12]" [ref=e6443] [cursor=pointer]:
              - /url: "#bib-haappy"
            - text: ","
            - link "[13]" [ref=e6444] [cursor=pointer]:
              - /url: "#bib-vanraamsdonk"
            - text: ", presented here with its status on every appearance."
          - paragraph [ref=e6445]:
            - text: The negative results are part of the answer. The causal ladder rungs depend on their translation to finite orders (
            - link "22" [ref=e6446] [cursor=pointer]:
              - /url: "#cor:notransfer"
            - text: ), so a discrete quantum-gravity model that uses its rungs must state its definitions and prove its own causality theorems. Monogamy of mutual information is not free from strong subadditivity (
            - link "29" [ref=e6447] [cursor=pointer]:
              - /url: "#prop:mmi"
            - text: ), so from three regions on the entropy cone genuinely needs both inequality families. Dimension four has no algorithmic classification (
            - link "25" [ref=e6448] [cursor=pointer]:
              - /url: "#thm:tancer"
            - text: ), so a classification chart of this kind has rows that end in impossibility results rather than in lists. Each of these is a boundary, and each boundary narrows the targets a classification can honestly claim.
          - paragraph [ref=e6449]:
            - text: Four open problems delimit the next stage. The complete RT facet lists for six and more boundary regions are unknown; five regions are settled
            - link "[16]" [ref=e6450] [cursor=pointer]:
              - /url: "#bib-hernandezcuenca"
            - text: ", and for general"
            - generic [ref=e6452]:
              - math [ref=e6454]:
                - generic [ref=e6455]: "n"
              - generic [ref=e6459]: "n"
            - text: only one infinite family of inequalities is known
            - link "[6]" [ref=e6460] [cursor=pointer]:
              - /url: "#bib-baoetal"
            - text: . The invariants of
            - link "1" [ref=e6461] [cursor=pointer]:
              - /url: "#tab:invariants"
            - text: do not separate isometry classes (
            - link "12" [ref=e6462] [cursor=pointer]:
              - /url: "#cor:notclassifies"
            - text: ), and which additional global invariants complete such a classification is open. The conformal factor left undetermined by
            - link "37" [ref=e6463] [cursor=pointer]:
              - /url: "#cor:confactor"
            - text: is either physically irrelevant or recoverable from additional probes, and the choice is not made by any theorem here. A determination theorem for spacetime from entanglement data would need the three items of
            - link "45" [ref=e6464] [cursor=pointer]:
              - /url: "#rem:upgrade"
            - text: ", and none is established in the sources reviewed (cutoff 2026-10-29). The classification of Lorentzian spacetimes up to isometry remains, as this paper has tried to make precise, exactly where its invariants stop."
          - heading "References" [level=2] [ref=e6465]
          - generic [ref=e6466]:
            - paragraph [ref=e6467]:
              - text: "[1] A. S. Galaev,"
              - emphasis [ref=e6468]: Holonomy groups of Lorentzian manifolds
              - text: ", arXiv:1611.01551; Russian Math. Surveys 70 (2015) 249-298, DOI 10.1070/RM2015v070n02ABEH004947."
            - paragraph [ref=e6469]:
              - text: "[2] E. Minguzzi and M. Sánchez,"
              - emphasis [ref=e6470]: The causal hierarchy of spacetimes
              - text: ", arXiv:gr-qc/0609119; in Recent developments in pseudo-Riemannian geometry, ESI Lect. Math. Phys., European Mathematical Society, Zurich, 2008, pp. 299-358."
            - paragraph [ref=e6471]:
              - text: "[3] G. Perelman,"
              - emphasis [ref=e6472]: The entropy formula for the Ricci flow and its geometric applications
              - text: ", arXiv:math/0211159, 2002;"
              - emphasis [ref=e6473]: Ricci flow with surgery on three-manifolds
              - text: ", arXiv:math/0303109, 2003;"
              - emphasis [ref=e6474]: Finite extinction time for the solutions to the Ricci flow on certain three-manifolds
