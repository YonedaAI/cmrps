          - paragraph [ref=e3253]:
            - text: The result does not say that discrete models of spacetime are unreasonable. It says that a classification invariant proved in the manifold category is not automatically an invariant of the discrete one, and any program that imports the ladder into causal set theory must prove new theorems rather than cite
            - link "[2]" [ref=e3254] [cursor=pointer]:
              - /url: "#bib-minguzzisanchez"
            - text: . The finite orders studied here carry no additional structure. Causal-set formulations of discrete spacetime impose local finiteness and a natural measure in addition to the order and define their own discrete causality conditions; those formulations lie outside the scope of this volume.
