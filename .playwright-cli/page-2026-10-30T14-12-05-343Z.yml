              - text: .
          - paragraph [ref=e2800]:
            - emphasis [ref=e2801]: Argument structure.
            - text: The implications are proved in the source in a single framework with minimal hypotheses; the strictness is proved by constructing, for each pair of adjacent rungs, a separating spacetime, and the equivalences at the top rung are proved by the compactness characterization of global hyperbolicity. The survey of Minguzzi and Sánchez also records the alternative definitions of each rung and the smoothability results needed to make the examples smooth. The contribution of this paper begins at
            - link "20" [ref=e2802] [cursor=pointer]:
              - /url: "#prop:finiteposet"
            - text: ", where the ladder is tested against a different category of causal models."
          - paragraph [ref=e2804]:
