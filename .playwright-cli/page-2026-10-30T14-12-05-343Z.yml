            - text: shows that no algorithm can recognize the members of even a single infinite family of closed 4-manifolds, so no finite table can be accompanied by an algorithmic identification procedure in dimension four. ◻
          - paragraph [ref=e3840]:
            - emphasis [ref=e3841]: Remark 27
            - text: "(Model geometries in dimension four). Four-dimensional model geometries do exist as a list: Filipkiewicz classified them into eighteen geometries together with one countably infinite family"
            - link "[15]" [ref=e3842] [cursor=pointer]:
