            - text: "/2D CFT and for spherical regions in higher dimensions, HaPPY codes realize it in toy models only, and entanglement-induced geometry is an argument. Two boundary statements delimit the subject: monogamy of mutual information is independent of strong subadditivity over entropic vectors, and the ladder depends on how its rungs are translated to discrete orders."
          - heading "Introduction" [level=2] [ref=e61]
          - paragraph [ref=e62]: "Lorentzian geometry admits no uniform classification by local invariants: the causal, metric, and holonomic structures of a spacetime constrain its metric only up to large equivalence classes. Riemannian manifolds and Lie algebras carry discrete or rigid classification invariants. Lorentzian spacetimes offer global invariants instead: holonomy groups, causal ladder rungs, Thurston model geometries. Each of these determines geometry only within a restricted class or up to conformal rescaling. The questions are which of these invariants classify their stated targets, which of them reconstruct a geometry from relational data, and where the classification runs out."
