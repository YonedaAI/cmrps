          - heading "The causal ladder" [level=2] [ref=e2757]
          - paragraph [ref=e2758]:
            - text: Causality conditions order spacetimes by how badly causal curves misbehave. The ladder is complete as a classification of these conditions
            - link "[2]" [ref=e2759] [cursor=pointer]:
              - /url: "#bib-minguzzisanchez"
            - text: ", and its rungs do not survive translation to discrete orders."
          - paragraph [ref=e2761]:
            - strong [ref=e2762]: Theorem 18
            - text: (Completeness of the causal ladder).
            - emphasis [ref=e2763]:
              - text: For Lorentzian spacetimes the causality conditions of
              - link "3" [ref=e2764] [cursor=pointer]:
                - /url: "#def:ladder"
              - text: "form a strict chain: global hyperbolicity implies causal simplicity, which implies causal continuity, which implies stable causality, which implies strong causality, which implies distinguishing, which implies causality, which implies chronology. Each implication is strict: for each pair of adjacent rungs there exists a spacetime satisfying the lower rung and violating the higher one. Global hyperbolicity is the strongest of the standard causality conditions, and it is equivalent to the compactness of causal diamonds"
              - generic [ref=e2766]:
