          - paragraph [ref=e3207]:
            - emphasis [ref=e3208]: Proof.
            - text: In an antichain no two distinct points are related, so every chronological future and past is empty. Distinct points therefore carry identical pasts and identical futures, while the order-theoretic compactness of intervals holds vacuously. This is exactly the failure mode
            - link "3" [ref=e3209] [cursor=pointer]:
