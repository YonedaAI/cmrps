              - /url: "#bib-casinimyers"
            - text: ; a replica derivation for static bulk geometries explains the prescription at the physics level
            - link "[18]" [ref=e6226] [cursor=pointer]:
              - /url: "#bib-lewkowyczmaldacena"
            - text: ", and a covariant extremal-surface generalization is proposed in"
            - link "[14]" [ref=e6227] [cursor=pointer]:
              - /url: "#bib-hrt"
            - text: . None of these arguments is a theorem of constructive quantum field theory, and the prescription remains a proposal. The holographic entropy cone of
            - link "28" [ref=e6228] [cursor=pointer]:
              - /url: "#thm:cone"
            - text: is defined through this prescription, so the completeness of that theorem is a completeness statement about the cone of a proposal. What is proved there is the combinatorial enumeration of the inequalities the proposal produces in the classical limit; what is not proved is that the prescription holds in any given theory.
          - paragraph [ref=e6230]:
            - emphasis [ref=e6231]: Remark 43
            - text: (Toy models). The HaPPY codes
            - link "[12]" [ref=e6232] [cursor=pointer]:
              - /url: "#bib-haappy"
            - text: are exactly solvable tensor-network models built from perfect tensors. Inside these models the Ryu-Takayanagi formula and the negativity of tripartite information hold exactly, and bulk logical operators admit multiple boundary representations that mimic wedge reconstruction. The models prove statements about tensor networks. They are not evidence about actual AdS/CFT beyond the analogy they are designed to exhibit, and no result of this paper treats them as evidence about gravity.
          - paragraph [ref=e6234]:
            - emphasis [ref=e6235]: Remark 44
            - text: (Entanglement and connectedness). Van Raamsdonk’s essay
            - link "[13]" [ref=e6236] [cursor=pointer]:
              - /url: "#bib-vanraamsdonk"
            - text: "argues that the emergence of classically connected spacetime is tied to quantum entanglement: disentangling the degrees of freedom of two regions makes the regions pinch off from each other, quantified by standard entanglement measures. The status of the statement is an argument based on examples, not a theorem. It states a research direction for reconstruction: if entanglement builds connectedness, then entanglement data should determine geometric data."
            - link "36" [ref=e6237] [cursor=pointer]:
              - /url: "#thm:malament"
            - text: shows what such a determination would have to look like as a theorem, with class, datum, and equivalence declared. No such theorem is claimed here.
          - paragraph [ref=e6238]:
            - text: The gap between these remarks and a reconstruction theorem of quantum gravity is not a technicality.
            - link "36" [ref=e6239] [cursor=pointer]:
              - /url: "#thm:malament"
            - text: recovers a conformal class from a causal order; it does not derive a metric from entanglement.
            - link "40" [ref=e6240] [cursor=pointer]:
              - /url: "#thm:dhw"
            - text: recovers operators inside a code subspace; it does not derive the code subspace from first principles. A derivation of spacetime geometry from informational data without assuming the geometry at the start would need both steps in reverse order and is not on the shelf.
          - paragraph [ref=e6242]:
            - emphasis [ref=e6243]: Remark 45
            - text: (What an upgrade would require). To promote the entanglement-connectedness argument
            - link "[13]" [ref=e6244] [cursor=pointer]:
              - /url: "#bib-vanraamsdonk"
            - text: to a theorem of the kind
            - link "7" [ref=e6245] [cursor=pointer]:
              - /url: "#def:reconstruction"
            - text: "asks for, three things would be needed: a probe datum consisting only of entanglement data on a declared family of subsystems, a proof that the datum determines a spacetime up to a declared equivalence, and a demonstration that the construction does not smuggle in the geometry at the start."
            - link "36" [ref=e6246] [cursor=pointer]:
              - /url: "#thm:malament"
            - text: shows the second item is achievable when the probe datum is a causal order and the equivalence is conformal.
            - link "37" [ref=e6247] [cursor=pointer]:
              - /url: "#cor:confactor"
            - text: shows that even then a conformal factor remains undetermined, so the third item requires either additional data or a theorem that the factor is physically irrelevant. None of the three items is established in the sources reviewed (cutoff 2026-10-29).
          - heading "Computational evidence" [level=2] [ref=e6248]
          - paragraph [ref=e6249]:
            - text: Three experiments accompany the claims above. They are recorded as evidence, run from
            - code [ref=e6250]: src/vol-08-spacetime-reconstruction/
            - text: ", and checked by the paper’s code evidence appendix. None of them proves anything: they test that the definitions behave as the proofs say on finite instances. The claims each experiment probes are listed in"
            - link "7" [ref=e6251] [cursor=pointer]:
              - /url: "#tab:checks"
            - text: and
            - link "8" [ref=e6252] [cursor=pointer]:
              - /url: "#tab:code"
            - text: .
          - paragraph [ref=e6253]:
            - text: The entropy experiment evaluates
            - link "(1)" [ref=e6254] [cursor=pointer]:
              - /url: "#eq:ssa"
            - text: and
            - link "(2)" [ref=e6255] [cursor=pointer]:
              - /url: "#eq:mmi"
            - text: on the witness vector of
            - link "29" [ref=e6256] [cursor=pointer]:
              - /url: "#prop:mmi"
            - text: "and on random classical distributions of three binary variables. The witness reproduces the proof exactly: every strong subadditivity inequality holds and monogamy fails by a margin of one. The random samples never violate strong subadditivity and violate monogamy in a positive fraction of cases, which is the computational shape of"
            - link "30" [ref=e6257] [cursor=pointer]:
              - /url: "#cor:classicalmmi"
            - text: ". The finite-order experiment enumerates the 242 partial orders on at most four labeled points and takes a census of the ladder rungs: no order carries an increasing loop, only 33 of the orders are distinguishing, and the antichain of two points is the witness of"
            - link "21" [ref=e6258] [cursor=pointer]:
              - /url: "#prop:distinguish"
            - text: . The Alexandroff experiment builds the up-set topology on each enumerated order and verifies
            - link "39" [ref=e6259] [cursor=pointer]:
              - /url: "#prop:specialization"
            - text: ": the closure of each singleton is its down-set and the topology recovers the order."
          - paragraph [ref=e6260]: "The Haskell layer records the same objects as typed instances of family classes defined outside this volume: Lorentzian spacetime systems with holonomy and causal-rung data, entropy-vector systems, and Thurston geometry types. The family classes are imported, never redefined. The Haskell code is executable modeling evidence. It has not been checked by a proof assistant, and the honest statement about its status is that the executable models are validated against the informal specifications in this paper, not that anything here is machine-checked."
