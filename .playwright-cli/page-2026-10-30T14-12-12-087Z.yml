            - text: factors, and no countable table of isomorphism classes can be complete. What it permits is a classification of the amenable class, which exists, and stratification of the general case by invariants of coarser grain, such as the Connes spectrum, which records partial information only
            - link "[24]" [ref=e823] [cursor=pointer]:
