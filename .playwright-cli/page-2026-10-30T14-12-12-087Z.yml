          - paragraph [ref=e1417]:
            - text: "The classification of finite simple groups delivers an exhaustive list, and practical identification runs through companion data of the Atlas kind: order, Schur multiplier, outer automorphism group, presentations, character tables with power maps"
            - link "[22]" [ref=e1418] [cursor=pointer]:
              - /url: "#bib-atlaswiki"
            - text: ". What it does not deliver is a uniform parameterization. Gorenstein’s verdict is the recorded one: no clean uniform description of the finite simple groups analogous to Dynkin diagrams is known"
            - link "[21]" [ref=e1419] [cursor=pointer]:
              - /url: "#bib-solomon2001"
            - text: ". The classification is complete and its parameterization is missing, so completeness of the list and existence of a parameter space are different achievements. The Killing-Cartan classification of complex semisimple Lie algebras achieves both: Dynkin diagrams parameterize, the invariant is complete, and recognition is algorithmic"
            - link "[18]" [ref=e1420] [cursor=pointer]:
              - /url: "#bib-humphreys"
            - text: ","
            - link "[19]" [ref=e1421] [cursor=pointer]:
              - /url: "#bib-fultonharris"
            - text: ". Darboux’s theorem shows a third configuration: locally, symplectic manifolds of the same dimension are all equivalent, so the local classification is complete and trivial and its content is entirely global"
            - link "[23]" [ref=e1422] [cursor=pointer]:
              - /url: "#bib-darboux"
