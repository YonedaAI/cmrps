            - text: "is checked computationally in Section 8. The regime vocabulary is the deliverable the periodic table of the program needs: a table must mark where no table can exist, and the seven regimes are the marks available."
          - paragraph [ref=e1659]: Each regime has an archetype. The Killing-Cartan classification is the archetype of the parameterized regime; the classification of finite simple groups is the archetype of the unparameterized regime; anomaly classification is the archetype of obstruction-complete; fusion categories are the archetype of open; the Cohen-Macaulay modules of the generic determinant are the archetype of wild; Markov properties of finitely presented groups are the archetype of undecidable; and unknot recognition is the archetype of decidable-but-unclassified. The archetypes are proved mathematics in every case, so the taxonomy rests on theorems rather than on analogy.
