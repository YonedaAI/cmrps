            - text: ", does not."
          - paragraph [ref=e3427]: "Together the four conditions describe the shape of the positive results the program may still earn: restricted-class theorems with stated hypotheses on tame domains, side by side with obstruction theorems registered at their full generality. That is the shape the evidence already has, and the regime table is where each domain’s share of it is recorded."
          - heading "Computational evidence" [level=2] [ref=e3428]
          - paragraph [ref=e3429]: The three experiments of this section are evidence about finite instances and growth patterns, not proofs. The claims they support are marked as computational in the code evidence appendix.
