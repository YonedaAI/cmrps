            - text: .
          - heading "Lessons from the model program" [level=3] [ref=e1910]
          - paragraph [ref=e1911]: The classification of finite simple groups is the reference point of the series, and three of its lessons structure the regime taxonomy.
          - paragraph [ref=e1912]:
            - text: The first lesson is that classification and parameterization are different achievements. The classification is complete, and the recorded verdict is that no clean uniform description of the finite simple groups analogous to Dynkin diagrams is known
            - link "[21]" [ref=e1913] [cursor=pointer]:
              - /url: "#bib-solomon2001"
            - text: . The unparameterized regime exists in the model program itself, which is why the regime taxonomy separates the two components of
            - link "5" [ref=e1914] [cursor=pointer]:
              - /url: "#def:program"
            - text: rather than collapsing them into one verdict of classified.
          - paragraph [ref=e1915]:
            - text: The second lesson is that practical identification runs through companion data. Practitioners identify finite groups by order, Schur multiplier, outer automorphism group, presentations, and character tables with power maps
            - link "[22]" [ref=e1916] [cursor=pointer]:
              - /url: "#bib-atlaswiki"
            - text: . These are not the complete invariant of the classification theorem; they are an atlas of computable fingerprints that make the classification usable. A classification program for physical systems will need the same two layers, theorem and atlas, and the regime taxonomy applies to the theorem layer while the atlas layer remains to be built.
          - paragraph [ref=e1917]:
            - text: The third lesson is that a completed classification can carry its own gaps and still be complete. The proof of the classification of finite simple groups was announced prematurely and completed only decades later
            - link "[21]" [ref=e1918] [cursor=pointer]:
              - /url: "#bib-solomon2001"
            - text: . Completeness is a property of the final statement and proof, not of announcements, and the claim discipline of the series records this by keeping announced results out of the theorem register until they are proved.
          - paragraph [ref=e1919]: None of the three lessons is an obstruction. Together they explain why the unparameterized regime is not a failure and why the regime taxonomy records seven shapes of evidence rather than one ladder of success.
          - heading "Regime stability" [level=3] [ref=e1920]
          - paragraph [ref=e1921]:
            - text: The regime assignment of
            - link "2" [ref=e1922] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: is dated evidence, and three kinds of event move rows.
          - paragraph [ref=e1923]:
            - text: A new theorem moves a row upward in the table. The fusion-category row moves from open to parameterized or unparameterized if the structural conjecture in that area closes; the Elliott program row moves when the program completes or when a counterexample to its uniqueness conjecture is proved; the four-dimensional existence row moves when the announced manuscript and its formalization are released and verified
            - link "[30]" [ref=e1924] [cursor=pointer]:
              - /url: "#bib-openai"
            - text: ","
            - link "[31]" [ref=e1925] [cursor=pointer]:
              - /url: "#bib-kitp"
            - text: ","
            - link "[25]" [ref=e1926] [cursor=pointer]:
              - /url: "#bib-cstarwiki"
            - text: ","
            - link "[26]" [ref=e1927] [cursor=pointer]:
              - /url: "#bib-fusionnlab"
            - text: .
          - paragraph [ref=e1928]:
            - text: A new obstruction moves a row downward. A proof that a recognition problem is unrecognizable, or that a representation category is wild, moves its domain into undecidable or wild and, by
            - link "12" [ref=e1929] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: ", moves every domain containing it isomorphism-reflectingly."
          - paragraph [ref=e1930]:
            - text: A change of equivalence moves rows sideways. If a domain is redefined under a coarser equivalence, its invariant becomes complete or incomplete for reasons that have nothing to do with new theorems;
