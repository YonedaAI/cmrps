              - text: restricts its quantifiers to a subdomain that excludes the part carrying the obstruction.
          - paragraph [ref=e3265]:
            - emphasis [ref=e3266]: Proof.
            - link "12" [ref=e3267] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: and
            - link "15" [ref=e3268] [cursor=pointer]:
              - /url: "#prop:undec"
            - text: deny the existence of the parameter space or of the recognizer over all of
            - generic [ref=e3270]:
              - math [ref=e3272]:
                - generic [ref=e3273]: C
              - generic [ref=e3277]: C
            - text: . A statement quantified over a subdomain that excludes the obstruction carries no contradiction, and the surveyed theorems of Section 6.1 are all of this form. ◻
          - paragraph [ref=e3278]:
            - link "19" [ref=e3279] [cursor=pointer]:
              - /url: "#cor:restrict"
            - text: "explains the shape of the completed islands. The restriction in each theorem is not a hedge and it is not removable by a better argument; it is the boundary the obstruction register draws. Two further points about the cost of hypotheses deserve recording. First, hypotheses can be subtle: braided extensions of the Doplicher-Roberts setting can require extra data beyond the braiding for the reconstruction to close, so the hypothesis list of a reconstruction theorem is part of its content and must travel with it. Second, a restriction can hide a boundary rather than a theorem: the tame side of the Grochow-Qiao divide admits polynomial-time isomorphism testing for the groups named, and the wild side fails the bounds their method needs"
            - link "[13]" [ref=e3280] [cursor=pointer]:
              - /url: "#bib-grochow2015"
            - text: . A classification program built on the tame side inherits the boundary as a working assumption.
          - heading "Regime boundaries" [level=3] [ref=e3281]
          - paragraph [ref=e3282]:
            - text: Where the tame-wild boundary sits for physical representation categories, as opposed to generic algebras, is unstudied. The generic mathematics supplies the dichotomy and the algorithmic shadow
            - link "[10]" [ref=e3283] [cursor=pointer]:
              - /url: "#bib-bekkert2003"
            - text: ","
            - link "[13]" [ref=e3284] [cursor=pointer]:
              - /url: "#bib-grochow2015"
            - text: ; no result on record locates the boundary for the tensor categories or representation categories that physical theories actually use. The question matters for the program, because a completeness theorem for a physical class is exactly a theorem that the class sits on the tame side.
          - paragraph [ref=e3285]:
            - text: Regime boundaries move in one further way. When an announcement matures into a published proof, its domain enters the table at the regime the proof supports; until then the claim is tracked outside the taxonomy, as in
            - link "2" [ref=e3286] [cursor=pointer]:
              - /url: "#tab:regimes"
            - text: ’s companion remark. The taxonomy records theorems, and announcements are not theorems.
          - paragraph [ref=e3287]:
            - text: The regime taxonomy records that boundaries are not always sharp walls. Unknot recognition is decidable and sits in NP and coNP, while its complexity class is open and no complete invariant is known
            - link "[6]" [ref=e3288] [cursor=pointer]:
              - /url: "#bib-hass1999"
            - text: ","
            - link "[7]" [ref=e3289] [cursor=pointer]:
              - /url: "#bib-lackenby2021"
            - text: . Between the classified and the impossible there are domains whose status is settled in one component of
            - link "5" [ref=e3290] [cursor=pointer]:
              - /url: "#def:program"
            - text: and unsettled in another. Any periodic table of the program must carry such entries honestly rather than forcing them into a binary verdict.
          - heading "The five obligations" [level=2] [ref=e3291]
          - paragraph [ref=e3292]:
            - text: The universal classification conjecture states that every admissible physical system is generated by a fixed collection of structural families under a fixed set of admissible constructions, up to a justified equivalence. Its proof obligations number five, and
            - link "3" [ref=e3293] [cursor=pointer]:
              - /url: "#tab:obligations"
            - text: gives their status against the evidence of this paper. The conjecture is a registered hypothesis and an object of analysis here; nothing in this section assumes it true or false.
          - table [ref=e3294]:
            - caption [ref=e3295]: Table 3. The five proof obligations of the universal classification conjecture and their status.
            - rowgroup [ref=e3296]:
              - row [ref=e3297]:
                - columnheader "Obligation" [ref=e3298]
                - columnheader "Content" [ref=e3299]
                - columnheader "Status" [ref=e3300]
