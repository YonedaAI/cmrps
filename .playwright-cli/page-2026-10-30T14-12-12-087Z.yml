            - emphasis [ref=e1904]: Remark 10
            - text: "(Assignment is evidence-shaped). The assignment records where the classification evidence of each domain sits as of October 2026. A domain moves when new theorems arrive: the fusion-category entry moves if the open conjecture closes"
            - link "[26]" [ref=e1905] [cursor=pointer]:
              - /url: "#bib-fusionnlab"
            - text: ". One tracked claim sits outside the table because it rests on announcements rather than published proofs: an October 2026 existence claim for four-dimensional Yang-Mills and QCD, whose status is exactly the standing one, existence claimed; manuscript and formalization withheld; verification pending"
