            - text: ": such a category is the representation category of a compact supergroup, unique up to isomorphism"
            - link "[9]" [ref=e3217] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: . The hypotheses are the restriction, and the Etingof-Gelaki counterexamples show that dropping the symmetric layer destroys the conclusion
            - link "[9]" [ref=e3218] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: . Deligne’s theorem classifies symmetric tensor categories of subexponential growth in characteristic zero along the same lines
            - link "[9]" [ref=e3219] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: .
          - paragraph [ref=e3220]:
            - text: Quantum channels occupy a middle position. Stinespring dilation classifies completely positive maps up to minimal dilation, unique up to unitary freedom, and the Choi-Kraus form is a normal form whose Kraus rank is an invariant of the form
            - link "[20]" [ref=e3221] [cursor=pointer]:
              - /url: "#bib-stinespring"
            - text: ","
            - link "[25]" [ref=e3222] [cursor=pointer]:
              - /url: "#bib-cstarwiki"
            - text: . The classification is of dilations, not of channels up to isomorphism, and the Kraus rank of a normal form is not an isomorphism invariant of the channel. This is a classification of a presentation, and the regime table places the domain in the unparameterized regime accordingly.
          - paragraph [ref=e3223]:
            - text: "The local symplectic classification is complete and trivial: Darboux’s theorem gives local normal form with no local invariants, so the classification content of the symplectic side is entirely global and topological"
            - link "[23]" [ref=e3224] [cursor=pointer]:
              - /url: "#bib-darboux"
            - text: . In the opposite direction, the Killing-Cartan classification of semisimple Lie algebras and the highest-weight classification of their irreducible representations deliver complete invariants with parameterizations
            - link "[18]" [ref=e3225] [cursor=pointer]:
              - /url: "#bib-humphreys"
            - text: ","
            - link "[19]" [ref=e3226] [cursor=pointer]:
              - /url: "#bib-fultonharris"
            - text: . The geometrization theorem decomposes closed 3-manifolds into exactly eight Thurston geometries
            - link "[16]" [ref=e3227] [cursor=pointer]:
              - /url: "#bib-geometrization"
            - text: ", and Chentsov’s theorem gives the Fisher metric as the unique metric monotone under stochastic maps, while the quantum analogue is a parametric family indexed by operator monotone functions"
            - link "[27]" [ref=e3228] [cursor=pointer]:
              - /url: "#bib-petzsudar"
            - text: . In every row the invariant is finite or parametric, and in every row the domain is stated with its restrictions.
          - heading "Hypotheses and their cost" [level=3] [ref=e3229]
          - paragraph [ref=e3231]:
