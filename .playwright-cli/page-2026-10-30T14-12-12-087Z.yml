            - text: are classified by homotopy classes of maps into the classifying space, and the characteristic classes are exactly the pullbacks of universal classes
            - link "[25]" [ref=e3198] [cursor=pointer]:
              - /url: "#bib-cstarwiki"
            - text: ". The restriction is topological: the classification is up to bundle isomorphism and it records no connection data. Anomalies are classified on the obstruction pattern: the gauge anomaly is a pair of cohomology classes whose vanishing is the condition for quantization, so the classification content is the obstruction itself"
            - link "[25]" [ref=e3199] [cursor=pointer]:
              - /url: "#bib-cstarwiki"
            - text: .
          - paragraph [ref=e3200]:
            - text: Doplicher-Roberts reconstruction classifies symmetric tensor *-categories with conjugates, direct sums, subobjects, and
            - generic [ref=e3202]:
              - math [ref=e3204]:
                - generic [ref=e3206]:
