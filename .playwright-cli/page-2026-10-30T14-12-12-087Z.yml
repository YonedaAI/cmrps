            - text: .
          - paragraph [ref=e953]: "What this forbids is any effective classification of four-manifolds in general, and any assumption that the finite-list paradigm of dimension three persists upward. What it permits is classification of restricted four-manifold classes, and the dimension contrast itself: finite tables exist in tame regimes, and dimension four is not one of them."
          - heading "Countable invariants" [level=3] [ref=e954]
          - paragraph [ref=e955]:
            - text: Descriptive set theory supplies a machine for proving that no classification by countable invariants can exist. Sasyk and Tørnquist applied Borel reducibility and Hjorth’s theory of turbulence to the isomorphism relation for separable von Neumann algebras
            - link "[15]" [ref=e956] [cursor=pointer]:
              - /url: "#bib-sasyk2009"
            - text: . The result, as recorded in the survey that this series relies on, is that isomorphism of separable von Neumann algebras admits no classification by countable invariants. The result is published in the Bulletin of Symbolic Logic, with the complete proof in Inventiones Mathematicae
            - link "[15]" [ref=e957] [cursor=pointer]:
              - /url: "#bib-sasyk2009"
            - text: .
          - paragraph [ref=e958]: What this forbids is a complete invariant for general von Neumann algebras taking values in a countable set, and any table of countably many labels exhausting the isomorphism classes. What it permits is classification by uncountable invariant sets, and classification by countable invariants on restricted subclasses.
          - heading "Tractability boundary" [level=3] [ref=e959]
          - paragraph [ref=e960]:
            - text: The tame-wild dichotomy has an algorithmic shadow. Grochow and Qiao gave polynomial-time algorithms for group isomorphism in the tame direction, for groups whose Sylow subgroups are cyclic, dihedral, semi-dihedral, or generalized quaternion, and showed that the representation-theoretic and cohomological bounds their algorithms need fail in the wild case
            - link "[13]" [ref=e961] [cursor=pointer]:
              - /url: "#bib-grochow2015"
            - text: . Their conclusion is that the tame-wild line of representation theory is a dividing line between the currently tractable and the currently intractable instances of group isomorphism.
          - paragraph [ref=e962]: What this forbids is any promise of a uniform polynomial-time classification procedure across the tame-wild boundary. What it permits is efficient recognition on the tame side, and a precise statement of where the known methods stop.
