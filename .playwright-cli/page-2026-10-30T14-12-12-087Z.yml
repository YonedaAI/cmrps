                  - generic [ref=e842]: End
                  - text: (1) =
                - generic [ref=e843]: C
            - text: as input and recovers a compact supergroup unique up to isomorphism
            - link "[9]" [ref=e844] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: ". The counterexample is the sharpest constraint in the register, and it is applied twice more in this paper: as an impossibility theorem in the transport analysis, and as a counterexample to a natural completion of the universal conjecture."
          - heading "Markov undecidability" [level=3] [ref=e845]
          - paragraph [ref=e846]:
            - text: "A classification program can aim at an algorithm: given a presentation of an object, decide which isomorphism class it lies in. For finitely presented groups this aim fails at the root. Adyan and Rabin proved that every Markov property of finitely presentable groups is algorithmically undecidable"
            - link "[1]" [ref=e847] [cursor=pointer]:
              - /url: "#bib-adyan1955"
            - text: ","
            - link "[2]" [ref=e848] [cursor=pointer]:
              - /url: "#bib-rabin1958"
            - text: . The list of Markov properties includes being trivial, being finite, and being simple, so even the coarsest structural tests on finitely presented groups admit no uniform decision procedure. Collins extended undecidability beyond Markov properties, proving that the Hopfian property is undecidable even though neither it nor its negation is Markov
            - link "[3]" [ref=e849] [cursor=pointer]:
              - /url: "#bib-collins1969"
            - text: .
          - paragraph [ref=e850]: What this forbids is any uniform recognition procedure for group-flavored sectors of a classification, including recognition of finiteness and simplicity. What it permits is decision of the same properties on restricted subclasses where the Markov construction does not embed, and it permits recognition procedures that are partial or that come with error. The proof reduces the halting problem to the group property through a Markov set construction, and Section 5 builds transport results on the same reduction pattern.
          - heading "Wildness" [level=3] [ref=e851]
          - paragraph [ref=e852]:
            - text: The tame-wild dichotomy of Drozd is the boundary of parametrizable representation theory. Bekkert and Drozd proved that every finite-dimensional algebra over an algebraically closed field is derived-tame or derived-wild, and that any degeneration of a derived-wild algebra is again derived-wild
            - link "[10]" [ref=e853] [cursor=pointer]:
              - /url: "#bib-bekkert2003"
            - text: ". Wildness is a property of the category of representations, and it is a non-classifiability statement rather than a difficulty rating. Buchweitz and Leuschke showed that the Cohen-Macaulay representation theory of the generic determinant is wild in a strong sense: already in rank two the isomorphism classes cannot be parametrized by a finite-dimensional variety over the coefficients"
            - link "[11]" [ref=e854] [cursor=pointer]:
              - /url: "#bib-buchweitz2005"
            - text: . Grevstad and May proved that the cohomological Mackey algebra is derived-wild whenever the group surjects onto a
            - generic [ref=e856]:
              - math [ref=e858]:
                - generic [ref=e859]: p
              - generic [ref=e863]: p
            - text: "-group of order greater than two, and concluded that no meaningful classification of compact"
