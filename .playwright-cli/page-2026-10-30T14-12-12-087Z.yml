          - heading "Limitations" [level=2] [ref=e3861]
          - paragraph [ref=e3862]: The regime taxonomy covers the domains of the series literature survey, and that survey ran on arXiv plus known-URL discovery; non-arXiv venues may be under-covered, so the taxonomy may meet domains that require an eighth regime. The seven regimes are complete for the surveyed list and are not claimed complete for mathematical physics.
          - paragraph [ref=e3863]:
            - text: The Sasyk-Tørnquist result is published in the Bulletin of Symbolic Logic, with the complete proof in Inventiones Mathematicae
            - link "[15]" [ref=e3864] [cursor=pointer]:
              - /url: "#bib-sasyk2009"
            - text: ; the series survey recorded it at announcement strength, and the published record is cited here.
          - paragraph [ref=e3865]:
            - text: The transport theorem quantifies over fully faithful functors. Physical re-presentation of a domain need not be fully faithful, and when it is not,
            - link "12" [ref=e3866] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: is silent. This is the point at which the choice of equivalence becomes a mathematical hypothesis rather than a formality.
          - paragraph [ref=e3867]: The universal classification conjecture is neither proved nor refuted here. The analysis shows that its unrestricted form collides with the register and that its restricted forms are where the provable content sits; whether a nontrivial restricted form yields a completeness theorem is open.
          - paragraph [ref=e3868]: A fifth limitation concerns the counterexamples of Section 5. Each refutes a specific natural completion of the classification picture, and none refutes every completion. The finite sporadic list fails in two sectors, the two-regime picture fails on two domains, and the plain tensor equivalence fails on explicit group pairs; a completion that avoids all three by construction is untouched by these results, and the register bounds it from the other side.
          - heading "Conclusion" [level=2] [ref=e3869]
          - paragraph [ref=e3870]:
            - text: "Completeness of a classification is a theorem about a domain and an equivalence relation, and the theorem holds where the invariant is finite or parametric and fails where proved obstructions stand. The register of Section 3 collects seven such obstructions, each forbidding a specific classification form, and the transport theorem shows the obstructions travel along fully faithful embeddings: a domain carrying a wild or undecidable sector in the manner of"
            - link "12" [ref=e3871] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: "inherits the obstruction. The regime taxonomy of Section 4 assigns the surveyed domains of the series to seven regimes, and the counterexamples of Section 5 refute three natural completions of the universal picture: a finite sporadic list, a two-regime account, and equivalence at the plain tensor layer."
          - paragraph [ref=e3872]: "The strongest defensible conclusion is negative and useful. A universal classification of all mathematical representations of physical systems, in the form of the classification of finite simple groups, is not attainable across the surveyed domains: uncountably many isomorphism classes, unrecognizable instances, and wild sectors forbid it as a matter of theorem. What is attainable, and what the regime table documents, is a program of restricted classification theorems on tame classes together with explicit obstruction theorems everywhere else. That shape of outcome was named as acceptable in the founding documents of the program, and the analysis here shows it is the shape the evidence has."
          - paragraph [ref=e3873]:
            - text: "The obligations of the universal conjecture remain four open and one partial, and the admissibility conditions that would give the conjecture a fixed premise remain unfixed. Those two facts set the agenda that the closing volume of the series inherits: fix admissibility, fix equivalence at a layer that survives"
            - link "18" [ref=e3874] [cursor=pointer]:
              - /url: "#prop:equiv"
            - text: ", and then read the regime table as the boundary between what a completeness theorem could cover and what an impossibility theorem already forbids."
