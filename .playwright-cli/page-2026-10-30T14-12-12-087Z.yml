          - paragraph [ref=e273]: Obstructions proved for mathematical isomorphism constrain physical equivalence directly on every subsector where physical equivalence coincides with isomorphism. On any subsector where two systems are physically equivalent if and only if their representations are isomorphic, wildness, undecidability, and non-classifiability transfer unconditionally. Coarser physical equivalences can identify additional representations globally, but they cannot dissolve proved mathematical obstructions on subsectors where isomorphism is preserved.
