            - text: "is the counterexample the register promised for the third proof obligation of the universal conjecture. Choosing an equivalence relation is not a formality: the plain tensor choice is a natural one, it is stated in one line, and it is provably wrong. Every equivalence admitted in the program must name the layers of structure it preserves, and the symmetric layer is the one that recovers the group."
          - heading "Common consequences" [level=3] [ref=e2922]
          - paragraph [ref=e2923]:
            - text: The four statements have a common consequence. Non-classifiability in the register is not a set of isolated pathologies; it travels along fully faithful embeddings (
            - link "12" [ref=e2924] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: ), along computable maps (
            - link "15" [ref=e2925] [cursor=pointer]:
              - /url: "#prop:undec"
            - text: ), and it defeats three natural completion schemes (Propositions
            - link "16" [ref=e2926] [cursor=pointer]:
              - /url: "#prop:sporadic"
            - text: to
            - link "18" [ref=e2927] [cursor=pointer]:
              - /url: "#prop:equiv"
            - text: ). A universal classification theorem for all admissible physical systems cannot be of CFSG form unless every wild, undecidable, and unrecognizable sector is excluded from its quantifiers. The exclusions are restrictions on the domain, and each restriction is a new admissibility condition of the kind that
            - link "4" [ref=e2928] [cursor=pointer]:
              - /url: "#rem:unfixed"
            - text: records as unfixed.
          - heading "Scope of the transport theorem" [level=3] [ref=e2929]
          - paragraph [ref=e2930]:
            - link "12" [ref=e2931] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: quantifies over functors injective on isomorphism classes, and its hypotheses are mathematical. Three remarks delimit its use.
          - paragraph [ref=e2932]: "The theorem transports refutations, not theorems. It moves wild embeddings and invariant obstructions from a subcategory to a larger category, and it moves undecidability along computable reductions. It does not transport positive classification results: a classification of a subcategory says nothing about the ambient category, which is why the completed islands of Section 6 each restate their own hypotheses."
          - paragraph [ref=e2933]: Full faithfulness is what carries the wild embedding, because it preserves the Hom-dimensions the universality property is built from; injectivity on isomorphism classes is what carries isomorphism behavior. Physical embeddings that deliberately identify systems fail the second hypothesis, and a coarse-graining map that forgets microscopic detail typically fails it as well, so the theorem is silent about classification programs run on coarse descriptions.
          - paragraph [ref=e2934]: The theorem applies at the level of domains, not of families. A family such as the operator-algebra family contains parameterized islands and obstruction-complete sectors side by side, and the transport theorem says which ambient domains inherit which failure. Regime assignment remains a domain-level judgment, and the two levels must not be confused.
          - heading "Restricted classification results" [level=2] [ref=e2935]
          - paragraph [ref=e2936]:
            - text: Completed classifications exist on restricted domains under explicit hypotheses, and each is an instance of
            - link "5" [ref=e2937] [cursor=pointer]:
              - /url: "#def:program"
            - text: . The restriction in each of them is load-bearing rather than removable by a better argument, as
            - link "19" [ref=e2938] [cursor=pointer]:
              - /url: "#cor:restrict"
            - text: records.
