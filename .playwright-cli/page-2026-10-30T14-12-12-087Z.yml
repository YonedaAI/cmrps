          - heading "Claim discipline" [level=3] [ref=e592]
          - paragraph [ref=e593]: "Three levels of achievement are distinguished throughout: mathematical formulation, rigorous theorem, and physical validation. The results of this paper sit at the second level. Nothing in this paper establishes physical validation of any representation, and no mathematical classification established here is presented as an empirical selection among physical theories. Where a claim rests on an announcement rather than a published proof, the text says so; one such claim is tracked in a remark outside the regime table."
          - heading "Obstruction register" [level=2] [ref=e594]
          - paragraph [ref=e595]: "Each obstruction below is a proved theorem, and it decides a question a classification program would otherwise have to settle by effort. Two conventions govern the collection. Only theorems with complete proofs in the mathematical literature enter; announcements stay out until they are proved. And an obstruction is recorded at the generality its proof supports: an undecidability result about finitely presented groups says nothing about finite groups, and a wildness result about modules over a specific algebra says nothing about modules over algebras on the tame side. Reading the register is a matter of reading the quantifiers."
