                - cell "Every generated structure is admissible" [ref=e3307]
                - cell "Open, same conditionality" [ref=e3308]
              - row [ref=e3309]:
                - cell "Equivalence" [ref=e3310]
                - cell "Distinct presentations of one system are identified correctly" [ref=e3311]
                - cell [ref=e3312]:
                  - text: Open;
                  - link "18" [ref=e3313] [cursor=pointer]:
                    - /url: "#prop:equiv"
                  - text: constrains every choice
              - row [ref=e3314]:
                - cell "Structural characterization" [ref=e3315]
                - cell "The families have precise mathematical definitions" [ref=e3316]
                - 'cell "Partial: families named, admissibility unfixed" [ref=e3317]'
              - row [ref=e3318]:
                - cell "Decomposition" [ref=e3319]
                - cell "Targeted classes assemble from the families" [ref=e3320]
                - cell "Open in general; proved in restricted domains" [ref=e3321]
          - paragraph [ref=e3322]:
            - text: The completeness obligation quantifies over
            - generic [ref=e3324]:
              - math [ref=e3326]:
                - generic [ref=e3329]:
                  - generic [ref=e3330]:
                    - generic [ref=e3331]: P
                    - generic [ref=e3332]: h
                    - generic [ref=e3333]: "y"
                    - generic [ref=e3334]: s
                  - generic [ref=e3335]:
                    - generic [ref=e3336]: a
                    - generic [ref=e3337]: d
                    - generic [ref=e3338]: m
              - generic [ref=e3341]:
                - generic [ref=e3342]: Phys
                - generic [ref=e3343]: adm
            - text: and is therefore conditional on the admissibility list that
            - link "4" [ref=e3353] [cursor=pointer]:
              - /url: "#rem:unfixed"
            - text: records as unfixed. Beyond the conditionality,
            - link "12" [ref=e3354] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: "blocks the obligation in any formulation whose generated class contains a wild or undecidable sector isomorphism-reflectingly: the parameter space the classification needs cannot exist there. The obligation is open today and its unrestricted form collides with the register."
          - paragraph [ref=e3355]: The soundness obligation runs in the other direction, from the generated class to the admissibility conditions. It is vacuous until the conditions are stated, and it becomes checkable only after the list is fixed. No obstruction in the register touches it directly; its difficulty is definitional.
          - paragraph [ref=e3356]:
            - text: The equivalence obligation is the one with a proved negative result attached.
            - link "18" [ref=e3357] [cursor=pointer]:
              - /url: "#prop:equiv"
            - text: shows that the natural plain tensor choice of equivalence is strictly coarser than isomorphism and merges distinct systems. Any solution must therefore name the layers of structure it preserves and must recover the group from the preserved layers where a group is present. The solution space is restricted by a counterexample, which is a stronger constraint than mere openness.
          - paragraph [ref=e3358]: The structural characterization obligation is partial on the evidence of record. The ten candidate families of the program are named with their defining structures and their established islands, and the admissibility conditions that would make the families exhaustive are unfixed. Naming a family is not characterizing it to the precision a completeness proof needs, and the gap between the two is where this obligation lives.
          - paragraph [ref=e3359]:
            - text: "The decomposition obligation asks that systems of the targeted classes assemble from the families under the admissible constructions. Restricted theorems exist: the finite-dimensional"
            - generic [ref=e3361]:
              - math [ref=e3363]:
                - generic [ref=e3366]:
                  - generic [ref=e3367]: C
                  - generic [ref=e3368]: ∗
              - generic [ref=e3371]:
                - text: C
                - generic [ref=e3372]: ∗
            - text: "-algebra decomposition assembles every algebra of that class from matrix blocks"
            - link "[25]" [ref=e3377] [cursor=pointer]:
              - /url: "#bib-cstarwiki"
            - text: ", amenable factors decompose by type"
            - link "[24]" [ref=e3378] [cursor=pointer]:
              - /url: "#bib-vnwiki"
            - text: ", and Doplicher-Roberts reconstruction assembles superselection data from symmetric tensor structure"
            - link "[9]" [ref=e3379] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: ". In general the obligation is open, and uniqueness of decomposition is open even before assembly is considered: interacting systems need not admit unique decompositions at all."
          - paragraph [ref=e3380]: "What survives the register is the restricted form the survey of the series anticipated: classification theorems on tame, restricted classes, plus explicit obstruction theorems where no classification can exist. The regime taxonomy of Section 4 states exactly which domains admit which of the two outcomes today, and Section 6 records the shape of every completed theorem on the positive side."
          - paragraph [ref=e3381]: "The consequences for a periodic table of mathematical physics are direct. A table with only status columns for proved and open is incomplete: it has no cell for the proved impossibilities, and the regime taxonomy supplies one regime per kind of impossibility. A table with a single row per family is too coarse at the boundaries, because a family such as the operator-algebra family contains parameterized islands, an unparameterized island, and an obstruction-complete sector at once. The right grain is the domain, not the family, and the right vocabulary is the seven regimes."
          - heading "Requirements for a completeness theorem" [level=3] [ref=e3382]
          - paragraph [ref=e3383]: The register and the transport results fix what any future completeness theorem must contain. Four conditions are necessary, and each is drawn from a proved obstruction rather than from preference.
          - paragraph [ref=e3384]:
            - text: The quantifier must be restricted. By
            - link "19" [ref=e3385] [cursor=pointer]:
              - /url: "#cor:restrict"
            - text: ", a domain carrying a wild or undecidable sector in the manner of"
            - link "12" [ref=e3386] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: supports no completeness statement unless the quantifier excludes the part carrying the obstruction. A theorem over a class that embeds the generic determinant’s modules, or a Markov construction, is false before its proof begins.
          - paragraph [ref=e3387]:
            - text: The equivalence must name its layers. By
            - link "18" [ref=e3388] [cursor=pointer]:
              - /url: "#prop:equiv"
            - text: ", any equivalence forgetting the symmetric layer merges distinct systems, so the identification relation of the theorem must state the preserved structure and must recover groups where groups are present."
          - paragraph [ref=e3389]:
            - text: The parameter space must be structured. By
            - link "6" [ref=e3390] [cursor=pointer]:
              - /url: "#def:param"
            - text: and
            - link "7" [ref=e3391] [cursor=pointer]:
              - /url: "#lem:countable"
            - text: ", a bare set-theoretic indexing carries no content, and countable-valued complete invariants cannot exist where uncountably many classes or Borel non-reducibility stand. The parameterizer must be an algebraic family, a standard Borel parametrization, or a finite combinatorial set of the kind"
            - link "5" [ref=e3392] [cursor=pointer]:
              - /url: "#def:program"
            - text: names.
          - paragraph [ref=e3393]:
            - text: The premise must be fixed. By
            - link "4" [ref=e3394] [cursor=pointer]:
              - /url: "#rem:unfixed"
            - text: ", a theorem over an admissible class whose conditions are unfixed is conditional on the list one adopts. A completeness theorem that quantifies over"
