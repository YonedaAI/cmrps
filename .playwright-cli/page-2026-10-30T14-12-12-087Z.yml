          - heading "Tensor-category recovery" [level=3] [ref=e824]
          - paragraph [ref=e825]:
            - text: A natural proposal for identifying physical systems is to compare their representation categories as tensor categories and declare two systems equivalent when the categories are equivalent. The proposal fails. Etingof and Gelaki constructed pairs of non-isomorphic finite groups whose representation categories are equivalent as plain tensor categories
            - link "[9]" [ref=e826] [cursor=pointer]:
              - /url: "#bib-eg2000"
            - text: . The symmetric structure of the category is not recoverable from the plain tensor layer, and two different symmetry groups present the same plain tensor representation theory.
          - paragraph [ref=e827]:
            - text: "What this forbids is any classification or equivalence criterion that discards the monoidal or symmetric layer: such a criterion is not merely imprecise, it is false on explicit counterexamples. What it permits is the Doplicher-Roberts style of reconstruction, which takes the symmetric tensor structure with its conjugates, direct sums, subobjects, and"
            - generic [ref=e829]:
              - math [ref=e831]:
