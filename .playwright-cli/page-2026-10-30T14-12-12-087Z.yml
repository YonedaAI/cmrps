            - text: is unrecognizable, improving the previous bound of twelve due to Gordon
            - link "[14]" [ref=e949] [cursor=pointer]:
              - /url: "#bib-tancer2023"
            - text: . Filipkiewicz classified the four-dimensional maximal model geometries and found eighteen of them plus one countably infinite family, against exactly eight in dimension three
            - link "[16]" [ref=e950] [cursor=pointer]:
