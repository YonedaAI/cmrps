              - text: .
          - paragraph [ref=e2735]:
            - emphasis [ref=e2736]: Proof.
            - text: "Both lower bounds refute finiteness of the exceptional set: uncountably many classes cannot be listed as finitely many sporadics, and a countably infinite family of model geometries is not finite. Any classification whose final form is families plus finitely many sporadics is therefore false in these sectors before its completeness is even considered. ◻"
          - paragraph [ref=e2738]:
            - strong [ref=e2739]: Proposition 17
            - text: (The two-regime picture fails).
            - emphasis [ref=e2740]:
              - text: The taxonomy that sorts domains into classified and impossible misassigns at least two surveyed domains. Unknot recognition is decidable and sits in NP and coNP, while its complexity class is open and no complete invariant is known
              - link "[6]" [ref=e2741] [cursor=pointer]:
                - /url: "#bib-hass1999"
              - text: ","
              - link "[7]" [ref=e2742] [cursor=pointer]:
                - /url: "#bib-lackenby2021"
              - text: . The finite simple groups are completely classified and carry no uniform parameterization
              - link "[21]" [ref=e2743] [cursor=pointer]:
                - /url: "#bib-solomon2001"
              - text: . The first domain is decidable but unclassified; the second is classified but unparameterized. Neither fits a two-regime picture.
          - paragraph [ref=e2745]:
            - emphasis [ref=e2746]: Proof.
            - text: Decidable-but-unclassified and classified-but-unparameterized are distinct shapes of evidence, exhibited by the two named domains. Any taxonomy with two regimes assigns both domains to the same regime, and in that regime one of the two descriptions of the evidence is wrong. Hence the two-regime picture is refuted, and the seven regimes of
            - link "9" [ref=e2747] [cursor=pointer]:
              - /url: "#def:regime"
            - text: are needed to keep the descriptions straight. ◻
