            - text: factors; tensor-category equivalence without symmetric structure does not determine the group; every Markov property of finitely presentable groups is algorithmically undecidable; wild representation categories admit no parametrization by a finite-dimensional variety; homeomorphism of a specific closed four-manifold is unrecognizable; isomorphism of separable von Neumann algebras admits no classification by countable invariants; and the tame-wild dichotomy bounds algorithmic tractability. From these results a classification program is defined as a triple of complete invariant, parameter space, and recognition procedure, and each surveyed domain of mathematical physics is assigned to one of seven regimes. A transport theorem shows that wild embeddings and invariant obstructions propagate along fully faithful functors, so such obstructions travel with any fully faithful re-presentation of a domain. Counterexamples refute three natural completions of the universal classification conjecture. The conjecture itself is examined obligation by obligation and is never used as a lemma. Completeness holds in restricted tame regimes and is provably unattainable elsewhere without further restrictions.
          - heading "Introduction" [level=2] [ref=e49]
          - paragraph [ref=e50]:
            - text: "The classification of finite simple groups is the model of what a total classification theorem looks like: every object of the domain falls into an explicitly described list of families and exceptions, and the list is exhaustive"
            - link "[21]" [ref=e51] [cursor=pointer]:
              - /url: "#bib-solomon2001"
            - text: . The research program of this series asks whether mathematical representations of physical systems admit an analogous classification. The question is precise enough to be attacked only after fixing an equivalence relation on representations, a notion of admissible system, and a catalogue of constructions from which complex systems are assembled. The central identity of the program, that every admissible system is generated by a fixed collection of structural families under a fixed set of constructions, remains a registered conjecture.
          - paragraph [ref=e52]: "Impossibility theorems bound the structure of classification programs as tightly as exhaustive enumerations do. A theorem showing that no complete invariant or parameter space can exist in a stated generality marks the same kind of mathematical boundary as a theorem listing the objects. The analysis below works out those boundaries for mathematical representations of physical systems: it compiles seven proved obstruction theorems, refutes three natural completions of the universal classification conjecture on explicit counterexamples, and keeps the conjecture itself as an object of study rather than a premise."
          - paragraph [ref=e53]: Seven proved obstruction theorems forbid specific forms of classification, and a regime taxonomy applies them to every domain surveyed in the series. A transport theorem, proved here, shows the obstructions survive fully faithful re-presentation of a domain, and three counterexamples, also proved here, refute natural completions of the universal classification problem.
          - paragraph [ref=e54]: "Established results are cited to the mathematical literature and are used at the strength their proofs support. New statements are proved in full or narrowed until they can be. Counterexample search is part of the method and not an afterthought: for every natural completion of the classification picture considered here, an explicit counterexample was sought, and three completions failed the search. Computational experiments accompany the paper as evidence about finite instances; they are never treated as proofs."
          - paragraph [ref=e55]:
            - text: Wild embeddings and invariant obstructions transport along fully faithful functors, so a wild or undecidable sector embedded in the manner of
            - link "12" [ref=e56] [cursor=pointer]:
              - /url: "#thm:transport"
            - text: "carries its obstruction into the larger domain. The surveyed domains occupy seven distinct regimes, and no coarser taxonomy places them all. Three natural strengthenings of the universal classification conjecture are false: the number of exceptional isomorphism classes in the operator-algebra sector is uncountable, the two-regime picture of classified versus impossible is refuted by concrete domains, and equivalence defined at the plain tensor layer fails to identify systems correctly. The universal conjecture itself, examined against its five proof obligations, has four open obligations and one partial obligation, and its statement is conditional on an unfixed admissibility list."
