            - text: "-modules exists at odd primes"
            - link "[12]" [ref=e916] [cursor=pointer]:
              - /url: "#bib-grevstad2025"
            - text: .
          - paragraph [ref=e917]: What this forbids is any finite-variety parameterization of the isomorphism classes of a wild representation category, and any classification of a domain that contains such a category as an isomorphism-reflecting subcategory. What it permits is a complete classification theory on the tame side, where parametrizations do exist, and partial invariants on the wild side that ignore the wild core.
          - heading "Four-manifold unrecognizability" [level=3] [ref=e918]
          - paragraph [ref=e919]:
            - text: In dimension three the geometrization theorem decomposes every oriented prime closed 3-manifold into pieces carrying one of exactly eight Thurston geometries
            - link "[16]" [ref=e920] [cursor=pointer]:
              - /url: "#bib-geometrization"
            - text: . In dimension four the finite-table picture breaks. Markov’s construction shows that unrecognizable four-manifolds exist, that is, manifolds for which the homeomorphism problem is undecidable. Tancer sharpened the construction to show that the connected sum of nine copies of
            - generic [ref=e922]:
