          - paragraph [ref=e896]: "Two properties of the framework control later claims. First, the relational profile is a function of the morphisms in force and of nothing else; a profile computed in a category of coarse-grainings is a different mathematical object from a profile computed in a category of isomorphisms. Second, the profile is relational data rather than parameter data: it assigns to each probe a set of relationships, and it does not take values in any fixed parameter space of invariants. Classification theorems in the sense of the series demand invariants whose values determine objects up to the chosen equivalence; profiles determine objects up to isomorphism by a different mechanism entirely."
