                - text: is the closest existing statement, and it is a theorem about processes in frameworks with duality, not about physics at large.
          - paragraph [ref=e9307]: "The first problem is the volume’s headline: the two islands of concrete relational results, quantum supermaps and probe reconstruction, have never been shown to be instances of one theorem. Marking the synthesis as open is not a rhetorical hedge. A unification theorem would be a substantial result, and its absence bounds every claim this paper makes about a general relational principle."
          - heading "Conclusion" [level=2] [ref=e9308]
          - paragraph [ref=e9309]: "The Yoneda embedding gives mathematical representations of physical systems a rigorous relational characterization. Objects are determined up to isomorphism by their admissible relationships with all probes; the determination is exact, and it is what the embedding establishes. In two concrete corners the relational content does more than hold formally: supermaps are representable in settings with channel-state duality, and reconstruction theorems recover objects from probe categories exactly. In exchange for these results one must state the declared category and its morphisms, declare the layers of structure an identification preserves, and accept that none of this yields physical equivalence, empirical adequacy, or a classification theorem."
          - paragraph [ref=e9310]:
            - text: The non-implication theorem of
            - link "3" [ref=e9311] [cursor=pointer]:
              - /url: "#sec:relational"
            - text: "is the load-bearing negative result: representability holds in categories where no classification exists, so the classification content of any relational program must be proved separately, in tame regimes, from family-specific invariants. That is a narrow statement and an exact one. It leaves the research program of this series intact, because the program asks for restricted classification theorems and explicit obstructions rather than for a single global table, and it places relational characterization in its correct role: a determination principle whose physical and classificatory content are further theorems, each with hypotheses of its own."
          - paragraph [ref=e9312]:
            - text: "The balance of the volume is therefore asymmetric in a deliberate way. On the positive side stand three exact results: the Yoneda lemma with its corollaries, the Choi correspondence and the supermap representability it supports, and the probe reconstruction theorems with their declared hypotheses. On the negative side stand three refusals: relational equivalence is not physical equivalence, representability is not classification, and equivalence at one layer of structure is not equivalence at another. The refusals are not caveats appended to the results; they are theorems about what the results cannot deliver, and together they state the scope of the relational program with a precision that the slogan alone lacks. Within that scope, objects are determined by their relationships, and the remaining questions of the classification program are open in exactly the places"
            - link "9" [ref=e9313] [cursor=pointer]:
              - /url: "#sec:synthesis"
            - text: names.
          - paragraph [ref=e9314]:
            - text: "The title of the volume names a principle, and the sense of the name should be exact. The Yoneda classification principle is a principle about determination: objects of a declared category of representations are classified by their relational profiles up to isomorphism of that category. It is not a classification theorem in the sense of the program, and this paper has proved that it cannot be one without further input. Read in the determination sense, the principle is a theorem today; read in the classification sense, it is a research direction whose progress runs through tame families, declared equivalences, and the open synthesis of"
            - link "9" [ref=e9315] [cursor=pointer]:
              - /url: "#sec:synthesis"
            - text: .
