          - heading "Yoneda-principle synthesis" [level=2] [ref=e9224]
          - paragraph [ref=e9225]: "The open problems of this volume cluster around one question: is there a single principle behind relational representation of physical systems, covering the supermap line, the reconstruction theorems, and the formal Yoneda embedding at once? The problems below are stated in order of centrality. None is solved here."
