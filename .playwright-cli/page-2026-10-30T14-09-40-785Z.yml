            - heading "Abstract" [level=2] [ref=e25]
            - text: "The Yoneda embedding sends each object of a category to the functor it represents through its relationships with all other objects. This paper develops the relational characterization of mathematical representations of physical systems that the embedding supplies, and it states precisely what the embedding does not supply. The Yoneda lemma determines an object up to isomorphism by its relational profile, and the embedding is fully faithful on any locally small category of representations once the admissible morphisms are fixed. Concrete representability results for quantum supermaps show that in settings with channel-state duality the relational content is not merely formal, and the classical reconstruction theorems of Gelfand, Stone, and Doplicher and Roberts recover objects from categories of probes. Against these results stands a governing constraint: Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem. A non-implication theorem makes the third denial precise, because full faithfulness holds in categories where isomorphism classes admit no finite-variety parametrization, so representability cannot be the source of a classification theorem. The paper separates established mathematics from conjectural physical interpretation throughout and records the open problem of unifying the supermap line with the reconstruction pattern."
          - heading "Introduction" [level=2] [ref=e26]
          - paragraph [ref=e27]:
            - text: "A mathematical representation of a physical system is a tuple of data: a state space, an observable algebra, dynamical laws, symmetry and constraint data, and composition rules. Two questions about such a tuple are easy to confuse. The first asks which equations describe the system. The second asks what relationships the system admits with every other system. Its formal home is the Yoneda embedding"
