            - text: records the open problem that would.
          - paragraph [ref=e156]: "The classification problem of the program asks for the fundamental structural families of mathematical physics, the operations that assemble systems from them, and the equivalences that connect presentations. The Yoneda embedding lets the third question be phrased without choosing a presentation: an object is what it does to probes. A classification theorem built on relational data must supply invariants beyond representability, because representability delivers determination up to isomorphism and no parameterization of isomorphism classes. A physical reading of relational data must pass the qualification quoted above, because the morphisms defining the profiles are mathematical choices rather than physical identifications. Restricted regimes remain the available home for classification theorems."
          - paragraph [ref=e157]: Three distinctions organize the results. Mathematical equivalence, isomorphism of representations, is not physical equivalence, the chosen identification of systems in the world. Relational characterization establishes the first and touches the second only through the morphisms one feeds to it. Neither notion is empirical adequacy, which lives in a separate layer of the architecture.
