            - text: "has with every probe. That shift is exact mathematics. What it is not is a classification, a theory of physical equivalence, or a theory of empirical adequacy. A standing constraint of the series states the limit in one sentence, in its exact words: “Yoneda does not, by itself, establish physical equivalence, empirical adequacy, or a classification theorem.” The sentence governs everything that follows."
          - paragraph [ref=e148]:
            - text: "The relational profile of a representation determines that representation up to isomorphism in a declared category of morphisms, and it determines nothing beyond that isomorphism. Full faithfulness preserves isomorphism classes without constraining how those classes are parameterized, so relational data yields no classification invariants on its own. Concrete physical recovery happens only where extra structure is assumed: channel-state duality for quantum supermaps, symmetric monoidal structure for Doplicher-Roberts reconstruction. On the positive side stand the Yoneda lemma and its corollaries, the Choi correspondence and the supermap representability it supports"
