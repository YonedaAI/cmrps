                - cell "Modules over the generic determinant" [ref=e4537]
                - cell "None of finite-variety type" [ref=e4538]
                - cell "Classification itself" [ref=e4539]
          - paragraph [ref=e4540]:
            - text: "The second regime is the reminder that even a completed classification can lack a uniform parameterization, which is why the classification problem of this series asks for families and constructions rather than for a single list. The third regime is where this paper lives: determination is available everywhere, and classification content is a further achievement of particular families. The fourth regime is the boundary drawn by Theorem"
            - link "16" [ref=e4541] [cursor=pointer]:
              - /url: "#thm:noimplication"
            - text: ": in wild settings determination persists and classification does not, and no amount of representability changes that. A relational program for classification must therefore work through the second regime, converting determination into family-specific invariants wherever tame structure allows."
          - heading "Supermap representability" [level=2] [ref=e4542]
          - paragraph [ref=e4543]:
            - text: "Formal category theory gives relational profiles no matter what the objects are. The question of whether relational content is ever concretely computational, rather than formal, has a positive answer in one corner of quantum theory: quantum supermaps, the transformations of quantum channels. The representability theorems of 2024 to 2026 show that in settings with channel-state duality, categorical supermaps are concretely representable, and that Yoneda representability underlies factorisation theorems for them"
