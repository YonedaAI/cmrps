          - paragraph [ref=e4506]:
            - text: The three denials of the governing constraint now have their mathematical content. Physical equivalence is a choice of morphisms or relations that the embedding does not make. Empirical adequacy is a property of how a representation meets observation, a separate layer of the architecture from mathematical classification. A classification theorem is a supply of separating invariants, and Theorem
            - link "16" [ref=e4507] [cursor=pointer]:
              - /url: "#thm:noimplication"
            - text: shows that representability is logically independent of such a supply. What Yoneda does establish is Corollary
            - link "11" [ref=e4508] [cursor=pointer]:
              - /url: "#cor:releq"
            - text: ": objects are determined by their relationships, up to the isomorphism encoded in the declared morphisms."
          - heading "Determination and classification" [level=3] [ref=e4509]
          - paragraph [ref=e4510]:
            - text: Structural knowledge of a family falls into one of four regimes, recorded in Table
