            - text: ; the Yoneda embedding belongs to the third.
          - table [ref=e4512]:
            - caption [ref=e4513]: Table 1. Four regimes of structural knowledge. The Yoneda embedding supplies determination; classification content comes from the invariants of each family; the wild regimes forbid finite-variety classification outright.
