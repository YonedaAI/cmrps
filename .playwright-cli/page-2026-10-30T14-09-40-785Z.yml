            - term [ref=e9303]: Status of the slogan
            - definition [ref=e9304]:
              - paragraph [ref=e9305]:
                - text: A Yoneda lemma for physics is a slogan until it is a theorem with hypotheses. What precise statement would earn the name? A candidate must specify the category of representations, the morphisms in force, the notion of determination, and the layer of physical structure it addresses; the slogan alone supports none of these. Theorem
                - link "20" [ref=e9306] [cursor=pointer]:
