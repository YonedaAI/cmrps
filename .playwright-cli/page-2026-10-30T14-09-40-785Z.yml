                  - generic [ref=e6665]: A ⊗
                  - generic [ref=e6666]: B
              - text: ", preserved by composition. Then the categorical supermaps of"
              - generic [ref=e6668]:
                - math [ref=e6670]:
                  - generic [ref=e6671]: T
                - generic [ref=e6675]: T
              - text: "are concretely representable through that duality: every supermap corresponds to a process of the composite system, and representability yields the factorisation theorems for causally ordered supermaps."
          - paragraph [ref=e6677]:
            - emphasis [ref=e6678]: Proof.
            - text: The statement is the representability lemma established in
            - link "[1]" [ref=e6679] [cursor=pointer]:
              - /url: "#bib-whh"
            - text: ; the factorisation theorems are proved in
            - link "[2]" [ref=e6680] [cursor=pointer]:
              - /url: "#bib-hw"
            - text: . We record the result as a registered input of the series and do not reproduce the arguments there. Proposition
            - link "18" [ref=e6681] [cursor=pointer]:
              - /url: "#prop:choi"
            - text: "verifies the hypothesis in the finite-dimensional matrix setting: the Choi matrix identifies each channel with a state of the composite system, and composition of channels matches contraction of Choi indices, so the duality is preserved by composition as the hypothesis requires. ◻"
          - paragraph [ref=e6683]:
            - emphasis [ref=e6684]: Remark 21
            - text: (What the theorem shows). Theorem
            - link "20" [ref=e6685] [cursor=pointer]:
              - /url: "#thm:supermap"
            - text: "is the one recorded setting where relational representability is concretely computational: the relationships between processes are themselves processes, and factorisation statements follow. The hypotheses travel with the theorem. Channel-state duality of the required kind is a property of particular frameworks, and no claim is made here that every setting of interest has it, or that the result extends from quantum processes to mathematical representations of physical systems at large. Wilson, Hefford, and Hoffreumon"
            - link "[1]" [ref=e6686] [cursor=pointer]:
              - /url: "#bib-whh"
            - text: apply the same lemma to generalised circuit theories, including boxworld and real quantum theory, which shows the hypothesis is checkable theory by theory rather than automatic.
          - paragraph [ref=e6687]:
            - text: "The supermap setting supports one precise reading of the relational program: once the morphisms are fixed as process transformations and a channel-state duality is available, the profile of a process is not formal data but computable data. That is genuine content, and it is narrower than the slogan of a Yoneda lemma for physics."
            - link "9" [ref=e6688] [cursor=pointer]:
              - /url: "#sec:synthesis"
            - text: records how much narrower.
          - heading "Factorisation theorems" [level=3] [ref=e6689]
          - paragraph [ref=e6690]:
            - text: The representability statement is not the end of the supermap line. The same authors use it to prove factorisation theorems
            - link "[2]" [ref=e6691] [cursor=pointer]:
              - /url: "#bib-hw"
            - text: ", and the shape of those theorems is the clearest existing instance of relational structure producing concrete process structure."
          - paragraph [ref=e6692]:
            - text: The 2024 work
            - link "[2]" [ref=e6693] [cursor=pointer]:
              - /url: "#bib-hw"
            - text: "identifies morphisms of strong profunctors as a categorification of quantum supermaps, which places these black-box generalisations of diagrams with holes inside the theory of profunctor optics. From this vantage it constructs abstract logical connectives for supermaps, including tensor products and negations, in a theory-independent setting. Three structural features of quantum supermaps are then modelled by these connectives alone: black-box indefinite causal order, black-box definite causal order, and the factorisation of definitely causally ordered supermaps into concrete circuit diagrams. The 2026 work"
            - link "[1]" [ref=e6694] [cursor=pointer]:
              - /url: "#bib-whh"
            - text: states the mechanism as the lemma of Theorem
            - link "20" [ref=e6695] [cursor=pointer]:
              - /url: "#thm:supermap"
            - text: ", and the lemma eliminates guesswork in defining supermaps for a given theory."
          - paragraph [ref=e6696]:
            - text: "Two features of this line matter for the classification program. The factorisation theorems are classification-like results for a restricted class: under a causal-order hypothesis, supermaps decompose into circuit data, which is determination by constituents in the sense of decomposition rather than determination by probes. The hypotheses are physical and checkable per theory, and"
            - link "[1]" [ref=e6697] [cursor=pointer]:
              - /url: "#bib-whh"
            - text: applies them to generalised theories, including boxworld and real quantum theory, rather than to quantum theory alone. The relational principle has so far earned its keep as a method with hypotheses, not as a universal law.
          - heading "Reconstruction from probes" [level=2] [ref=e6698]
          - paragraph [ref=e6699]: "A second family of results shares the shape of the relational program: reconstruction theorems, which recover an object from a category of probes attached to it. The pattern is older than the supermap line and its settings are exact."
