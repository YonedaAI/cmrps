            - text: shows how literally the probe reading can be taken in the commutative case. Whether the supermap representability line and these reconstruction theorems are instances of one principle is not settled by the present evidence. The resemblance is a research observation; no unifying theorem is claimed in this paper, and the qualification of the governing constraint applies to every attempt to synthesize them.
          - paragraph [ref=e7569]:
            - text: The boundaries of the islands are as informative as their statements. Gelfand duality classifies the commutative unital part of the operator-algebra family and stops at noncommutativity, where the Gelfand-Naimark theorem supplies an embedding but no classification. Stone duality reaches exactly the zero-dimensional compact spaces and the Boolean algebras, and no further. Doplicher-Roberts reconstruction is available only under symmetric tensor hypotheses, and
            - link "6" [ref=e7570] [cursor=pointer]:
              - /url: "#sec:equivalence"
            - text: "shows that weakening the symmetric layer destroys the recovery of the group in general. Each theorem is an equivalence of categories with a domain of validity, and the domains do not presently overlap into one principle. A further distinction runs through all three: they determine objects by an equivalent category of probes, which is not parametric classification in the sense of Definition"
            - link "15" [ref=e7571] [cursor=pointer]:
              - /url: "#def:classify"
            - text: ", since the probe objects are as varied as the objects determined."
