            - text: . The probes are the localized endomorphisms, and the recovered object is the compact supergroup implementing the superselection sectors. When the parity twist is trivial, the recovered object is an ordinary compact group; the supergroup form records a non-trivial parity in the symmetric structure. The finite-group statements of
            - link "6" [ref=e7319] [cursor=pointer]:
              - /url: "#sec:equivalence"
            - text: are the trivial-twist case, where a symmetric representation category recovers the group itself. This is the sense in which a physical setting supplies a probe category by construction; it is also the reason the hypotheses are physical, not just technical.
          - paragraph [ref=e7320]:
            - text: "Each theorem has the same shape: a category of probes determines the object. For Gelfand, the probes are characters; for Stone, the probes are ultrafilters; for Doplicher-Roberts, the probes are the localized endomorphisms of a net of observables. In each case the recovering functor is contravariant, and in each case the statement is an equivalence of categories, which is stronger than determination of a single object. Table"
