          - paragraph [ref=e9110]: "The taxonomy declarations record vocabulary: the abstract components of the probe system and the group system are opaque identifiers, so those declarations index the definitions of the taxonomy rather than encode mathematics at the type level. The typed channel fragment and the Python experiments are the computational evidence proper. No claim of machine verification is made anywhere in this volume; a later mechanization could audit the executable models against kernel-checked specifications, which would be a cross-audit of models rather than a verification of the claims."
          - heading "Limitations" [level=2] [ref=e9111]
          - paragraph [ref=e9112]: Each denial of the governing constraint is a precise limitation. They are stated below in the order the constraint lists them.
          - paragraph [ref=e9113]:
            - emphasis [ref=e9114]: Physical equivalence.
            - text: Corollary
            - link "11" [ref=e9115] [cursor=pointer]:
              - /url: "#cor:releq"
            - text: shows that relational equivalence is isomorphism in the declared category. Physical equivalence is a chosen relation on representations, motivated by the observation that two mathematical descriptions may describe the same physics without being isomorphic, and the correct choice of that relation is open. The Yoneda embedding neither supplies the choice nor validates one. Any claim that two systems are physically equivalent because their relational profiles agree is therefore unsupported unless the morphisms in force have themselves been justified as physical equivalences.
          - paragraph [ref=e9116]:
            - emphasis [ref=e9117]: Empirical adequacy.
            - text: "A mathematical structure can be consistent without describing our universe, and several mathematically distinct theories can produce identical predictions in an experimentally accessible regime. Empirical selection is a separate layer of the architecture from mathematical classification, and the Yoneda embedding lives entirely on the mathematical side. The layer is left unformalized here by design: its mathematical content is the subject of observational equivalence, and the claim of this paper is only that relational data does not supply it."
          - paragraph [ref=e9118]:
            - emphasis [ref=e9119]: Classification.
            - text: Theorem
            - link "16" [ref=e9120] [cursor=pointer]:
